<title>Sabathia 우편함</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Black&family=Archivo:ital,wght@1,700;1,800&family=Black+Han+Sans&family=Jost:wght@700;900&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
/* 책상 위 우편함 → 상자 → 비닐 → 넘기는 잡지 → 부록 싱글. 어두운 책상 한 가지 모습. 잡지마다 지면 색·글꼴은 .t-* 변수로 */
:root{
  --desk:#24201c; --desk2:#2e2924; --kraft:#c79f68; --kraft2:#a9814e; --kraftIn:#7d5f38;
  --ink:#161514; --mute:#5c5852; --hint:#e9e2d6;
  --packtape:rgba(150,104,52,.88); --clear:rgba(255,248,214,.5);
  --sans:'Noto Sans KR',system-ui,sans-serif; --serif:'Noto Serif KR',Georgia,serif; --mono:'Nanum Gothic Coding',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 30%,var(--desk2),var(--desk));color:var(--hint);font-family:var(--sans);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
button{font:inherit}
.chip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(36,32,28,.6);color:var(--hint);border:1px solid rgba(233,226,214,.35);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;font-size:13px;z-index:50}
.chip:focus-visible,#bar button:focus-visible{outline:2px solid #f59ad6;outline-offset:2px}
#home{left:max(16px,env(safe-area-inset-left,0px))}
#again{right:max(16px,env(safe-area-inset-right,0px))}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;pointer-events:none;flex-wrap:wrap;text-align:center}
#bar button{pointer-events:auto;background:transparent;color:var(--hint);border:1px solid rgba(233,226,214,.45);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:#fbfaf6;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .35s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{transform:translate(-50%,0)}

/* ── 우편함 ── */
#mail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:70px 0 80px;transition:opacity .5s}
#mail.off{opacity:0;pointer-events:none}
#mail h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(22px,4vw,30px);text-align:center}
#mail p{margin:0;color:#b9b0a2;font-size:14px;text-align:center}
.parcels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;width:min(900px,100%)}
@media (max-width:700px){.parcels{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
.parcel{position:relative;aspect-ratio:1/1.08;border:0;padding:0;cursor:pointer;background:linear-gradient(180deg,var(--kraft),var(--kraft2));border-radius:4px;box-shadow:0 16px 30px rgba(0,0,0,.45);transform:rotate(var(--r));transition:transform .25s}
.parcel:hover,.parcel:focus-visible{transform:rotate(var(--r)) translateY(-6px);outline:none}
.parcel::before{content:"";position:absolute;left:0;right:0;top:44%;height:14%;background:var(--packtape)}
.parcel .lb{position:absolute;left:9%;top:10%;width:72%;background:#fbfaf6;color:var(--ink);font-family:var(--mono);font-size:clamp(9px,1.2vw,11px);line-height:1.45;padding:6px 8px;text-align:left;transform:rotate(-2deg)}
.parcel .lb b{display:block;font-family:var(--sans);font-weight:900;font-size:1.15em;border-bottom:1.5px solid var(--ink);margin-bottom:3px}
.parcel .dot{position:absolute;right:8%;bottom:10%;width:30%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:clamp(10px,1.6vw,15px);color:#fff;transform:rotate(-8deg)}
.parcel .new{position:absolute;left:8%;bottom:10%;font-size:12px;font-weight:900;color:#3b2a14}
.parcel.read .new{opacity:.45}

/* ── 상자 ── */
#box{position:absolute;width:var(--bw);height:calc(var(--bw)*1.12);touch-action:none;cursor:ew-resize;perspective:1400px;transition:opacity .6s,transform .8s}
#box.off{opacity:0;transform:translateY(60px) scale(.94);pointer-events:none}
.inner{position:absolute;inset:0;background:var(--kraftIn);border-radius:4px;box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 30px 60px rgba(0,0,0,.5)}
.inner .mag{position:absolute;inset:9% 14%;background:var(--magc,#f59ad6);box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.inner .mag::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.4) 32%,transparent 40%)}
#box.open .inner .mag{transform:translateY(-6%) scale(1.04)}
.flap{position:absolute;left:0;right:0;height:50%;background:linear-gradient(180deg,var(--kraft),var(--kraft2));transition:transform 1s cubic-bezier(.3,.7,.2,1);backface-visibility:hidden;border-radius:3px}
.flap::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 2px,transparent 2px 9px)}
.flap.top{top:0;transform-origin:top center}
.flap.bot{bottom:0;transform-origin:bottom center}
#box.open .flap.top{transform:rotateX(178deg)}
#box.open .flap.bot{transform:rotateX(-178deg)}
.tape{position:absolute;left:-2%;right:-2%;height:28%;background:var(--packtape)}
.tape::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%,rgba(0,0,0,.08))}
.flap.top .tape{bottom:0}.flap.bot .tape{top:0}
#slit{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;background:#1a120a;width:0;z-index:5;box-shadow:0 0 4px rgba(0,0,0,.6)}
#box.open #slit{opacity:0}
.label{position:absolute;left:8%;top:9%;width:60%;background:#fbfaf6;color:var(--ink);font-family:var(--mono);font-size:calc(var(--bw)*.028);line-height:1.5;padding:3% 4%;transform:rotate(-1.5deg);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.label b{font-family:var(--sans);font-weight:900;font-size:1.15em;display:block;border-bottom:1.5px solid var(--ink);margin-bottom:4%;padding-bottom:2%}
.label .bc{height:calc(var(--bw)*.05);margin-top:5%;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 3px,var(--ink) 3px 5px,transparent 5px 8px)}
.warn{position:absolute;right:7%;top:12%;width:24%;aspect-ratio:1;border-radius:50%;background:#d23a26;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:calc(var(--bw)*.03);line-height:1.25;transform:rotate(8deg)}
.flap.bot .stamp{position:absolute;right:8%;bottom:12%;font-family:'Archivo Black',sans-serif;font-size:calc(var(--bw)*.05);color:rgba(60,35,12,.5);transform:rotate(-6deg);border:3px solid rgba(60,35,12,.45);padding:1% 3%}

/* ── 책 ── */
#bookWrap{position:absolute;perspective:2400px;opacity:0;transform:translateY(40px) scale(.92);transition:opacity .7s,transform .9s cubic-bezier(.2,.7,.2,1);pointer-events:none}
#bookWrap.on{opacity:1;transform:none;pointer-events:auto}
#book{position:relative;width:var(--bkw);height:var(--ph);transition:transform .8s cubic-bezier(.3,.6,.2,1);touch-action:pan-y}
.leaf{position:absolute;top:0;left:var(--lx);width:var(--pw);height:var(--ph);transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.6,.2,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face,.base{position:absolute;inset:0;background:var(--paper);color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;container-type:size;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.face.back{transform:rotateY(180deg)}
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.14),transparent 7%)}
.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.14),transparent 7%)}
.base{left:var(--lx);width:var(--pw);right:auto}
.blank{filter:brightness(.97)}

/* 잡지별 변수 */
.t-drop{--paper:#fdfcf9;--acc:#f59ad6;--acc2:#2a2fb0;--acc3:#f08a16;--kick:#2a2fb0;--hf:'Archivo Black',sans-serif}
.t-fb{--paper:#f4efe6;--acc:#2bb3d9;--acc2:#141414;--acc3:#d23a26;--kick:#137a99;--hf:'Alfa Slab One',serif}
.t-cy{--paper:#efebe3;--acc:#b0201e;--acc2:#141414;--acc3:#b0201e;--kick:#b0201e;--hf:'Archivo Black',sans-serif}
.t-33{--paper:#f6f1e7;--acc:#d62718;--acc2:#1f2a8a;--acc3:#ffd84d;--kick:#1f2a8a;--hf:'Jost',sans-serif}

/* 지면 (cqw = 지면 폭 1%) */
.pg{position:absolute;inset:0;padding:7cqw 7cqw 10cqw;overflow:auto;font-size:3.05cqw;line-height:1.72;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.folio{position:absolute;bottom:3cqw;left:7cqw;right:7cqw;display:flex;justify-content:space-between;font-size:2.3cqw;color:var(--mute);letter-spacing:.04em}
.kick{font-size:2.5cqw;font-weight:900;letter-spacing:.08em;color:var(--kick)}
.h{font-family:var(--serif);font-weight:900;font-size:6.2cqw;line-height:1.25;margin:1.4cqw 0 1.6cqw;text-wrap:balance}
.t-fb .h{font-family:var(--hf),var(--serif);font-weight:900;font-synthesis:none;letter-spacing:-.01em}
.t-cy .h,.t-drop .h{font-family:var(--hf),var(--sans);font-weight:900;font-synthesis:none;letter-spacing:-.02em}
.t-33 .h{font-family:var(--hf),var(--sans);font-weight:900}
.p{font-family:var(--serif);margin:0 0 3cqw;word-break:keep-all}
.sub{font-family:var(--sans);font-weight:900;font-size:3.1cqw;margin:1cqw 0 1.2cqw;color:var(--acc)}
.t-cy .sub{display:inline-block;background:var(--acc);color:#fff;padding:.2cqw 1.6cqw}
.by{font-size:2.6cqw;color:var(--mute)}
.score{display:flex;align-items:baseline;gap:3cqw;margin:1.5cqw 0 2.5cqw}
.score b{font-family:var(--hf);font-size:15cqw;line-height:1;color:var(--ink)}
.t-drop .score b{color:var(--acc2)}
.stars{font-size:8cqw;color:var(--acc);letter-spacing:.5cqw;line-height:1}
.facts{width:100%;border-collapse:collapse;font-size:2.55cqw;margin-bottom:3cqw}
.facts td{border-top:1px solid rgba(22,21,20,.15);padding:.9cqw 0;vertical-align:top}
.facts td{color:var(--ink)}.facts td:first-child{color:var(--mute);width:24%}
.pull{font-family:var(--serif);font-weight:900;font-size:5.4cqw;line-height:1.42;border-top:1.6cqw solid var(--acc);padding-top:3cqw;margin:0 0 4cqw;text-wrap:balance}
.t-cy .pull{border:0;padding:0;position:relative;padding-left:9cqw}
.t-cy .pull::before{content:"“";position:absolute;left:-1cqw;top:-6cqw;font-family:'Archivo Black';font-size:22cqw;color:var(--acc);line-height:1}
.box{border:1px solid rgba(22,21,20,.35);padding:2.6cqw 3cqw;margin:0 0 3cqw;font-size:2.75cqw;line-height:1.6}
.box b{display:block;font-size:2.4cqw;letter-spacing:.06em;color:var(--kick);margin-bottom:.8cqw}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:1cqw 2cqw;align-items:center;font-size:2.45cqw}
.bars i{display:block;height:1.6cqw;background:var(--ink)}
.bars .v{font-variant-numeric:tabular-nums}
.toc{display:flex;flex-direction:column;margin-top:3cqw}
.toc div{display:grid;grid-template-columns:9cqw 1fr;gap:2cqw;border-top:1px solid rgba(22,21,20,.18);padding:2.3cqw 0}
.toc div b{font-family:var(--hf);font-size:6cqw;line-height:1;color:var(--acc2)}
.t-fb .toc div b{color:var(--kick)}
.toc small{display:block;color:var(--mute);font-size:2.5cqw}
.sh{border-top:1px solid rgba(22,21,20,.2);padding-top:2.6cqw;margin-bottom:2.4cqw}
.sh .t{font-weight:900;font-size:3.15cqw;line-height:1.4}
.tag{display:inline-block;background:var(--acc2);color:#fff;font-size:2.3cqw;font-weight:900;padding:.2cqw 1.4cqw;margin-left:1cqw;vertical-align:middle}
.tag.hold{background:transparent;color:var(--mute);border:1px solid var(--mute)}
.src{font-size:2.3cqw;line-height:1.55;color:var(--mute);margin:0;padding-left:4cqw}
.src a{color:var(--mute)}
.chart{width:100%;border-collapse:collapse;font-size:2.5cqw;font-variant-numeric:tabular-nums}
.chart th{text-align:left;color:var(--mute);font-weight:700;border-bottom:2px solid var(--ink);padding:.8cqw .6cqw}
.chart td{border-bottom:1px solid rgba(22,21,20,.15);padding:.75cqw .6cqw;color:#9a958d}
.chart td:first-child{font-family:var(--hf);font-weight:900;color:var(--ink);width:7cqw}
.nodes{position:relative;height:62cqw;margin:2cqw 0 3cqw}
.nodes svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;border-radius:50%;font-weight:900;line-height:1.15;background:var(--paper);border:.5cqw solid var(--ink);font-size:2.3cqw;padding:1cqw}
.node.core{background:var(--acc);color:#fff;border-color:var(--acc);font-size:2.7cqw}

/* 표지 공통 */
.cover{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
.bcd{position:absolute;width:15cqw;height:8cqw;background:#fff;padding:1cqw}
.bcd i{display:block;height:100%;background:repeating-linear-gradient(90deg,#161514 0 .4cqw,transparent .4cqw .7cqw,#161514 .7cqw 1.1cqw,transparent 1.1cqw 1.7cqw)}
.vr{position:absolute;writing-mode:vertical-rl;line-height:1}

/* 비닐 */
.wrap{position:absolute;inset:-1.5%;z-index:20;touch-action:none;cursor:ew-resize;border:1px solid rgba(255,255,255,.55);background:
  linear-gradient(112deg,transparent 18%,rgba(255,255,255,.42) 24%,transparent 31%,transparent 55%,rgba(255,255,255,.16) 62%,transparent 70%),
  linear-gradient(200deg,rgba(255,255,255,.14),transparent 30%),
  repeating-linear-gradient(77deg,rgba(255,255,255,.05) 0 1px,transparent 1px 23px),rgba(255,255,255,.07)}
.wrap::before,.wrap::after{content:"";position:absolute;left:0;right:0;height:2.4%;background:rgba(255,255,255,.25)}
.wrap::before{top:0}.wrap::after{bottom:0}
.wsticker{position:absolute;left:5cqw;bottom:22cqw;background:#f08a16;color:#fff;border-radius:50%;width:19cqw;height:19cqw;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:2.6cqw;line-height:1.25;transform:rotate(-10deg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wbar{position:absolute;right:4cqw;bottom:6cqw;background:#fff;color:var(--ink);font-family:var(--mono);font-size:2.1cqw;padding:1cqw 2cqw;transform:rotate(2deg)}
#tear{position:absolute;height:.5cqw;background:rgba(255,255,255,.9);box-shadow:0 0 1cqw rgba(255,255,255,.8);width:0;z-index:22;pointer-events:none}
.shard{position:absolute;inset:-1.5%;z-index:21;pointer-events:none;transition:transform .9s cubic-bezier(.3,.6,.2,1),opacity .9s}

/* 부록 싱글 */
.sg-h{position:absolute;left:6cqw;right:6cqw;top:5cqw;display:flex;justify-content:space-between;align-items:baseline;border-bottom:.4cqw solid var(--acc);padding-bottom:1.5cqw}
.sg-h b{font-family:var(--serif);font-weight:900;font-size:5.2cqw}
.sg-h span{font-size:2.4cqw;color:var(--mute)}
.single{position:absolute;width:31cqw;height:31cqw;border:0;padding:0;background:none;cursor:pointer;transform:rotate(var(--r));transition:transform .5s cubic-bezier(.3,.6,.2,1)}
.single:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
.bag{position:absolute;inset:-4% -4% -7%;border:1px solid rgba(160,160,160,.55);background:linear-gradient(125deg,transparent 20%,rgba(255,255,255,.75) 27%,transparent 34%),linear-gradient(20deg,transparent 60%,rgba(255,255,255,.35) 66%,transparent 72%),rgba(225,230,235,.28);box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.22);z-index:2;pointer-events:none}
.bag::before{content:"";position:absolute;left:0;right:0;top:7%;height:1.5px;background:rgba(150,150,150,.5)}
.sleeve{position:absolute;inset:0;background:#d4bf9e;box-shadow:inset 0 0 2cqw rgba(90,60,20,.25)}
.sleeve::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 5px)}
.hole{position:absolute;left:50%;top:50%;width:14cqw;height:14cqw;margin:-7cqw 0 0 -7cqw;border-radius:50%;background:radial-gradient(circle,#d4bf9e 0 .6cqw,var(--c) .6cqw 4.2cqw,#141414 4.2cqw 4.6cqw,#2a2a2a 4.6cqw 5cqw,#141414 5cqw 7cqw);box-shadow:inset 0 0 .6cqw rgba(0,0,0,.6)}
.st{position:absolute;left:3cqw;right:3cqw;bottom:2.4cqw;font-family:var(--mono);font-size:2.1cqw;color:#4a3720;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn{position:absolute;left:3cqw;top:2.4cqw;font-family:var(--mono);font-size:2.1cqw;color:#4a3720}
.ct{position:absolute;height:5.2cqw;background:var(--clear);border-left:1px dashed rgba(200,190,150,.6);border-right:1px dashed rgba(200,190,150,.6);z-index:3;transition:transform .45s,opacity .45s}
.ct.curl{background:linear-gradient(90deg,var(--clear) 70%,rgba(255,250,225,.85) 85%,rgba(255,255,255,.2))}
.single.taken{transform:rotate(0deg) translateY(-3cqw) scale(1.06);z-index:5}
.single.taken .ct{transform:rotate(-35deg) translateY(-4cqw)!important;opacity:0}
.cap{position:absolute;left:-4cqw;right:-4cqw;top:calc(100% + 2.6cqw);font-size:2.2cqw;color:var(--mute);text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.single.taken .cap{color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<div id="stage">
  <section id="mail" aria-label="우편함">
    <h1>11월 둘째 주 우편함</h1>
    <p>잡지 네 권이 도착했습니다. 상자를 골라 여세요.</p>
    <div class="parcels" id="parcels"></div>
  </section>
  <div id="box" class="off" role="button" tabindex="0" aria-label="택배 상자. 테이프를 가로로 그어서 열기">
    <div class="inner"><div class="mag"></div></div>
    <div class="flap top"><div class="label" id="lbl"></div><div class="warn">구부리지<br>마세요</div><div class="tape"></div></div>
    <div class="flap bot"><div class="tape"></div><div class="stamp">PRINTED MATTER</div></div>
    <div id="slit"></div>
  </div>
  <div id="bookWrap"><div id="book"></div></div>
</div>
<button id="home" class="chip" type="button" hidden>← 우편함</button>
<button id="again" class="chip" type="button" hidden>다시 배송받기</button>
<div id="toast" role="status" aria-live="polite"></div>
<div id="bar"><span id="hint"></span><button id="alt" type="button" hidden></button></div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const fol = (mag, n, t) => `<div class="folio"><span>${mag}</span><span>${t ? t + ' · ' : ''}${n}</span></div>`;
const src = list => `<ol class="src">${list.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ol>`;

/* 소리 */
let ac;
function noise(dur, freq, type, gain) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) * (Math.random() < .3 ? 1 : .45);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; f.type = type; f.frequency.value = freq; g.gain.value = gain;
    s.connect(f).connect(g).connect(ac.destination); s.start();
  } catch (e) {}
}
const sfx = { tape: () => noise(.6, 1800, 'bandpass', .5), tear: () => noise(.4, 2500, 'highpass', .4), page: () => noise(.22, 700, 'lowpass', .35), peel: () => noise(.3, 3000, 'bandpass', .35) };

const hint = $('#hint'), alt = $('#alt'), toastEl = $('#toast');
let toastT;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2800); }
function setHint(t, a) { hint.textContent = t; alt.hidden = !a; if (a) alt.textContent = a; }

let I = null, state = 'mail', torn = false, k = 0, spread = false, leaves = [];
const readSet = new Set();

function measure() {
  const vw = innerWidth - 32, vh = innerHeight - 140;
  spread = innerWidth >= 820;
  let w = spread ? Math.min(380, vw / 2) : Math.min(420, vw);
  w = Math.min(w, vh * .75);
  const r = document.documentElement.style;
  r.setProperty('--pw', w + 'px'); r.setProperty('--ph', w * 4 / 3 + 'px');
  r.setProperty('--bkw', (spread ? 2 * w : w) + 'px'); r.setProperty('--lx', (spread ? w : 0) + 'px');
  r.setProperty('--bw', Math.min(420, vw, vh * .85) + 'px');
}

/* 우편함 */
function renderMail() {
  $('#parcels').innerHTML = ISSUES.map(x => `<button class="parcel ${readSet.has(x.id) ? 'read' : ''}" type="button" data-id="${x.id}" style="--r:${x.r}deg" aria-label="${x.name} 상자 열기">

    <span class="new">${readSet.has(x.id) ? '읽음' : '새 우편'}</span></button>`).join('');
}
$('#parcels').addEventListener('click', e => { const b = e.target.closest('.parcel'); if (b) openIssue(b.dataset.id); });

function openIssue(id) {
  I = ISSUES.find(x => x.id === id); state = 'box'; torn = false; k = 0;
  $('#mail').classList.add('off');
  const box = $('#box'); box.classList.remove('off', 'open'); $('#slit').style.width = 0;
  $('.inner .mag').style.setProperty('--magc', I.mag);
  $('#lbl').innerHTML = `<b>${I.label[0]}</b>보내는 곳: ${I.label[0].split(' →')[0]}<br>받는 곳: Sabathia 우편함<br>${I.label[1]}<br>${I.label[2]}<br>${I.label[3]}<div class="bc"></div>`;

  $('#book').className = I.theme;
  $('#home').hidden = false; $('#again').hidden = false;
  build();
  setHint('테이프를 따라 가로로 그어서 상자를 여세요', '칼로 자르기');

}
function goHome() {
  state = 'mail'; I = null;
  $('#box').classList.add('off'); $('#bookWrap').classList.remove('on');
  $('#mail').classList.remove('off'); $('#home').hidden = true; $('#again').hidden = true;
  renderMail(); setHint('');
}
$('#home').addEventListener('click', goHome);
$('#again').addEventListener('click', () => I && openIssue(I.id));

function build() {
  if (!I) return;
  const P = I.pages, book = $('#book');
  const groups = spread ? [[0, 1], [2, 3], [4, 5], [6, 7]] : P.map((_, i) => [i, -1]);
  book.innerHTML = groups.map(([f, b], i) => `<div class="leaf"><div class="face front">${P[f]}${i === 0 && !torn ? wrapHTML() : ''}</div><div class="face back ${b < 0 ? 'blank' : ''}">${b < 0 ? '' : P[b]}</div></div>`).join('') + `<div class="base">${singlesPage(I)}</div>`;
  leaves = [...book.querySelectorAll('.leaf')];
  if (!torn) bindWrap();
  apply();
}
const wrapHTML = () => `<div class="wrap" aria-label="비닐 포장. 가로로 그어서 뜯기"><div class="wsticker">부록 싱글<br>${I.singles.length}장 수록</div><div class="wbar">${I.label[1].replace('내용물: ', '')}</div></div><div id="tear"></div>`;

function apply(moving = -1) {
  const n = leaves.length;
  leaves.forEach((L, i) => { L.classList.toggle('flipped', i < k); L.style.zIndex = i === moving ? 200 : (i < k ? i + 1 : n - i + 10); });
  if (moving >= 0) setTimeout(() => apply(), 860);
  $('#book').style.transform = spread && k === 0 ? 'translateX(calc(var(--pw) * -.5))' : '';
  if (state === 'read') setHint(k >= n ? '싱글을 누르면 테이프를 떼고 꺼냅니다' : '오른쪽을 누르거나 밀어서 넘기기');
}
function turn(d) {
  if (state !== 'read') return;
  const n = leaves.length;
  if (d > 0 && k < n) { k++; sfx.page(); apply(k - 1); if (k === n) { readSet.add(I.id); } }
  else if (d < 0 && k > 0) { k--; sfx.page(); apply(k); }
}

/* 상자 */
const box = $('#box'), slit = $('#slit');
let bx = null;
box.addEventListener('pointerdown', e => { if (state !== 'box') return; bx = { x: e.clientX, max: 0, r: box.getBoundingClientRect() }; box.setPointerCapture(e.pointerId); });
box.addEventListener('pointermove', e => {
  if (!bx) return;
  const p = Math.min(1, Math.abs(e.clientX - bx.x) / bx.r.width);
  if (p > bx.max) { bx.max = p; slit.style.width = p * 100 + '%'; slit.style.left = Math.max(0, (Math.min(e.clientX, bx.x) - bx.r.left) / bx.r.width * 100) + '%'; if (Math.random() < .3) noise(.05, 1800, 'bandpass', .25); }
  if (p > .7) { bx = null; openBox(); }
});
box.addEventListener('pointerup', () => { if (bx && bx.max < .7) slit.style.width = 0; bx = null; });
box.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state === 'box') { e.preventDefault(); openBox(); } });
function openBox() {
  state = 'opening'; slit.style.left = 0; slit.style.width = '100%'; sfx.tape(); setHint('상자를 여는 중…');
  setTimeout(() => box.classList.add('open'), 250);
  setTimeout(() => { box.classList.add('off'); $('#bookWrap').classList.add('on'); state = 'wrap'; setHint('비닐을 가로로 그어 뜯으세요', '비닐 뜯기'); }, 2000);
}

/* 비닐 */
function bindWrap() {
  const w = $('.wrap'), line = $('#tear');
  if (!w) return;
  let t = null;
  w.addEventListener('pointerdown', e => { if (state !== 'wrap') return; const r = w.getBoundingClientRect(); t = { x: e.clientX, y: e.clientY - r.top, r, max: 0 }; w.setPointerCapture(e.pointerId); line.style.top = t.y + 'px'; line.style.left = (e.clientX - r.left) + 'px'; });
  w.addEventListener('pointermove', e => {
    if (!t) return;
    const dx = e.clientX - t.x, p = Math.min(1, Math.abs(dx) / t.r.width);
    if (p > t.max) { t.max = p; line.style.width = Math.abs(dx) + 'px'; line.style.left = (Math.min(e.clientX, t.x) - t.r.left) + 'px'; if (Math.random() < .25) noise(.04, 2600, 'highpass', .2); }
    if (p > .7) { const y = t.y / t.r.height; t = null; tearWrap(y); }
  });
  w.addEventListener('pointerup', () => { if (t) line.style.width = 0; t = null; });
}
function tearWrap(y = .5) {
  if (torn) return;
  torn = true; sfx.tear();
  const w = $('.wrap'), line = $('#tear');
  if (w) {
    const yy = Math.max(15, Math.min(85, y * 100)), zig = [];
    for (let i = 0; i <= 20; i++) zig.push(`${i * 5}% ${yy + (i % 2 ? 1.5 : -1.5)}%`);
    const bg = getComputedStyle(w).background, top = w.cloneNode(true), bot = w.cloneNode(true);
    [top, bot].forEach(s => { s.classList.remove('wrap'); s.classList.add('shard'); s.style.background = bg; w.parentNode.appendChild(s); });
    top.style.clipPath = `polygon(0 0,100% 0,${zig.slice().reverse().join(',')})`;
    bot.style.clipPath = `polygon(${zig.join(',')},100% 100%,0 100%)`;
    w.remove(); line && line.remove();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      top.style.transform = 'translate(-30%,-70%) rotate(-14deg)'; top.style.opacity = 0;
      bot.style.transform = 'translate(25%,70%) rotate(10deg)'; bot.style.opacity = 0;
    }));
    setTimeout(() => { top.remove(); bot.remove(); }, 950);
  }
  state = 'read'; apply();
}
alt.addEventListener('click', () => { if (state === 'box') openBox(); else if (state === 'wrap') tearWrap(.5); });

let sw = null;

bookEl.addEventListener('pointerup', e => {
  if (!sw || state !== 'read') return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (e.target.closest('a')) return;
  const one = e.target.closest('.single');
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { turn(dx < 0 ? 1 : -1); return; }
  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) return;
  if (one && k >= leaves.length) { takeSingle(one); return; }
  const r = bookEl.getBoundingClientRect();
  const mid = spread ? r.left + r.width / 2 : r.left + r.width * .35;
  turn(e.clientX > mid ? 1 : -1);
});
bookEl.addEventListener('keydown', e => { const s = e.target.closest('.single'); if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); takeSingle(s); } });
addEventListener('keydown', e => { if (e.key === 'ArrowRight') turn(1); if (e.key === 'ArrowLeft') turn(-1); if (e.key === 'Escape' && state !== 'mail') goHome(); });
function takeSingle(el) {
  const s = I.singles[+el.dataset.i];
  if (!el.classList.contains('taken')) { el.classList.add('taken'); sfx.peel(); }
  toast(`▶ '${s.t}' — ${s.a}  (앱에서는 Spotify로 재생되고 ${I.label[0].split(' →')[0]} 크레이트에 꽂힙니다)`);
}

addEventListener('resize', () => { const before = spread; measure(); if (before !== spread && I) { k = spread ? Math.ceil(k / 2) : k * 2; build(); } });
measure(); renderMail(); setHint('');
})();
