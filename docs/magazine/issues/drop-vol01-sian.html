<title>Drop Vol.01 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;900&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
/* 시안 시트: 어두운 책상 위에 펼침면을 위에서 아래로. 펼침 = 지면 두 장(3:4). 지면 안 단위는 cqw(지면 폭 1%) */
:root{
  --desk:#1d1a17; --label:#bdb4a6;
  --paper:#fbfaf6; --ink:#121212; --mute:#6b665e; --rule:rgba(18,18,18,.16);
  --pink:#f59ad6; --blue:#2a2fb0; --orange:#f08a16; --navy:#16185a;
  --dl:'Archivo Black',sans-serif; --dk:'Black Han Sans',sans-serif; --it:'Instrument Serif',Georgia,serif;
  --body:'Noto Serif KR',Georgia,serif; --ui:'Noto Sans KR',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--label);font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 80px}
.sheet{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.intro{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.intro h1{margin:0;font-family:var(--it);font-style:italic;font-weight:400;font-size:clamp(34px,5vw,56px);color:#f3eee6;line-height:1}
.intro p{margin:0;font-size:14px;line-height:1.6}
figure.sp{margin:0;display:flex;flex-direction:column;gap:12px}
figcaption{display:flex;gap:12px;align-items:baseline;font-size:13px}
figcaption b{font-family:var(--mono);color:#f3eee6;font-weight:600}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;aspect-ratio:3/2;width:100%;container-type:inline-size;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.spread.single{grid-template-columns:1fr;aspect-ratio:3/4;width:min(100%,560px)}
.spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6cqw;margin-left:-3cqw;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.13) 45%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.13) 55%,transparent);z-index:30}
.spread.single::after{display:none}
.pg{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);container-type:size}
.folio{position:absolute;bottom:3.4cqw;font-family:var(--mono);font-size:1.9cqw;letter-spacing:.06em;color:var(--mute)}
.L .folio{left:6cqw}.R .folio{right:6cqw}
.photo{position:absolute;background-size:cover;background-position:center}
.credit{position:absolute;font-family:var(--mono);font-size:1.5cqw;color:rgba(255,255,255,.75);letter-spacing:.03em}
.lbl{font-family:var(--mono);font-size:2cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
.k{font-family:var(--dk);font-weight:400;line-height:1.02;letter-spacing:-.02em}
.body{font-family:var(--body);font-size:2.55cqw;line-height:1.78;word-break:keep-all;color:#1d1c1a}
.body p{margin:0 0 2.2cqw}
.drop::first-letter{font-family:var(--dl);float:left;font-size:9.6cqw;line-height:.82;padding:1cqw 1.6cqw 0 0;color:var(--blue)}
.cols{column-count:2;column-gap:4cqw}
.cap{font-family:var(--ui);font-size:1.9cqw;line-height:1.5;color:var(--mute)}
.cap b{color:var(--ink)}
.rule{border-top:.25cqw solid var(--ink)}
.stamp{position:absolute;border:.7cqw solid #d23a26;color:#d23a26;font-family:var(--dk);text-align:center;line-height:1;padding:1.5cqw 3cqw;transform:rotate(-12deg);mix-blend-mode:multiply}
.bar{display:block;height:100%;background:repeating-linear-gradient(90deg,#121212 0 .5cqw,transparent .5cqw .8cqw,#121212 .8cqw 1.3cqw,transparent 1.3cqw 2cqw)}
/* 부록 싱글 */
.single7{position:absolute;width:30cqw;aspect-ratio:1;transform:rotate(var(--r))}
.single7 .sl{position:absolute;inset:0;background:#d4bf9e;box-shadow:inset 0 0 2cqw rgba(90,60,20,.25),0 .6cqw 1.4cqw rgba(0,0,0,.18)}
.single7 .sl::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 5px)}
.single7 .ho{position:absolute;left:50%;top:50%;width:13cqw;height:13cqw;margin:-6.5cqw 0 0 -6.5cqw;border-radius:50%;background:radial-gradient(circle,#d4bf9e 0 .6cqw,var(--c) .6cqw 4cqw,#141414 4cqw 4.4cqw,#2a2a2a 4.4cqw 4.8cqw,#141414 4.8cqw 6.5cqw)}
.single7 .bg{position:absolute;inset:-4% -4% -7%;border:1px solid rgba(160,160,160,.55);background:linear-gradient(125deg,transparent 20%,rgba(255,255,255,.75) 27%,transparent 34%),rgba(225,230,235,.28)}
.single7 .tp{position:absolute;height:5cqw;background:rgba(255,248,214,.55);border-left:1px dashed rgba(200,190,150,.6);border-right:1px dashed rgba(200,190,150,.6)}
.single7 .t{position:absolute;left:2.6cqw;bottom:2.2cqw;font-family:var(--mono);font-size:1.9cqw;color:#4a3720}
.single7 .c2{position:absolute;left:-4cqw;right:-4cqw;top:calc(100% + 2.6cqw);text-align:center;font-family:var(--ui);font-size:1.9cqw;color:var(--mute)}
@media (max-width:700px){.sheet{gap:40px}}
</style>

<div class="sheet">
  <header class="intro">
    <h1>Drop — Vol.01 시안</h1>
    <p>13쪽짜리 한 권을 표지와 펼침면 여덟 장으로 보여 줍니다. 사진은 Flickr에 자유 이용(CC) 조건으로 올라온 사진을 Openverse로 찾아 가공한 것이고, 저작자는 맨 끝 판권 쪽에 적었습니다. 펼침마다 레이아웃이 다르고, 앞부분(짧은 꼭지) → 가운데(큰 기획) → 뒷부분(단평·부록) 순으로 흐릅니다.</p>
  </header>

  <figure class="sp"><figcaption><b>04</b> 본문 — 2단, 드롭캡, 반쪽 사진과 캡션, 큰 풀쿼트</figcaption>

      <div class="lbl" style="position:absolute;left:7cqw;top:6.5cqw">U2 — Carnaval de Luz · 6.5</div>
      <div class="body cols" style="position:absolute;left:7cqw;right:7cqw;top:12cqw;bottom:11cqw;column-fill:auto;font-size:2.75cqw">
        <p class="drop">9년이다. U2가 새 노래로만 채운 정규 앨범을 내놓은 것이 그만큼 만이다. 올해 초의 EP 두 장 [Days of Ash]와 [Easter Lily]가 예고였다면, 이 판은 그보다 앞에 있던 축제의 밤을 그린다고 밴드는 설명한다. 열두 곡. 이 지면이 가장 먼저 반긴 숫자다.</p>
        <p>판은 'Go (Carnaval De Luz)'로 문을 연다. 브라이언 이노의 신시사이저 리프 위에 세운 곡이고, Riff는 그 에너지를 신경질적으로 떨린다고 적었다. 이노는 세 곡을 함께 썼고 대니얼 라노이도 이름을 올렸다. 전체를 다듬은 잭나이프 리는 2004년부터 밴드 곁에 있었다.</p>
        <p>같은 사람들이 같은 방에 다시 모였다는 뜻이다. 그 방이 어디를 향하는지는 평단에서도 갈린다. 아이리시 이그재미너는 30년 만의 최고작이라 했고, Riff는 [Achtung Baby]를 꺼냈다. 롤링스톤 브라질은 얕은 가사를 문제 삼으며 'The Mirror Maker (Rosalía)'를 가장 낮은 곳으로 꼽았다.</p>
        <p>이 지면은 남의 점수를 빌리지 않는다. 다만 의견이 갈린 곳이 가사라는 사실은 적어 둔다.</p>

div><div><div style="font-family:var(--it);font-style:italic;font-size:4.2cqw;line-height:1.05">Torn</div><div class="body" style="font-size:2.2cqw;margin-top:.8cqw">마지막 곡. 보노와 돌리 파튼의 이중창, 파튼의 마지막 녹음.</div></div></div><div class="cap" style="border-top:.2cqw solid var(--rule);padding-top:2cqw">그 밖에 La Reina, Street of Dreams, Superficiality, If The World Is At War We Better Not Be. 곡별 자료를 이번 호에서는 찾지 못했다. 번호는 확인된 순서만 적었다.</div></div>
