<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판단</title>
<meta name="description" content="15577·일정·장부를 읽고 남은 시간과 마감을 계산해 지금 가장 중요한 행동을 보여준다">
<meta name="theme-color" content="#f9f9f8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 판단 (DEC-09) · Sabathia Decision Engine v1.0 · theme.css(시안 스타일 v2) 기준
   Layout: SABATHIA 줄 → 제목 + 모드 → 메인 카드(엔진이 고름) → 요약 3칸 → 미루면? → 확인 필요 → 오늘 배치 → 마감 → 시험 필요도 → 7일 → 설정
   1000px 이상: 왼쪽(메인·요약·미루면·확인) / 오른쪽(오늘·마감·필요도·7일·설정) */
:root {
  --bg: #f9f9f8; --card: #ffffff; --soft: #f3f4f3; --soft-2: #eeeeed;
  --ink: #1a1c1c; --muted: #5d6170; --hair: #e2e2e2;
  --accent: #004ac6; --on-accent: #ffffff; --accent-soft: #dbe1ff;
  --ok: #00632b; --ok-soft: #c9f3d3; --warn: #ba1a1a; --warn-text: #ba1a1a; --on-warn: #ffffff;
  --amber: #8a5300; --amber-soft: #ffe2bd; --violet: #5b3fc0; --violet-soft: #e6deff;
  --radius: 14px; --radius-sm: 10px; --pad-x: 16px;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
  --font-body: 'Inter', 'Noto Sans KR', system-ui, sans-serif;
  --mode: var(--accent); --mode-soft: var(--accent-soft);
  color-scheme: light;
}
html[data-mode="risk"] { --mode: var(--warn); --mode-soft: #ffdad6; }
html[data-mode="exam"] { --mode: var(--violet); --mode-soft: var(--violet-soft); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-weight: 500; font-size: 16px; line-height: 22px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; word-break: keep-all;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 600px; margin: 0 auto;
  padding-left: max(var(--pad-x), env(safe-area-inset-left, 0px));
  padding-right: max(var(--pad-x), env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}
.sab { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 12px; color: var(--ink); text-decoration: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 4px; }
.page-title { margin: 0; }
.page-sub { font-size: 16px; white-space: nowrap; padding-bottom: 6px; color: var(--mode) !important; font-weight: 700 !important; }
.lead { margin: 6px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }
.cols { display: block; }
@media (min-width: 1000px) {
  .app { max-width: 1120px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
}

.sec { margin-top: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 6px; }
.sec-title { margin: 0; }
.sec-count { font-size: 13px; }
.hint { font-size: 13px; line-height: 18px; color: var(--muted); margin: 0 0 8px; }

/* 메인 카드 */
.main { margin-top: 14px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 16px; border-top: 4px solid var(--mode) !important; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--mode); }
.main h2 { margin: 6px 0 6px; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em; }
.main p { margin: 0; color: var(--muted); font-size: 15px; line-height: 21px; }
.main .meta-row { margin-top: 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; font-weight: 600; font-size: 15px; text-decoration: none; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.main .btn:not(.line) { background: var(--mode) !important; }

/* 지금 */
.now { display: flex; gap: 10px; align-items: center; margin-top: 10px; padding: 10px 14px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); font-size: 14px; line-height: 19px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mode); flex: none; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* 요약 3칸 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 4px; margin-top: 10px; }
.stat { padding: 0 10px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--hair); }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 18px; line-height: 24px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 미루면? */
details.sim { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 10px; }
details.sim summary { list-style: none; display: flex; justify-content: space-between; padding: 13px 16px; cursor: pointer; font-weight: 700; }
details.sim summary::-webkit-details-marker { display: none; }
.verdict { font-size: 14px; color: var(--ok); }
.sim[data-sev="medium"] .verdict, .sim[data-sev="low"] .verdict { color: var(--amber); }
.sim[data-sev="high"] .verdict { color: var(--warn); }
.sim-body { padding: 0 16px 12px; }
.sim-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.sim-row b { font-weight: 600; text-align: right; }
.sim-row.hot b { color: var(--warn); }

/* 목록 */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); width: 100%; text-align: left; }
.list > li:first-child > .row, .list > .row:first-child { border-top: 0; }
.row .tm { min-width: 48px; flex: none; white-space: nowrap; font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.row .bd { flex: 1; min-width: 0; }
.row .tt { font-weight: 600; }
.row .sub { font-size: 12.5px; line-height: 17px; color: var(--muted); }
.row .rt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.row.fixed { color: var(--muted); font-size: 14px; padding: 6px 0; }
.row.fixed .tt { font-weight: 500; }
.bar { width: 4px; align-self: stretch; border-radius: 4px; background: var(--c, var(--accent)); flex: none; }
.check-acts { display: flex; gap: 6px; flex: none; }

.meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.pill { display: inline-flex; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--c) 14%, white); color: var(--c); white-space: nowrap; }
.tag { display: inline-flex; padding: 1px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--soft-2); color: var(--muted); white-space: nowrap; }
.tag.warn { background: #ffdad6; color: var(--warn); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.violet { background: var(--violet-soft); color: var(--violet); }

/* 필요도 */
.need { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; }
.need .track { height: 8px; border-radius: 99px; background: var(--soft-2); overflow: hidden; }
.need .track i { display: block; height: 100%; background: var(--c); border-radius: 99px; }

/* 7일 */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; padding-top: 4px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.wk .col { position: relative; width: 100%; max-width: 32px; height: 84px; border-radius: 8px; background: var(--soft-2); overflow: hidden; }
.wk .col i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; }
.wk .free { background: var(--accent-soft); }
.wk .work { background: var(--mode); }
.wk .work.over { background: var(--warn); }
.wk .lb { font-size: 12px; font-weight: 600; color: var(--muted); }
.wk .lb.we { color: var(--warn); }
.wk .du { font-size: 10px; font-weight: 700; color: var(--amber); min-height: 12px; }
.legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }

/* 설정 */
details.cfg > summary { list-style: none; cursor: pointer; }
details.cfg > summary::-webkit-details-marker { display: none; }
.sleep { display: grid; grid-template-columns: 22px 1fr 12px 1fr; gap: 8px; align-items: center; padding: 3px 0; }
.sleep b.we { color: var(--warn); }
.in { width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--hair); border-radius: var(--radius-sm); background: var(--card); font-size: 16px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); font-size: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--soft-2); }
.seg button { padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.unc { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; padding: 6px 0; font-size: 13px; align-items: center; }
.unc .muted { grid-column: 2; font-size: 12px; }

/* 시트 */
.scrim { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,0.25); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--card); max-width: 600px; margin: 0 auto; max-height: 92vh; overflow-y: auto; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 720px) { .sheet { bottom: auto; top: 50%; transform: translateY(-50%); border-radius: 20px !important; max-width: 520px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; min-height: 52px; gap: 10px; }
.sheet-head h2 { margin: 0; font-size: 20px; }
.x { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; color: var(--muted); flex: none; }
.f { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.f > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 0 12px; border: 1px solid var(--hair); border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--card); }
.chip[aria-pressed="true"] { background: var(--accent) !important; color: var(--on-accent) !important; border-color: var(--accent) !important; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .chip { min-width: 52px; justify-content: center; display: inline-flex; align-items: center; }
.stepper output { flex: 1; text-align: center; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
.delta { text-align: center; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.delta.up { color: var(--amber); }
.delta.down { color: var(--ok); }
.note { margin: 10px 0 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--soft); font-size: 13px; line-height: 18px; color: var(--muted); }
.note:empty { display: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet .acts { justify-content: flex-end; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10; background: var(--ink); color: #fff; padding: 10px 16px; font-size: 14px; max-width: 90vw; opacity: 0; transition: opacity 200ms; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app">
  <a class="sab" href="/" aria-label="Sabathia 홈으로">SABATHIA<span>DEC-09</span></a>
  <div id="root"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/sabathia.js"></script>
<script src="/today.js"></script>
<script type="module" src="/decide/app.js"></script>
</body>
</html>
