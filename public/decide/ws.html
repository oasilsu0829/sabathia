<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- WS는 Sabathia와 따로 설치되는 앱(시작 주소 /decide/ws). Sabathia 매니페스트를 쓰면 설치 후 홈이 열린다 -->
<link rel="manifest" href="/decide/ws.webmanifest">
<link rel="icon" type="image/png" href="/decide/ws-icon-192.png">
<link rel="apple-touch-icon" href="/decide/ws-apple-touch-icon.png">
<meta name="theme-color" content="#0b1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sabathia WS">
<title>Sabathia WS</title>
<meta name="description" content="Sabathia WS — 주간 타임라인·일간 타임박싱·마감을 한 화면에서 보고 계획하는 학습 워크스페이스" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" />
<style>
  /* Planner 2.0 (2026-11-21): 저채도 네이비 + 흰 글자, 리퀴드 글라스 패널, 커브드 마감 사이드바.
     과목 색은 블록·작은 표시에만. 상태는 색만으로 구분하지 않고 글자·기호를 같이 쓴다 */
  :root{
    --bg:#0B1322; --bg2:#101B30;
    --ink:#F2F5FA; --ink2:#C3CCDB; --ink3:#8F9CB3; --ink4:#5F6C85;
    --line:rgba(214,226,255,.08); --line2:rgba(214,226,255,.16); --line3:rgba(214,226,255,.28);
    --acc:#8DB0F0; --acc2:#5C84D6; --hot:#EA786D; --warn:#E3B565; --ok:#7CC3A3;
    --glass:rgba(17,28,50,.56); --glass2:rgba(255,255,255,.055); --glass3:rgba(255,255,255,.1);
    --hi:inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 1px rgba(214,226,255,.09);
    --shadow:0 24px 60px -26px rgba(2,6,16,.85);
    --spring:cubic-bezier(.32,.72,0,1);
    --sans:"SUIT Variable","SUIT",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    --disp:"Archivo Black","Arial Black","SUIT Variable",-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:var(--bg);overflow:hidden;height:100%}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer;text-align:inherit}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .disp{font-family:var(--disp);font-weight:400;letter-spacing:-.03em}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---------- 무대 ---------- */
  #stage{position:relative;width:1366px;height:1024px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
  .ws-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;opacity:.62;filter:saturate(.7)}
  .bg-veil{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(120% 80% at 18% 0%,rgba(80,120,200,.22),transparent 60%),
    linear-gradient(180deg,rgba(11,19,34,.35),rgba(11,19,34,.78) 55%,rgba(11,19,34,.92))}

  /* ---------- 위 막대 ---------- */
  .topbar{position:absolute;left:20px;right:20px;top:0;height:60px;display:flex;align-items:center;gap:16px;z-index:60;border-bottom:1px solid rgba(255,255,255,.55)}
  .brand{display:flex;align-items:flex-end;gap:10px}
  .brand .disp{font-size:28px;line-height:.8;letter-spacing:-.055em}
  .brand .tag{font-family:var(--mono);font-size:10px;line-height:1.25;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
  .brand .tag b{display:block;color:var(--ink);font-weight:600}
  .seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--glass2);box-shadow:var(--hi)}
  .seg button{height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink3);transition:background .25s,color .25s}
  .seg button[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#0E1A30}
  .mode-seg{margin:0 auto}
  .tb-right{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink3);font-weight:600}
  .tb-right a{color:var(--ink2);text-decoration:none;padding:6px 2px}
  .tb-right a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:.3em}
  .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);font-size:22px;letter-spacing:-.05em}

  /* ---------- 리퀴드 글라스 ---------- */
  .glass{position:absolute;isolation:isolate;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.02) 40%),var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);box-shadow:var(--hi),var(--shadow)}
  /* 경계 하이라이트: 위·왼쪽 가장자리만 빛을 받는다 */
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;padding:1px;
    background:linear-gradient(140deg,rgba(255,255,255,.38),rgba(255,255,255,.05) 30%,rgba(255,255,255,0) 60%,rgba(170,200,255,.16));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .panel{display:flex;flex-direction:column;overflow:hidden;transition:left .55s var(--spring),top .55s var(--spring),width .55s var(--spring),height .55s var(--spring),border-radius .55s var(--spring),box-shadow .3s}
  .panel.dragging,.panel.resizing{transition:none}
  .panel.dragging{box-shadow:var(--hi),0 40px 80px -24px rgba(0,0,0,.9)}
  .ph{flex:none;display:flex;align-items:center;gap:10px;min-height:50px;padding:10px 18px 6px;user-select:none;-webkit-user-select:none}
  #stage.free .ph{cursor:grab;touch-action:none}
  .pt{font-family:var(--disp);font-size:15px;letter-spacing:-.02em}
  .ps{font-size:12px;color:var(--ink3);font-weight:600}
  .ph .grow{flex:1}
  .rz{position:absolute;right:6px;bottom:6px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;display:none;z-index:5}
  .rz::after{content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);border-bottom-right-radius:4px}
  #stage.free .rz{display:block}
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink2);background:var(--glass2);box-shadow:var(--hi);white-space:nowrap;transition:background .2s,color .2s}
  button.chip:hover{background:var(--glass3);color:var(--ink)}
  .chip.on{background:rgba(255,255,255,.9);color:#0E1A30;box-shadow:none}
  .chip.hot{color:#FFD9D4;background:rgba(234,120,109,.22)}
  .ibtn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--ink2);transition:background .2s,transform .15s}
  .ibtn:hover{background:var(--glass3);color:var(--ink)}
  .ibtn:active{transform:scale(.92)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink3));flex:none}
  .lv{font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .lv-risk{background:rgba(234,120,109,.2);color:#FFC6BE}
  .lv-tight{background:rgba(227,181,101,.18);color:#F6DDA9}
  .lv-plan{background:rgba(141,176,240,.16);color:#C9DAFA}
  .lv-ok{background:rgba(124,195,163,.15);color:#BDE6D2}
  .lv-unknown{background:var(--glass2);color:var(--ink3)}
  .lv-done{background:var(--glass2);color:var(--ink3)}

  /* ---------- 주간 타임라인 ---------- */
  #p-week{z-index:20}
  .wk{flex:1;min-height:0;display:flex;gap:14px;padding:0 14px 12px}
  .wk-b3{flex:none;width:250px;display:flex;flex-direction:column;gap:5px;padding:10px 12px;border-radius:18px;background:var(--glass2);box-shadow:var(--hi);min-width:0}
  .wk-b3 h3{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono)}
  .wk-b3 h3 button{margin-left:auto;font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--acc);font-weight:700}
  .b3row{display:grid;grid-template-columns:auto minmax(0,1fr) 46px;align-items:center;gap:7px;font-size:12.5px;font-weight:650;min-width:0}
  .b3row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .b3row.done .t{color:var(--ink3);text-decoration:line-through}
  .mini{height:5px;border-radius:9px;background:var(--line2);overflow:hidden}
  .mini i{display:block;height:100%;border-radius:9px;background:var(--c,var(--acc));transition:width .8s var(--spring)}
  .b3empty{font-size:12px;color:var(--ink3);line-height:1.45}
  .days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:0}
  .dcol{position:relative;display:flex;flex-direction:column;gap:5px;padding:9px 10px 8px;border-radius:16px;min-width:0;transition:background .25s,box-shadow .25s,transform .2s var(--spring)}
  .dcol:hover{background:var(--glass2)}
  .dcol.sel{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
  .dcol.drop{background:rgba(141,176,240,.22);box-shadow:inset 0 0 0 2px var(--acc);transform:scale(1.03)}
  .dcol.past{opacity:.6}
  .dh{display:flex;align-items:baseline;gap:6px}
  .dh .w{font-size:12px;font-weight:800;color:var(--ink3)}
  .dh .d{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.05em}
  .dcol.today .dh .d{background:var(--ink);color:#0E1A30;border-radius:8px;padding:0 6px}
  .dh .tt{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--acc)}
  .stack{display:flex;height:8px;border-radius:9px;overflow:hidden;background:var(--line);gap:1px}
  .stack i{display:block;height:100%;background:var(--c)}
  .dm{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink3);font-weight:650;gap:4px;white-space:nowrap}
  .dm b{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
  .ddl{display:flex;flex-wrap:wrap;gap:3px;min-height:16px}
  .ddl span{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--glass2);color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .ddl span.risk{background:rgba(234,120,109,.22);color:#FFC6BE}
  .ddl span.tight{background:rgba(227,181,101,.2);color:#F6DDA9}
  #stage.f-phone .wk-b3,#stage.f-tall .wk-b3{display:none}
  .b3strip{display:none;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
  #stage.f-phone .b3strip,#stage.f-tall .b3strip{display:flex}
  #stage.f-phone .wk{padding:0 8px 8px;gap:0}
  #stage.f-phone .days{gap:2px}
  #stage.f-phone .dcol{padding:6px 4px;gap:4px;border-radius:12px;align-items:center}
  #stage.f-phone .dh{flex-direction:column;align-items:center;gap:1px}
  #stage.f-phone .dh .tt,#stage.f-phone .dm span,#stage.f-phone .ddl span{display:none}
  #stage.f-phone .stack{width:100%}
  #stage.f-phone .ddl{min-height:6px;justify-content:center}
  #stage.f-phone .ddl::after{content:attr(data-n);font-size:10px;font-weight:800;color:var(--ink3)}
  #stage.f-phone .ddl.hasrisk::after{color:var(--hot)}
  #stage.f-phone .dm{justify-content:center}

  /* ---------- 일간 타임박싱 ---------- */
  #p-day{z-index:10}
  .dayhead{flex-wrap:wrap;row-gap:8px}
  .dtitle{display:flex;align-items:baseline;gap:8px}
  .dtitle .disp{font-size:24px;letter-spacing:-.05em}
  .dtitle .ps{font-size:12.5px}
  .nav{display:flex;align-items:center;gap:2px}
  .metrics{display:flex;gap:16px;align-items:flex-end;margin-left:6px}
  .met{display:flex;flex-direction:column;gap:1px}
  .met b{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.05em;line-height:1}
  .met small{font-size:10.5px;color:var(--ink3);font-weight:700}
  .met.hot b{color:var(--hot)}
  .dayacts{display:flex;gap:6px;margin-left:auto}
  .day-wrap{flex:1;min-height:0;display:flex;gap:12px;padding:0 12px 12px}
  .tscroll{position:relative;flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;border-radius:20px;background:rgba(6,12,24,.28);box-shadow:inset 0 0 0 1px var(--line);scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain}
  .track{position:relative;margin:0 10px 0 0}
  .hr{position:absolute;left:52px;right:0;height:0;border-top:1px solid var(--line)}
  .hr.half{border-top-style:dashed;border-color:rgba(214,226,255,.045)}
  .hl{position:absolute;left:0;width:46px;text-align:right;transform:translateY(-7px);font-family:var(--mono);font-size:11px;color:var(--ink4)}
  .awk{position:absolute;left:52px;right:0;background:rgba(0,0,0,.25);pointer-events:none}
  .awk span{position:absolute;left:10px;font-size:10.5px;font-weight:700;color:var(--ink4)}
  .fx{position:absolute;left:58px;right:6px;border-radius:12px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--ink3);overflow:hidden;
    background:repeating-linear-gradient(135deg,rgba(214,226,255,.055) 0 6px,rgba(214,226,255,.02) 6px 12px);box-shadow:inset 0 0 0 1px var(--line)}
  .fx.meal{opacity:.7}
  .fx b{color:var(--ink2);font-weight:750}
  .gap{position:absolute;left:58px;right:6px;border-radius:12px;border:1.5px dashed rgba(214,226,255,.16);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:11.5px;font-weight:700;color:var(--ink4);transition:border-color .2s,color .2s,background .2s}
  .gap:hover,.gap.pick{border-color:var(--acc);color:var(--acc);background:rgba(141,176,240,.07)}
  .gap.pick{animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{50%{background:rgba(141,176,240,.16)}}
  .blk{position:absolute;border-radius:14px;padding:7px 10px 6px 14px;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05)),color-mix(in srgb,var(--c) 26%,rgba(14,24,44,.88));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 8px 20px -12px rgba(0,0,0,.8);
    transition:box-shadow .2s,opacity .25s,transform .2s var(--spring),filter .2s;display:flex;flex-direction:column;gap:2px}
  .blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .blk:hover{filter:brightness(1.1)}
  .blk.sel{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 2px #fff,0 14px 30px -12px rgba(0,0,0,.9)}
  .blk.drag{z-index:30;transform:scale(1.02);box-shadow:0 0 0 2px var(--acc),0 24px 44px -14px rgba(0,0,0,.95);transition:none;opacity:.95}
  .blk.done{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line2)}
  .blk.done .bt{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1.5px}
  .blk.done::before{opacity:.4}
  .blk.now{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1.5px rgba(255,255,255,.75),0 0 30px -6px color-mix(in srgb,var(--c) 70%,transparent)}
  .blk.cf{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 2px var(--hot)}
  .blk.ghost{background:rgba(141,176,240,.08);border:1.5px dashed var(--acc);box-shadow:none;cursor:default;pointer-events:none}
  .blk.ghost::before{display:none}
  .btop{display:flex;align-items:center;gap:7px;min-width:0}
  .bt{font-size:14px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .bmeta{font-size:11px;font-weight:650;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bmeta .num{font-size:11px}
  .bwarn{font-size:11px;font-weight:800;color:#FFC6BE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bchk{flex:none;width:20px;height:20px;border-radius:50%;border:1.8px solid rgba(255,255,255,.55);display:grid;place-items:center;transition:background .2s,border-color .2s}
  .bchk:hover{border-color:#fff;background:rgba(255,255,255,.15)}
  .blk.done .bchk{background:var(--ok);border-color:var(--ok);color:#0E1A30}
  .btag{flex:none;font-size:9.5px;font-weight:900;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.88);color:#0E1A30;font-family:var(--mono)}
  .btag.b3{background:transparent;color:var(--warn);padding:0;font-size:12px;letter-spacing:0}
  .btag.late{background:rgba(234,120,109,.25);color:#FFC6BE}
  .bh{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
  .bh::after{content:"";position:absolute;left:50%;bottom:3px;width:28px;height:3px;margin-left:-14px;border-radius:3px;background:rgba(255,255,255,.4);opacity:0;transition:opacity .2s}
  .blk:hover .bh::after,.blk.sel .bh::after{opacity:1}
  @media (hover:none){.bh::after{opacity:.6}}
  .blk.short{padding-top:3px;padding-bottom:3px;flex-direction:row;align-items:center;gap:8px}
  .blk.short .btop{flex:1 1 auto;min-width:0}
  .blk.short .bt{flex:0 1 auto;min-width:3.5em}
  .blk.short .bmeta{flex:0 1 auto;min-width:0}
  .nowline{position:absolute;left:46px;right:0;height:0;border-top:2px solid #fff;z-index:25;pointer-events:none;box-shadow:0 0 10px rgba(255,255,255,.6)}
  .nowline::before{content:"";position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:#fff}
  .nowline span{position:absolute;right:8px;top:-22px;font-family:var(--mono);font-size:11px;font-weight:600;color:#0E1A30;background:#fff;padding:1px 7px;border-radius:999px}
  .dragtip{position:absolute;z-index:40;left:58px;font-family:var(--mono);font-size:11.5px;font-weight:600;background:#fff;color:#0E1A30;padding:2px 8px;border-radius:8px;pointer-events:none;transform:translateY(-100%)}
  .day-side{flex:none;width:280px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none;padding-right:var(--sidepad,0px)}
  #stage.f-tall .day-side,#stage.f-phone .day-side{display:none}
  .card{border-radius:20px;background:var(--glass2);box-shadow:var(--hi);padding:12px 14px}
  .card h3{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .card h3 .kr{font-family:var(--sans);font-size:12.5px;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:800}
  .card h3 button{margin-left:auto;font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:12px;color:var(--acc);font-weight:700}
  .trow{display:flex;align-items:center;gap:8px;width:100%;padding:7px 4px;border-radius:10px;font-size:13px;font-weight:650;min-width:0;transition:background .15s}
  button.trow:hover{background:var(--glass2)}
  .trow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow small{font-size:11px;color:var(--ink3);font-weight:650;white-space:nowrap}
  .trow.on{background:rgba(141,176,240,.16);box-shadow:inset 0 0 0 1.5px var(--acc)}
  .trow.done .t{color:var(--ink3);text-decoration:line-through}
  .hint{font-size:12px;color:var(--ink3);line-height:1.5}
  .propbar{margin:0 12px 10px;padding:12px 14px;border-radius:18px;background:linear-gradient(90deg,rgba(227,181,101,.2),rgba(227,181,101,.08));box-shadow:inset 0 0 0 1px rgba(227,181,101,.35);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .pickbar{background:linear-gradient(90deg,rgba(141,176,240,.22),rgba(141,176,240,.08));box-shadow:inset 0 0 0 1px rgba(141,176,240,.4)}
  .pickbar p b{color:var(--acc)}
  .propbar p{flex:1;min-width:220px;font-size:13.5px;font-weight:650;line-height:1.45}
  .propbar p b{display:block;font-size:10.5px;letter-spacing:.1em;font-family:var(--mono);color:var(--warn);margin-bottom:2px}
  .propbar .acts{display:flex;gap:6px}
  .btn{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:800;background:var(--glass3);box-shadow:var(--hi);white-space:nowrap;transition:background .2s,transform .15s}

  .btn:active{transform:scale(.97)}
  .btn.pri{background:#fff;color:#0E1A30;box-shadow:none}
  .btn.pri:hover{background:#E6EDFA}
  .btn.danger{color:#FFC6BE}
  .btn[disabled]{opacity:.45;cursor:default}

  /* ---------- 마감 사이드바 (커브드) ---------- */
  #p-dl{z-index:30;border-radius:120px 30px 30px 120px / 50% 30px 30px 50%;
    background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 45%),rgba(26,40,70,.62)}
  #p-dl.open{border-radius:64px 30px 30px 64px / 40% 30px 30px 40%;box-shadow:var(--hi),-30px 0 80px -20px rgba(2,6,16,.9)}
  #stage.free #p-dl,#stage.f-phone #p-dl{border-radius:30px}
  #p-dl .ph{padding:16px 16px 6px 92px}
  #p-dl.open .ph{padding-left:60px}
  #stage.free #p-dl .ph,#stage.f-phone #p-dl .ph{padding-left:18px}
  .dlb{flex:1;min-height:0;display:flex;gap:14px;padding:0 16px 14px 50px;transition:padding .55s var(--spring)}
  #p-dl.open .dlb{padding-left:40px}
  #stage.free .dlb,#stage.f-phone .dlb{padding-left:14px}
  .dllist{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
  #p-dl.open .dllist{flex:none;width:300px}
  .dlrow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 10px;align-items:center;padding:10px 10px;border-radius:16px;transition:background .2s,box-shadow .2s;text-align:left;width:100%}
  .dlrow:hover{background:var(--glass2)}
  .dlrow.on{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
  .dlrow .dd{grid-row:span 2;font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.06em;text-align:center;padding:8px 0;border-radius:12px;background:var(--glass2)}
  .dlrow .dd.risk{background:var(--hot);color:#1A0E0C}
  .dlrow .dd.tight{background:rgba(227,181,101,.85);color:#1D1606}
  .dlrow .dd.near{background:#fff;color:#0E1A30}
  .dlrow .t{font-size:13.5px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dlrow .s{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);font-weight:650;min-width:0}
  .dlrow .s span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dlempty{padding:20px 6px;font-size:13px;color:var(--ink3);line-height:1.5}
  .dldetail{flex:1;min-width:0;display:none;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none;opacity:0;transition:opacity .4s .15s}
  #p-dl.open .dldetail{display:flex;opacity:1}
  .dd-title{font-size:22px;font-weight:850;letter-spacing:-.04em;line-height:1.2;word-break:keep-all}
  .dd-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);font-weight:650}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{padding:10px 12px;border-radius:16px;background:var(--glass2);box-shadow:var(--hi)}
  .stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.05em}
  .stat small{font-size:11px;color:var(--ink3);font-weight:700}
  .riskline{padding:10px 12px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.45}
  .riskline.risk{background:rgba(234,120,109,.18);color:#FFD5CF}
  .riskline.tight{background:rgba(227,181,101,.16);color:#F6DDA9}
  .riskline.plan{background:rgba(141,176,240,.14);color:#D3E1FB}
  .riskline.ok,.riskline.done{background:rgba(124,195,163,.13);color:#C9EBDA}
  .riskline.unknown{background:var(--glass2);color:var(--ink2)}
  .acts-row{display:flex;flex-wrap:wrap;gap:6px}
  .must{margin-top:6px;padding:12px 12px 10px;border-radius:18px;background:rgba(0,0,0,.16);box-shadow:inset 0 0 0 1px var(--line)}
  .must h3{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:850;margin-bottom:6px}
  .must h3 .n{font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:999px;background:var(--glass3)}
  .must h3 .n.left{background:var(--hot);color:#1A0E0C}
  .mrow{display:flex;align-items:center;gap:8px;width:100%;padding:5px 2px;font-size:13px;font-weight:650;text-align:left}
  .mrow .box{flex:none;width:18px;height:18px;border-radius:6px;border:1.6px solid var(--ink3);display:grid;place-items:center}
  .mrow.done .box{background:var(--ok);border-color:var(--ok);color:#0E1A30}
  .mrow.done .t{color:var(--ink3);text-decoration:line-through}
  .mrow .once{font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:0 4px}
  .mrow .x{margin-left:auto;color:var(--ink4);padding:0 4px}
  .madd{display:flex;gap:6px;margin-top:6px}
  .madd input[type=text]{flex:1;min-width:0;height:34px;border-radius:10px;border:0;background:var(--glass2);box-shadow:var(--hi);padding:0 10px;font-size:13px}
  .madd label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3);font-weight:650}
  .mopts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .mopts button{font-size:11.5px;font-weight:700;color:var(--ink3);padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2)}
  .mopts button[aria-pressed="true"]{background:var(--glass3);color:var(--ink)}
  /* 세로 태블릿: 접힌 사이드바 = 오른쪽 레일 (마감 칩만) */
  .rail{display:none;flex-direction:column;gap:8px;align-items:center;padding:10px 0;overflow-y:auto;scrollbar-width:none}
  #stage.f-tall #p-dl:not(.open) .rail{display:flex}
  #stage.f-tall #p-dl:not(.open) .dlb,#stage.f-tall #p-dl:not(.open) .ph .ps,#stage.f-tall #p-dl:not(.open) .ph .ibtn{display:none}
  #stage.f-tall #p-dl:not(.open) .ph{padding:12px 0 0;justify-content:center}
  #stage.f-tall #p-dl:not(.open) .pt{font-size:11px;writing-mode:vertical-rl}
  .rail button{width:52px;padding:7px 0;border-radius:14px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;background:var(--glass2);box-shadow:var(--hi)}
  .rail button.risk{background:var(--hot);color:#1A0E0C}
  .rail button.tight{background:rgba(227,181,101,.85);color:#1D1606}
  .rail small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
  /* 폰: 접힌 사이드바 = 가로 칩 줄 */
  .strip{display:none;align-items:center;gap:6px;padding:0 10px;overflow-x:auto;scrollbar-width:none;height:100%}
  #stage.f-phone #p-dl:not(.open) .strip{display:flex}
  #stage.f-phone #p-dl:not(.open) .dlb,#stage.f-phone #p-dl:not(.open) .ph{display:none}
  #stage.f-phone #p-dl:not(.open){border-radius:22px}
  .strip button{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 4px;border-radius:999px;background:var(--glass2);box-shadow:var(--hi);font-size:12.5px;font-weight:750;max-width:200px}
  .strip button b{font-family:var(--mono);font-size:12px;padding:3px 7px;border-radius:999px;background:var(--glass3)}
  .strip button b.risk{background:var(--hot);color:#1A0E0C}
  .strip button b.tight{background:rgba(227,181,101,.85);color:#1D1606}
  .strip button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage.f-phone #p-dl.open .dlb{flex-direction:column;overflow-y:auto}
  #stage.f-phone #p-dl.open .dllist{width:auto;flex:none;overflow:visible}
  #stage.f-phone #p-dl.open .dldetail{overflow:visible}

  /* ---------- 아래: 계획 세우기 ---------- */
  .planbar{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border-radius:999px;z-index:40;max-width:calc(100% - 24px)}
  .planbar form{display:flex;align-items:center;flex:1;min-width:0}
  .planbar input{width:340px;min-width:0;flex:1;height:42px;border:0;border-radius:999px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px var(--line);padding:0 16px;font-size:14px;font-weight:600}
  .planbar input::placeholder{color:var(--ink4)}
  .planbar .go{height:42px;padding:0 20px;border-radius:999px;background:#fff;color:#0E1A30;font-weight:850;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .planbar .go:hover{background:#E6EDFA}
  #stage.f-phone .planbar input{width:auto}
  #stage.f-phone .planbar .chip{display:none}
  .toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-10px);opacity:0;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 16px;border-radius:999px;background:rgba(255,255,255,.95);color:#0E1A30;font-size:13.5px;font-weight:700;pointer-events:none;z-index:300;transition:opacity .25s,transform .35s var(--spring);max-width:90%}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{white-space:nowrap;font-weight:850;color:var(--acc2);padding:2px 8px}
  .toast button[hidden]{display:none}

  /* ---------- 대화상자 ---------- */
  dialog{margin:auto;border:0;color:var(--ink);border-radius:28px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03)),rgba(18,29,52,.9);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);box-shadow:var(--hi),0 40px 100px -30px #000}
  dialog::backdrop{background:rgba(5,9,18,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  dialog[open]{animation:dlgin .4s var(--spring)}
  @keyframes dlgin{from{opacity:0;transform:translateY(16px) scale(.98)}}
  .dlg{display:flex;flex-direction:column;gap:12px;padding:22px 22px 18px;overflow-y:auto;max-height:calc(100dvh - 24px)}
  .dlg h2{font-size:19px;font-weight:850;letter-spacing:-.03em}
  .dlg label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink3)}
  .dlg input:not([type=checkbox]):not([type=radio]),.dlg select,.dlg textarea{height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line2);padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);width:100%}
  .dlg select option{background:#14213A}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips label{flex-direction:row;align-items:center}
  .chips input{position:absolute;opacity:0;pointer-events:none}
  .chips span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--glass2);box-shadow:var(--hi);font-size:13px;font-weight:750;color:var(--ink2);cursor:pointer}
  .chips input:checked+span{background:#fff;color:#0E1A30;box-shadow:none}
  .chips input:focus-visible+span{outline:2px solid var(--acc)}
  .check{flex-direction:row!important;align-items:center;gap:8px!important;font-size:14px!important;color:var(--ink)!important}
  .check input{width:18px;height:18px;accent-color:#8DB0F0}
  .dlg .note{font-size:12px;color:var(--ink3);line-height:1.5;font-weight:600}
  .dlg .warnbox{padding:10px 12px;border-radius:14px;background:rgba(234,120,109,.16);color:#FFD5CF;font-size:13px;font-weight:700;line-height:1.45;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .dbtns .sp{flex:1}
  /* 계획 세우기 시트 */
  #planDlg{max-width:min(1040px,calc(100vw - 24px));height:min(780px,calc(100dvh - 24px))}
  #planDlg .dlg{height:100%;padding:0}
  .sh-head{display:flex;align-items:center;gap:10px;padding:18px 20px 10px;flex-wrap:wrap}
  .steps{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px var(--line);overflow-x:auto;scrollbar-width:none}
  .steps button{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:750;color:var(--ink3);white-space:nowrap}
  .steps button i{font-style:normal;font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--glass3)}
  .steps button[aria-current="step"]{background:#fff;color:#0E1A30}
  .steps button[aria-current="step"] i{background:#0E1A30;color:#fff}
  .sh-body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 20px}
  .sh-foot{display:flex;gap:8px;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--line)}
  .sh-foot .sp{flex:1}
  .sh-lead{font-size:13px;color:var(--ink2);line-height:1.5;margin:4px 0 12px;font-weight:600}
  .bd-add{display:flex;gap:8px;margin-bottom:12px}
  .bd-add input{flex:1;height:44px;border-radius:14px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line2);padding:0 14px;font-size:15px;font-weight:600}
  .grp{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
  .grp::after{content:"";flex:1;height:1px;background:var(--line)}
  .grp .kr{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink);font-weight:800}
  .bdrow{display:grid;grid-template-columns:28px minmax(0,1fr) 92px 84px 132px 70px auto;gap:8px;align-items:center;padding:6px 6px;border-radius:12px}
  .bdrow:hover{background:var(--glass2)}
  .bdrow.done .ttl{color:var(--ink3);text-decoration:line-through}
  .bdrow .ttl{display:flex;flex-direction:column;min-width:0;font-size:14px;font-weight:750}
  .bdrow .ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bdrow .ttl small{font-size:11px;color:var(--ink3);font-weight:650}
  .bdrow select,.bdrow input{height:34px;border-radius:10px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line);padding:0 8px;font-size:13px;font-weight:650;width:100%;color:var(--ink)}
  .bdrow select option{background:#14213A}
  .stars{display:flex;gap:0}
  .stars button{font-size:16px;color:var(--ink4);padding:0 2px;line-height:1}
  .stars button.on{color:var(--warn)}
  .bdrow .x{color:var(--ink3);font-size:12px;font-weight:700;padding:4px 6px}
  .boxchk{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--ink3);display:grid;place-items:center}
  .boxchk.on{background:var(--ok);border-color:var(--ok);color:#0E1A30}
  @media (max-width:760px){.bdrow{grid-template-columns:28px minmax(0,1fr) 70px auto;grid-template-areas:"c t t x" ". s e p" ". d d d"}
    .bdrow>:nth-child(1){grid-area:c}.bdrow>:nth-child(2){grid-area:t}.bdrow>:nth-child(3){grid-area:s}.bdrow>:nth-child(4){grid-area:e}.bdrow>:nth-child(5){grid-area:d}.bdrow>:nth-child(6){grid-area:p}.bdrow>:nth-child(7){grid-area:x}}
  .b3grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.b3grid{grid-template-columns:1fr}}
  .b3box{border-radius:20px;background:var(--glass2);box-shadow:var(--hi);padding:14px}
  .b3box h3{font-size:15px;font-weight:850;display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .b3box .state{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .b3box .state.ok{background:rgba(124,195,163,.18);color:#BDE6D2}
  .b3box .state.no{background:rgba(227,181,101,.18);color:#F6DDA9}
  .cand{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 6px;border-radius:12px;text-align:left}
  .cand:hover{background:var(--glass2)}
  .cand .t{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cand .why{grid-column:2/4;font-size:11.5px;color:var(--ink3);font-weight:650;margin-top:-4px}
  .cand .sc{font-family:var(--mono);font-size:11px;color:var(--ink4)}
  .altbl{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
  @media (max-width:760px){.altbl{grid-template-columns:1fr}}
  .need{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 56px 92px;gap:6px;align-items:center;padding:7px 6px;border-radius:12px;font-size:13px;font-weight:700}
  .need.head{font-size:11px;color:var(--ink3);font-weight:750}
  .need .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
  .need .num{text-align:right;font-size:12.5px}
  .cap{display:grid;grid-template-columns:44px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:12px;font-weight:700;padding:4px 0}
  .capbar{position:relative;height:12px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}
  .capbar i{height:100%;display:block}
  .capbar i.p{background:var(--acc2)}
  .capbar i.g{background:repeating-linear-gradient(135deg,var(--acc) 0 4px,rgba(141,176,240,.5) 4px 8px)}
  .prow{display:grid;grid-template-columns:24px 86px minmax(0,1fr) 76px;gap:8px;align-items:center;padding:6px;border-radius:10px;font-size:13px;font-weight:700;width:100%;text-align:left}
  .prow:hover{background:var(--glass2)}
  .prow .num{font-size:12px;color:var(--ink2)}
  .left-note{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(234,120,109,.14);color:#FFD5CF;font-size:12.5px;font-weight:700;line-height:1.5}
  .tblist .trow{padding:8px}

  /* 좁은 화면 */
  #stage.organized.f-wide .day-wrap{padding-right:56px}
  #stage.organized.f-tall .day-wrap{padding-right:38px}
  #stage.f-tall .day-side.show,#stage.f-phone .day-side.show{display:flex;position:absolute;right:14px;top:96px;bottom:14px;width:min(320px,calc(100% - 28px));z-index:36;padding:10px;border-radius:24px;
    background:rgba(18,29,52,.94);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--hi),var(--shadow)}
  #stage.organized.f-tall .day-side.show{right:44px}
  #stage.f-phone .topbar{left:10px;right:10px;height:56px;gap:8px}
  #stage.f-phone .mode-seg,#stage.f-phone .tb-right a,#stage.f-phone #dateTxt,#stage.f-phone .brand .tag{display:none}
  #stage.f-phone .brand{margin-right:auto}
  #stage.f-phone .brand .disp{font-size:22px}
  #stage.f-phone .metrics{gap:10px;margin-left:0}
  #stage.f-phone .met b{font-size:15px}
  #stage.f-phone .dtitle .ps{display:none}
  #stage.f-phone .ph{padding:8px 12px 4px}
  #stage.f-phone .day-wrap{padding:0 6px 6px}
  #stage.f-phone .hl{width:38px;font-size:10px}
  #stage.f-tall .tb-right a{display:none}
  a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
  .strip button b{white-space:nowrap}
  #stage.f-phone .b3strip{padding:0 8px 8px}
  #stage.f-phone .b3strip .chip{height:26px;font-size:11.5px}
  #stage.f-phone .propbar{margin:0 6px 8px;padding:10px 12px;gap:8px}
  #stage.f-phone .propbar p{font-size:12.5px;min-width:0;flex-basis:100%}
  #stage.f-phone .propbar .btn{height:32px;padding:0 11px;font-size:12px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/decide/boot.js"></script>
<div id="stage" class="organized f-wide">
  <div id="city" aria-hidden="true"></div>
  <div class="bg-veil" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span class="disp">SABATHIA</span><span class="tag"><b>WS — Planner</b><span id="volTag">Vol.26 / No.11</span></span></div>
    <div class="seg mode-seg" role="group" aria-label="배치 모드">
      <button data-act="mode" data-mode="organized" aria-pressed="true">정돈 모드</button>
      <button data-act="mode" data-mode="free" aria-pressed="false">자유 모드</button>
    </div>
    <div class="tb-right">
      <button class="chip" data-act="reset" id="resetBtn" hidden>창 정리</button>
      <a href="/plan/">15577</a>
      <a href="/decide/">기존 판단</a>
      <span id="dateTxt"></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <section class="panel glass" id="p-week" data-id="week" aria-label="주간 타임라인">
    <div class="ph"><span class="pt">WEEK</span><span class="ps" id="weekSub"></span><span class="grow"></span>
      <div class="nav"><button class="ibtn" data-act="wk" data-d="-7" aria-label="지난주"><span data-ic="left"></span></button><button class="chip" data-act="today">이번 주</button><button class="ibtn" data-act="wk" data-d="7" aria-label="다음 주"><span data-ic="right"></span></button></div>
    </div>
    <div class="wk" id="b-week"></div>
    <div class="b3strip" id="b3strip"></div>
    <span class="rz" aria-hidden="true"></span>
  </section>

  <section class="panel glass" id="p-day" data-id="day" aria-label="일간 타임박싱 플래너">
    <div class="ph dayhead">
      <div class="dtitle"><span class="disp" id="dayTitle">--</span><span class="ps" id="daySub"></span></div>
      <div class="nav"><button class="ibtn" data-act="dayby" data-d="-1" aria-label="전날"><span data-ic="left"></span></button><button class="ibtn" data-act="dayby" data-d="1" aria-label="다음 날"><span data-ic="right"></span></button></div>
      <div class="metrics" id="metrics"></div>
      <div class="dayacts"><button class="chip" data-act="tray" id="trayBtn" aria-pressed="false">미배치</button><button class="chip" data-act="newblock"><span data-ic="plus"></span>블록</button></div>
    </div>
    <div id="propBar"></div>
    <div class="day-wrap">
      <div class="tscroll" id="tscroll"><div class="track" id="track"></div></div>
      <aside class="day-side" id="daySide" aria-label="오늘 Big 3와 미배치 작업"></aside>
    </div>
    <span class="rz" aria-hidden="true"></span>
  </section>

  <section class="panel glass" id="p-dl" data-id="dl" aria-label="마감">
    <div class="ph"><span class="pt">DEADLINE</span><span class="ps" id="dlSub"></span><span class="grow"></span>
      <button class="ibtn" data-act="dlopen" id="dlToggle" aria-expanded="false" aria-label="마감 자세히 보기"><span data-ic="expand"></span></button></div>
    <div class="rail" id="dlRail"></div>
    <div class="strip" id="dlStrip"></div>
    <div class="dlb"><div class="dllist" id="dlList"></div><div class="dldetail" id="dlDetail"></div></div>
    <span class="rz" aria-hidden="true"></span>
  </section>

  <div class="planbar glass" id="planbar">
    <form id="quickAdd" autocomplete="off"><input name="q" placeholder="빠르게 추가 — 예: 수학 숙제 1시간 내일 !!" aria-label="작업 빠르게 추가 (제목 · 시간 · 마감 · 중요도)"></form>
    <button class="chip" data-act="plan" data-step="2" id="b3chip">Big 3</button>
    <button class="go" data-act="plan" data-step="1">계획 세우기 <span data-ic="arrow"></span></button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
</div>

<dialog id="blkDlg" aria-labelledby="blkH"><form method="dialog" class="dlg" id="blkForm">
  <h2 id="blkH">블록</h2>
  <div class="warnbox" id="blkWarn" hidden></div>
  <label>제목<input name="title" autocomplete="off" placeholder="비우면 과목 이름"></label>
  <div><div class="note" style="margin-bottom:6px">과목</div><div class="chips" id="blkCats" role="radiogroup" aria-label="과목"></div></div>
  <div class="chips" role="radiogroup" aria-label="종류">
    <label><input type="radio" name="kind" value="solve"><span>문풀</span></label>
    <label><input type="radio" name="kind" value="review"><span>정리</span></label>
    <label><input type="radio" name="kind" value="lecture"><span>인강</span></label>
  </div>
  <div class="row3">
    <label>날짜<input name="date" type="date" required></label>
    <label>시작<input name="start" type="time" step="300" required></label>
    <label>예상 시간(분)<input name="dur" type="number" min="10" step="5" inputmode="numeric" required></label>
  </div>
  <label>작업 <small style="font-weight:600">(한 작업을 여러 블록에 나눠 둘 수 있어요)</small><select name="task" id="blkTask"></select></label>
  <label class="check"><input type="checkbox" name="done"> 완료</label>
  <label id="actW">실제 걸린 시간(분) <small style="font-weight:600">— 모르면 비워 두세요. 추정해서 적지 않아요</small><input name="actual" type="number" min="1" inputmode="numeric"></label>
  <div class="dbtns">
    <button type="button" class="btn" data-bact="extend" id="bExtend">아직 안 끝남 +15분</button>
    <button type="button" class="btn" data-bact="split" id="bSplit">나누기</button>
    <button type="button" class="btn" data-bact="carry" id="bCarry">다음 날로</button>
    <a class="btn" id="bOpen15577" href="/plan/" style="display:inline-flex;align-items:center;text-decoration:none">15577에서</a>
  </div>
  <div class="dbtns"><button value="del" class="btn danger" id="bDel" formnovalidate>삭제</button><span class="sp"></span><button value="cancel" class="btn" formnovalidate>닫기</button><button value="save" class="btn pri">저장</button></div>
</form></dialog>

<dialog id="taskDlg" aria-labelledby="taskH"><form method="dialog" class="dlg" id="taskForm">
  <h2 id="taskH">작업</h2>
  <p class="note" id="taskSrc"></p>
  <label>제목<input name="title" autocomplete="off" required></label>
  <div><div class="note" style="margin-bottom:6px">과목</div><div class="chips" id="taskSubj" role="radiogroup" aria-label="과목"></div></div>
  <div class="row3">
    <label>예상 시간(분)<input name="est" type="number" min="5" step="5" inputmode="numeric" placeholder="모르면 비움"></label>
    <label>마감 날짜<input name="deadline" type="date"></label>
    <label>마감 시각<input name="deadlineTime" type="time"></label>
  </div>
  <div class="chips" role="radiogroup" aria-label="중요도">
    <label><input type="radio" name="priority" value=""><span>중요도 없음</span></label>
    <label><input type="radio" name="priority" value="1"><span>★</span></label>
    <label><input type="radio" name="priority" value="2"><span>★★</span></label>
    <label><input type="radio" name="priority" value="3"><span>★★★</span></label>
  </div>
  <label>메모<input name="note" autocomplete="off"></label>
  <label class="check"><input type="checkbox" name="done"> 끝냄</label>
  <div class="dbtns"><button value="drop" class="btn danger" id="tDrop" formnovalidate>목록에서 빼기</button><span class="sp"></span><button value="cancel" class="btn" formnovalidate>닫기</button><button value="save" class="btn pri">저장</button></div>
</form></dialog>

<dialog id="planDlg" aria-labelledby="planH"><div class="dlg">
  <div class="sh-head">
    <h2 id="planH" class="sr">계획 세우기</h2>
    <nav class="steps" id="steps" aria-label="계획 단계">
      <button data-step="1"><i>1</i>Brain Dump</button>
      <button data-step="2"><i>2</i>Big 3</button>
      <button data-step="3"><i>3</i>시간 배분</button>
      <button data-step="4"><i>4</i>타임박싱</button>
    </nav>
    <span style="flex:1"></span>
    <button class="ibtn" data-act="planclose" aria-label="닫기"><span data-ic="close"></span></button>
  </div>
  <div class="sh-body" id="planBody"></div>
  <div class="sh-foot" id="planFoot"></div>
</div></dialog>

<script src="/sabathia.js"></script>
<script src="/today.js"></script>
<script type="module" src="/decide/ws.js"></script>
</body>
</html>
