<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수업 녹음</title>
<meta name="description" content="수업을 받아쓰고, 전사문을 복사해 수업 노트(Claude 아티팩트)로 보낸다">
<meta name="theme-color" content="#f9f9f8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&family=Hahmlet:wght@500;800&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 수업 녹음 · 디자인 언어 v1.0
   Layout: 560px 단일 열. SABATHIA 줄 → 화면 제목 → 모드·과목 → 녹음 버튼 → 보관함. 녹음 중엔 큰 시계 + 받아쓰기 칸 */
:root {
  --bg: #ffffff; --ink: #000000; --muted: #5c5c5c;
  --accent: #026395; --on-accent: #ffffff;
  --warn: #d1001f; --on-warn: #ffffff; --warn-text: #d1001f;
  --map-pending: #c4c4c4; --map-empty: #f0f0f0;
  --line-bold: 3px; --line-thin: 1px; --body-size: 16px;
  --pad-x: 20px; --gap-section: 24px;
  --font-title: 'Hahmlet', 'Noto Serif KR', serif;
  --font-body: 'Gothic A1', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --font-num: 'Space Grotesk', 'Gothic A1', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --ink: #ffffff; --muted: #a3a3a3;
    --accent: #4fb3e0; --on-accent: #000000;
    --warn: #e4002b; --on-warn: #ffffff; --warn-text: #ff6b6b;
    --map-pending: #5a5a5a; --map-empty: #1c1c1c;
    --line-thin: 2px; --body-size: 17px;
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-theme="projector"] {
  --bg: #000000; --ink: #ffffff; --muted: #a3a3a3;
  --accent: #4fb3e0; --on-accent: #000000;
  --warn: #e4002b; --on-warn: #ffffff; --warn-text: #ff6b6b;
  --map-pending: #5a5a5a; --map-empty: #1c1c1c;
  --line-thin: 2px; --body-size: 17px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-weight: 500; font-size: var(--body-size); line-height: 22px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; word-break: keep-all;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; border-radius: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(var(--pad-x), env(safe-area-inset-left, 0px));
  padding-right: max(var(--pad-x), env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
}
.sab { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-family: var(--font-num); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; color: var(--ink); text-decoration: none; }
.sab span { color: var(--muted); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 4px; border-bottom: var(--line-bold) solid var(--ink); padding-bottom: 8px; }
.page-title { font-family: var(--font-title); font-weight: 800; font-size: 44px; line-height: 48px; margin: 0; overflow-wrap: anywhere; }
.page-sub { font-family: var(--font-num); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-bottom: 6px; }
.lead { margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }
.num { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-num); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; }
.meta { font-size: 13px; line-height: 18px; color: var(--muted); margin: 0; }

.sec { margin-top: var(--gap-section); display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: var(--line-bold) solid var(--ink); padding-block: 10px 0; }
.sec-title { font-family: var(--font-title); font-weight: 800; font-size: 24px; line-height: 30px; margin: 0; }
.sec-count { font-family: var(--font-num); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

.seg { display: grid; grid-template-columns: 1fr 1fr; border-bottom: var(--line-thin) solid var(--ink); }
.seg button { min-height: 48px; font-size: 17px; border-bottom: 3px solid transparent; margin-bottom: calc(-1 * var(--line-thin)); }
.seg button[aria-pressed="true"] { font-weight: 800; color: var(--accent); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border: var(--line-thin) solid var(--ink); }
.chip[aria-pressed="true"] { border: 2px solid var(--accent); color: var(--accent); font-weight: 800; padding: 0 13px; }
.chip.ghost { border-style: dashed; color: var(--muted); }
.addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

.btn { min-height: 48px; padding: 0 18px; border: var(--line-thin) solid var(--ink); font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.big { min-height: 64px; font-size: 18px; width: 100%; }
.btn:disabled { color: var(--muted); border-color: var(--map-pending); background: var(--map-empty); cursor: not-allowed; }
.btn.danger { background: var(--warn); color: var(--on-warn); border-color: var(--warn); }
.btn:active:not(:disabled), .chip:active { transform: scale(0.97); transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-warn { background: var(--warn); color: var(--on-warn); font-weight: 800; font-size: 12px; padding: 3px 8px; white-space: nowrap; }
.chip-acc { border: 2px solid var(--accent); color: var(--accent); font-weight: 800; font-size: 12px; padding: 1px 6px; white-space: nowrap; }

input, textarea { background: var(--bg); border: var(--line-thin) solid var(--ink); border-radius: 0; padding: 10px 12px; min-height: 48px; width: 100%; }
textarea { line-height: 1.7; resize: vertical; min-height: 45vh; }

.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px 0; border-bottom: var(--line-thin) solid var(--ink); width: 100%; min-height: 60px; }
.row-m { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-k { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row-t { font-family: var(--font-title); font-weight: 800; font-size: 18px; line-height: 24px; }

.clock { font-family: var(--font-num); font-weight: 700; font-size: clamp(64px, 22vw, 132px); line-height: .95; letter-spacing: -.05em; font-variant-numeric: tabular-nums; margin-top: 16px; }
.status { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; min-height: 24px; margin: 0; }
.status.bad { color: var(--warn-text); }
.dot { width: 10px; height: 10px; background: var(--accent); display: inline-block; flex-shrink: 0; animation: blink 1.2s steps(2, jump-none) infinite; }
@keyframes blink { 50% { background: transparent; } }
.live { border-top: var(--line-bold) solid var(--ink); padding-top: 12px; min-height: 36vh; max-height: 50vh; overflow-y: auto; white-space: pre-wrap; font-size: 17px; line-height: 1.7; overflow-wrap: anywhere; }
.live .int, .live .ph { color: var(--muted); }
.warnbox { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--ink); color: var(--bg); padding: 10px 16px; font-weight: 800; font-size: 14px; max-width: calc(100% - 40px); }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .btn:active, .chip:active { transform: none; } }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app">
  <a class="sab" href="/" aria-label="Sabathia 홈으로">SABATHIA<span>LEC-05</span></a>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/sabathia.js"></script>
<script>
'use strict';
/* 수업 노트 아티팩트. 정리·저장·복습은 거기서 한다. 여기는 받아쓰기와 전송(복사)만 */
const NOTE_URL = 'https://claude.ai/artifact/799cSCZn6VKRq2x2xBjxnY';
const MODE = { school: { name: '학교', code: 'SCH' }, academy: { name: '학원', code: 'ACA' } };
const DEF_SUBJ = { school: ['국어', '수학', '영어', '한국사', '사회', '과학'], academy: ['수학', '영어', '국어', '과학'] };
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const MAX_RECS = 40;

const $ = (s) => document.querySelector(s);
const main = $('#main');
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const md = (s) => s ? s.slice(5).replace('-', '.') : '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hms(sec) {
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
}
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('lecture.' + k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lecture.' + k, JSON.stringify(v)); return true; } catch { return false; } },
};
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- 상태 ---------- */
const S = {
  view: 'home', mode: store.get('mode', 'school'), subjects: store.get('subjects', DEF_SUBJ),
  subject: '', recs: store.get('recs', []), cur: null, adding: false,
};
S.subject = store.get('subject.' + S.mode, '');
const rec = (id) => S.recs.find((r) => r.id === id);
function saveRecs() {
  while (S.recs.length > MAX_RECS) { const i = S.recs.map((r) => r.sent).lastIndexOf(true); if (i < 0) break; S.recs.splice(i, 1); }
  if (!store.set('recs', S.recs)) toast('저장 공간이 부족합니다. 보낸 녹음을 지우세요');
  const t = today(), unsent = S.recs.filter((r) => !r.sent && (r.text || '').trim()).length;
  const todays = S.recs.filter((r) => r.date === t);
  if (window.Sabathia) Sabathia.report('lecture', { unsent, n: todays.length, min: Math.round(todays.reduce((a, r) => a + (r.sec || 0), 0) / 60) });
}
// 수업 노트가 알아보는 머리줄. 형식을 바꾸면 artifacts/lecture.html 의 parseHeader 도 같이 바꾼다
const header = (r) => `[수업노트] ${MODE[r.mode].name} · ${r.subject} · ${r.date} · ${hms(r.sec || 0)}`;
const payload = (r) => header(r) + '\n' + (r.text || '').trim();

/* ---------- 받아쓰기 ---------- */
const R = {
  on: false, active: false, stopping: false, sr: null, final: '', sess: [], interim: '',
  acc: 0, since: 0, timer: null, wake: null, blocked: '', lastErr: '',
  elapsed() { return this.acc + (this.on && this.since ? (Date.now() - this.since) / 1000 : 0); },
};
function startRec(r) {
  S.cur = r.id; R.blocked = ''; R.lastErr = '';
  R.final = r.text || ''; R.sess = []; R.interim = ''; R.acc = r.sec || 0;
  R.on = true; R.since = Date.now(); S.view = 'rec'; render();
  spawn(); wake(true);
  clearInterval(R.timer);
  R.timer = setInterval(() => { const c = $('#clock'); if (c) c.textContent = hms(R.elapsed()); }, 1000);
}
function spawn() {
  if (!R.on || R.active) return;
  let sr; try { sr = new SRC(); } catch { R.blocked = 'unsupported'; endBlocked(); return; }
  sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true; sr.maxAlternatives = 1;
  sr.onstart = () => { R.active = true; R.lastErr = ''; paintLive(); };
  sr.onresult = (e) => {
    const fin = []; let it = '';
    for (let i = 0; i < e.results.length; i++) {
      const res = e.results[i], t = ((res[0] && res[0].transcript) || '').trim();
      if (!t) continue;
      if (res.isFinal) { const p = fin[fin.length - 1]; if (p && t.startsWith(p)) fin[fin.length - 1] = t; else fin.push(t); } // 안드로이드 누적 결과 보정
      else it = t;
    }
    R.sess = fin; R.interim = it; paintLive();
  };
  sr.onerror = (e) => {
    if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) { R.blocked = e.error; endBlocked(); }
    else if (e.error !== 'no-speech' && e.error !== 'aborted') { R.lastErr = e.error; paintLive(); }
  };
  sr.onend = () => {
    R.active = false; commit();
    if (R.blocked) return;
    if (R.on) { if (document.visibilityState === 'visible') setTimeout(spawn, 250); paintLive(); }
    else if (R.stopping) finishRec();
  };
  R.sr = sr;
  try { sr.start(); } catch { setTimeout(spawn, 1000); }
}
function commit() {
  const add = R.sess.join(' ') || R.interim;
  if (add) R.final += (R.final ? '\n' : '') + add;
  R.sess = []; R.interim = '';
  const r = rec(S.cur);
  if (r) { r.text = R.final; r.sec = Math.round(R.elapsed()); r.sent = false; saveRecs(); }
}
function stopRec() {
  R.acc = R.elapsed(); R.since = 0; R.on = false; R.stopping = true; clearInterval(R.timer);
  if (R.active && R.sr) { try { R.sr.stop(); } catch {} setTimeout(() => { if (R.stopping) finishRec(); }, 2000); }
  else finishRec();
}
function finishRec() {
  if (!R.stopping) return;
  R.stopping = false; commit(); wake(false);
  S.view = 'done'; render();
}
function endBlocked() {
  R.acc = R.elapsed(); R.since = 0; R.on = false; R.stopping = false; clearInterval(R.timer);
  try { R.sr && R.sr.abort(); } catch {}
  commit(); wake(false); render();
}
function wake(on) {
  if (on) { try { navigator.wakeLock && navigator.wakeLock.request('screen').then((l) => { R.wake = l; }).catch(() => {}); } catch {} }
  else { try { R.wake && R.wake.release().catch(() => {}); } catch {} R.wake = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && R.on) { wake(true); if (!R.active) spawn(); paintLive(); }
});
function paintLive() {
  const el = $('#live'); if (!el) return;
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  const sess = R.sess.join(' ');
  const fin = R.final + (sess ? (R.final ? '\n' : '') + sess : '');
  el.innerHTML = fin || R.interim ? esc(fin) + (R.interim ? '<span class="int">' + (fin ? ' ' : '') + esc(R.interim) + '</span>' : '')
    : '<span class="ph">말소리가 들리면 여기에 글자가 나타납니다.</span>';
  if (near) el.scrollTop = el.scrollHeight;
  const st = $('#recStatus'); if (!st) return;
  if (R.lastErr === 'network') { st.className = 'status bad'; st.textContent = '네트워크가 끊겨 다시 연결하는 중'; }
  else if (R.active) { st.className = 'status'; st.innerHTML = '<i class="dot"></i>듣는 중'; }
  else { st.className = 'status'; st.textContent = document.visibilityState === 'visible' ? '다시 연결하는 중' : '화면이 꺼져 멈춤'; }
}

/* ---------- 화면 ---------- */
function rowHTML(r) {
  const n = (r.text || '').trim().length;
  return `<button class="row" data-act="open" data-v="${esc(r.id)}">
    <span class="row-m">
      <span class="row-k"><span class="num">${md(r.date)}</span><span class="label">${MODE[r.mode].code}</span><span class="meta">${esc(r.subject)}</span></span>
      <span class="row-t">${esc(r.subject)} 수업</span>
      <span class="meta"><span class="num">${hms(r.sec || 0)}</span> · <span class="num">${n.toLocaleString()}</span>자</span>
    </span>
    ${r.sent ? '<span class="meta">보냄</span>' : n ? '<span class="chip-acc">보낼 것</span>' : '<span class="meta">빈 녹음</span>'}
  </button>`;
}
function vHome() {
  const subs = S.subjects[S.mode] || [];
  if (!subs.includes(S.subject)) S.subject = subs[0] || '';
  const recent = S.recs.slice(0, 20);
  main.innerHTML = `
  <header class="page-head"><h1 class="page-title">수업 녹음</h1><span class="page-sub">${md(today())}</span></header>
  <p class="lead">받아쓴 전사문을 복사해 수업 노트(Claude)에 붙여넣으면 AI가 정리합니다.</p>
  ${SRC ? '' : `<section class="sec warnbox"><span class="chip-warn">받아쓰기 불가</span><p class="meta">이 브라우저는 음성 받아쓰기를 지원하지 않습니다. 안드로이드 크롬이나 크롬에 설치한 Sabathia에서 여세요.</p></section>`}
  <section class="sec"><div class="sec-head"><h2 class="sec-title">모드</h2></div>
    <div class="seg" role="group" aria-label="모드">${['school', 'academy'].map((m) => `<button data-act="mode" data-v="${m}" aria-pressed="${S.mode === m}">${MODE[m].name}</button>`).join('')}</div></section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">과목</h2></div>
    <div class="chips">${subs.map((s) => `<button class="chip" data-act="subj" data-v="${esc(s)}" aria-pressed="${S.subject === s}">${esc(s)}</button>`).join('')}<button class="chip ghost" data-act="adding">${S.adding ? '닫기' : '+ 과목'}</button></div>
    ${S.adding ? `<div class="addrow"><input id="addSubj" placeholder="${MODE[S.mode].name} 과목 이름" maxlength="20" enterkeyhint="done"><button class="btn" data-act="addSubj">추가</button></div><p class="meta">과목 칩을 길게 누르면 지울 수 있습니다.</p>` : ''}
  </section>
  <section class="sec">
    <button class="btn primary big" data-act="rec" ${!SRC || !S.subject ? 'disabled' : ''}>녹음 시작</button>
    <p class="meta">녹음하는 동안 화면을 켜 두세요. 화면이 꺼지거나 다른 앱으로 가면 받아쓰기가 멈추고, 돌아오면 이어집니다.</p>
  </section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">보관함</h2><span class="sec-count">${pad(S.recs.length)}</span></div>
    ${recent.length ? `<div class="rows">${recent.map(rowHTML).join('')}</div>` : '<p class="meta">녹음한 수업이 여기에 남습니다. 보낸 뒤에도 지우기 전까지 남아 있습니다.</p>'}
  </section>`;
}
function vRec() {
  const r = rec(S.cur) || {};
  const head = `<header class="page-head"><h1 class="page-title">${esc(r.subject || '녹음')}</h1><span class="page-sub">${MODE[r.mode || 'school'].code}</span></header>`;
  if (R.blocked) {
    main.innerHTML = `${head}<section class="sec warnbox"><span class="chip-warn">마이크 차단</span>
      <p class="meta">${R.blocked === 'unsupported' ? '이 브라우저는 받아쓰기를 지원하지 않습니다.' : '마이크 권한이 꺼져 있습니다. 주소창 왼쪽 자물쇠(설치한 앱은 앱 정보 → 권한)에서 마이크를 허용한 뒤 다시 누르세요.'}</p>
      <div class="btns"><button class="btn primary" data-act="open" data-v="${esc(r.id)}">전사문 보기</button><button class="btn" data-act="home">처음으로</button></div></section>`;
    return;
  }
  main.innerHTML = `${head}
  <div class="clock" id="clock">${hms(R.elapsed())}</div>
  <p class="status" id="recStatus"></p>
  <div class="live" id="live" aria-live="off"></div>
  <section class="sec"><button class="btn primary big" data-act="stop">정지</button></section>`;
  paintLive();
}
function vDone() {
  const r = rec(S.cur);
  if (!r) { S.view = 'home'; return vHome(); }
  const n = (r.text || '').trim().length;
  main.innerHTML = `
  <header class="page-head"><h1 class="page-title">${esc(r.subject)}</h1><span class="page-sub">${MODE[r.mode].code}</span></header>
  <p class="lead"><span class="num">${md(r.date)}</span> · <span class="num">${hms(r.sec || 0)}</span> · <span class="num" id="cnt">${n.toLocaleString()}</span>자${r.sent ? ' · 보냄' : ''}</p>
  <section class="sec">
    <a class="btn primary big" id="send" href="${NOTE_URL}" target="_blank" rel="noopener" data-act="send" ${n ? '' : 'aria-disabled="true"'}>복사하고 수업 노트 열기</a>
    <ol class="steps"><li>수업 노트 첫 화면의 "녹음 앱에서 받기" 칸을 누릅니다.</li><li>붙여넣기를 하면 모드·과목·날짜가 채워진 채로 전사문 화면이 열립니다.</li><li>"정리"를 누릅니다.</li></ol>
  </section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">전사문</h2></div>
    <textarea id="tx" placeholder="받아쓴 글이 없습니다.">${esc(r.text)}</textarea>
    <p class="meta">틀린 글자는 여기서 고쳐도 됩니다. 고친 내용은 바로 저장됩니다.</p>
    <div class="btns">
      <button class="btn" data-act="copy">복사만</button>
      <button class="btn" data-act="txt">.txt로 저장</button>
      ${SRC ? '<button class="btn" data-act="more">이어서 녹음</button>' : ''}
      <button class="btn" data-act="del">삭제</button>
    </div>
  </section>
  <section class="sec"><button class="btn" data-act="home">처음으로</button></section>`;
}
function render() {
  ({ home: vHome, rec: vRec, done: vDone }[S.view] || vHome)();
}
function go(view) { S.view = view; render(); scrollTo(0, 0); }

/* ---------- 복사 ---------- */
function copy(text, ok) {
  let p; try { p = navigator.clipboard.writeText(text); } catch (e) { p = Promise.reject(e); }
  return p.then(() => { if (ok) ok(); toast('복사했습니다'); return true; }, () => {
    const ta = $('#tx'); if (ta) { ta.value = text; ta.focus(); ta.select(); }
    toast('자동 복사가 막혔습니다. 선택된 글을 길게 눌러 복사하세요'); return false;
  });
}
function arm(b, fn, label) {
  if (b.dataset.armed) { fn(); return; }
  const old = b.textContent; b.dataset.armed = '1'; b.textContent = label; b.classList.add('danger');
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; b.classList.remove('danger'); } }, 4000);
}

/* ---------- 이벤트 ---------- */
const ACT = {
  mode: (v) => { S.mode = v; store.set('mode', v); S.subject = store.get('subject.' + v, ''); render(); },
  subj: (v) => { S.subject = v; store.set('subject.' + S.mode, v); render(); },
  adding: () => { S.adding = !S.adding; render(); const i = $('#addSubj'); if (i) i.focus(); },
  addSubj: () => {
    const i = $('#addSubj'), v = (i && i.value || '').trim(); if (!v) return;
    const list = S.subjects[S.mode] || [];
    if (list.includes(v)) { toast('이미 있는 과목입니다'); return; }
    S.subjects = { ...S.subjects, [S.mode]: [...list, v] }; store.set('subjects', S.subjects);
    S.subject = v; store.set('subject.' + S.mode, v); S.adding = false; render();
  },
  rec: () => {
    const r = { id: Date.now().toString(36), mode: S.mode, subject: S.subject, date: today(), sec: 0, text: '', sent: false, at: Date.now() };
    S.recs.unshift(r); saveRecs(); startRec(r);
  },
  stop: () => stopRec(),
  open: (v) => { S.cur = v; R.blocked = ''; go('done'); },
  home: () => { R.blocked = ''; go('home'); },
  more: () => { const r = rec(S.cur); if (r) startRec(r); },
  send: (v, b, e) => {
    const r = rec(S.cur);
    if (!r || !(r.text || '').trim()) { e.preventDefault(); toast('보낼 전사문이 없습니다'); return; }
    copy(payload(r), () => { r.sent = true; saveRecs(); });   // 링크는 그대로 열린다(새 창)
  },
  copy: () => { const r = rec(S.cur); if (r && (r.text || '').trim()) copy(payload(r), () => { r.sent = true; saveRecs(); }); },
  txt: () => {
    const r = rec(S.cur); if (!r) return;
    const url = URL.createObjectURL(new Blob([payload(r)], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = `수업-${r.date}-${r.subject}.txt`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  },
  del: (v, b) => arm(b, () => { S.recs = S.recs.filter((r) => r.id !== S.cur); saveRecs(); go('home'); toast('삭제했습니다'); }, '삭제 확인'),
};
document.addEventListener('click', (e) => {
  if (longPressed) { longPressed = false; e.preventDefault(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset.v, b, e);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'addSubj' && !e.isComposing) { e.preventDefault(); ACT.addSubj(); } });
// 과목 칩 길게 누르기 = 지우기
let pressT, longPressed = false;
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.chip[data-act="subj"]'); if (!b) return;
  pressT = setTimeout(() => {
    longPressed = true;
    const name = b.dataset.v;
    S.subjects = { ...S.subjects, [S.mode]: (S.subjects[S.mode] || []).filter((s) => s !== name) }; store.set('subjects', S.subjects);
    toast(name + ' 지움'); render();
  }, 650);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => document.addEventListener(t, () => clearTimeout(pressT), true));
let txT;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'tx') return;
  const r = rec(S.cur); if (!r) return;
  r.text = e.target.value; r.sent = false;
  const c = $('#cnt'); if (c) c.textContent = r.text.trim().length.toLocaleString();
  clearTimeout(txT); txT = setTimeout(saveRecs, 500);
});
// 녹음 중에 페이지를 떠나려 하면 묻는다(받아쓴 글은 이미 저장돼 있음)
addEventListener('beforeunload', (e) => { if (R.on) { e.preventDefault(); e.returnValue = ''; } });

if (window.Sabathia) Sabathia.back = () => {
  if (R.on || R.stopping) return true;            // 녹음 중에는 뒤로가기를 막는다
  if (S.view !== 'home') { go('home'); return true; }
  return false;
};

render();
saveRecs();
</script>
</body>
</html>
