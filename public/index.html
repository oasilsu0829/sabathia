<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>자비스</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --fg:#e2e8f0; --dim:#94a3b8; --acc:#38bdf8; --red:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Pretendard", sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px 32px; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 4px 0 16px; letter-spacing: -0.02em; }
  h1 span { color: var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .label { font-size:13px; color:var(--dim); margin-bottom:8px; }
  input, button { font:inherit; color:inherit; border-radius:10px; border:1px solid var(--line); background:var(--bg); padding:10px 12px; width:100%; }
  button { background:var(--acc); color:#0f172a; border:none; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; min-width:0; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:none; }
  li .t { flex:1; }
  li .when { font-size:13px; color:var(--dim); }
  li button { width:auto; background:none; color:var(--red); padding:4px 8px; }
  .status { font-size:13px; color:var(--dim); }
  .empty { color:var(--dim); font-size:14px; }

  /* 홈: 시계 + 앱 */
  .clock { text-align:center; margin:8px 0 18px; }
  .clock .time { font-size:64px; font-weight:600; letter-spacing:-0.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .clock .date { font-size:15px; color:var(--dim); margin-top:6px; font-weight:500; }
  .apps { display:grid; grid-template-columns:repeat(4,1fr); gap:18px 8px; padding:4px 2px; }
  .app { display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; color:inherit; background:none; border:none; padding:0; width:auto; font-weight:400; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .app .ic { width:60px; height:60px; border-radius:27%; display:grid; place-items:center; font-size:24px; font-weight:600; color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 6px 16px rgba(0,0,0,.18); transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
  .app:active .ic { transform:scale(.88); }
  .app .nm { font-size:12px; max-width:72px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .app.add .ic { background:rgba(127,127,127,.2); color:var(--dim); font-weight:300; font-size:30px; }
  .editing .app .ic { animation:jig .3s ease-in-out infinite alternate; }
  @keyframes jig { from { transform:rotate(-2deg); } to { transform:rotate(2deg); } }
  .sheet .row input { margin-top:0; }
  .hint { font-size:12px; color:var(--dim); margin-top:8px; }
  .wpbtn, #wp, #appSheet, #allSheet { display:none; }
  #appSheet.open, #allSheet.open { display:block; }
  #allSheet { position:fixed; inset:0; z-index:20; overflow:auto; padding:max(20px, env(safe-area-inset-top)) 16px 40px; background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(40px) saturate(180%); backdrop-filter:blur(40px) saturate(180%); color:#fff; }
  #allSheet .row { align-items:center; }
  #allList { list-style:none; padding:0; margin:0; }
  #allList li { padding:13px 4px; font-size:17px; border-top:0.5px solid rgba(255,255,255,.14); cursor:pointer; }
  #allList li span { margin-left:auto; color:var(--dim); font-size:13px; }

  /* 모바일 전용: Windows 98 */
  #taskbar { display:none; }
  @media (max-width: 720px) {
    :root { --face:#c0c0c0; --hi:#fff; --lt:#dfdfdf; --sh:#808080; --dk:#000; --navy:#000080; --fg:#000; --dim:#000; --red:#000; }
    html { background:#008080; }
    body { background:transparent; min-height:100dvh; color:#000; font:13px/1.4 Tahoma, "MS Sans Serif", "Dotum", "Gulim", system-ui, sans-serif;
      -webkit-font-smoothing:none; padding:max(10px, env(safe-area-inset-top)) 8px calc(56px + env(safe-area-inset-bottom)); }
    #wall { position:fixed; inset:0; z-index:-1; background:var(--wall, #008080); background-size:cover; background-position:center; }
    h1, .clock { display:none; }
    /* 창 */
    .card, .glass { background:var(--face); border:none; border-radius:0; padding:3px 9px 9px; margin-bottom:10px;
      box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--lt), inset -2px -2px var(--sh), inset 2px 2px var(--hi); }
    .label { display:flex; align-items:center; gap:6px; margin:0 -6px 8px; padding:3px 4px; color:#fff; font-weight:700; font-size:13px;
      background:linear-gradient(90deg, var(--navy), #1084d0); }
    .label::after { content:"\00d7"; margin-left:auto; width:16px; height:14px; line-height:12px; text-align:center; color:#000; background:var(--face); font-size:13px;
      box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--sh), inset 2px 2px var(--lt); }
    .status { color:#000; }
    /* 입력/버튼 */
    input { background:#fff; color:#000; border:none; border-radius:0; padding:6px 6px;
      box-shadow:inset -1px -1px var(--hi), inset 1px 1px var(--sh), inset -2px -2px var(--lt), inset 2px 2px var(--dk); }
    input:focus { outline:1px dotted #000; outline-offset:-4px; }
    input[type=datetime-local] { color-scheme:light; }
    button, button.ghost { background:var(--face); color:#000; border:none; border-radius:0; font-weight:400; padding:7px 10px;
      box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--sh), inset 2px 2px var(--lt); }
    button:active { box-shadow:inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--sh), inset -2px -2px var(--lt); padding:8px 9px 6px 11px; }
    /* 목록 */
    #list { background:#fff; padding:2px 6px; box-shadow:inset -1px -1px var(--hi), inset 1px 1px var(--sh), inset -2px -2px var(--lt), inset 2px 2px var(--dk); }
    li { border-top:1px dotted var(--sh); }
    li .when { color:#444; }
    li button { width:22px; height:20px; padding:0; line-height:1; }
    /* 바탕화면 아이콘 */
    .apps-card { background:none; box-shadow:none; padding:4px 0 6px; }
    .apps { gap:14px 4px; }
    .app, .app.add { background:none; box-shadow:none; padding:0; }
    .app:active { box-shadow:none; padding:0; }
    .app .ic { width:40px; height:40px; border-radius:0; font-size:18px; font-weight:700; color:#fff; box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--hi), 2px 2px 0 rgba(0,0,0,.35); transition:none; }
    .app:active .ic { transform:none; filter:brightness(.6) sepia(1) hue-rotate(190deg) saturate(4); }
    .app .nm { color:#fff; font-size:12px; padding:0 2px; }
    .app:active .nm { background:var(--navy); outline:1px dotted #fff; }
    .app.add .ic { background:var(--face); color:#000; font-size:22px; font-weight:400; }
    /* 팝업 창 */
    #wp, #appSheet { position:fixed; left:8px; right:8px; bottom:calc(52px + env(safe-area-inset-bottom)); z-index:10; }
    #wp.open { display:block; }
    .sw { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:4px 0 8px; }
    .sw button { aspect-ratio:1; padding:0; border:none; box-shadow:inset -1px -1px var(--hi), inset 1px 1px var(--sh), inset -2px -2px var(--lt), inset 2px 2px var(--dk); }
    #allSheet { background:var(--face); color:#000; -webkit-backdrop-filter:none; backdrop-filter:none; padding:max(10px, env(safe-area-inset-top)) 8px 70px; }
    #allList { background:#fff; box-shadow:inset 1px 1px var(--sh), inset 2px 2px var(--dk); }
    #allList li { font-size:15px; padding:10px 8px; border-top:1px dotted var(--sh); }
    #allList li span { color:var(--navy); }
    .hint { color:#000; }
    /* 작업 표시줄 */
    #taskbar { display:flex; align-items:center; gap:6px; position:fixed; left:0; right:0; bottom:0; z-index:30; height:calc(42px + env(safe-area-inset-bottom));
      padding:4px 4px calc(4px + env(safe-area-inset-bottom)); background:var(--face); box-shadow:inset 0 1px var(--lt), inset 0 2px var(--hi); }
    #taskbar button { width:auto; height:34px; display:flex; align-items:center; gap:6px; font-weight:700; padding:0 10px; }
    #taskbar .flag { width:16px; height:16px; background:conic-gradient(#f00 0 25%, #0a0 0 50%, #00f 0 75%, #fc0 0); transform:skewY(-8deg); }
    #tray { margin-left:auto; height:34px; display:flex; align-items:center; padding:0 12px; font-variant-numeric:tabular-nums;
      box-shadow:inset -1px -1px var(--hi), inset 1px 1px var(--sh); }
  }
</style>
</head>
<body>
<div id="wall"></div>
<h1><span>●</span>&nbsp;자비스<button class="wpbtn" id="btnWp">배경</button></h1>

<div id="taskbar"><button id="btnStart"><span class="flag"></span>시작</button><button id="btnAll2" style="font-weight:400">모든 앱</button><div id="tray"></div></div>

<div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>

<div class="card apps-card">
  <div class="apps" id="apps"></div>
</div>

<div class="card" id="setup">
  <div class="label">알림</div>
  <div class="status" id="status">확인 중…</div>
  <div class="row">
    <button id="btnSub">알림 켜기</button>
    <button class="ghost" id="btnTest">테스트</button>
  </div>
</div>

<div class="card">
  <div class="label">리마인더 추가</div>
  <input id="title" placeholder="무엇을 알려줄까요?">
  <div class="row">
    <input id="at" type="datetime-local">
    <button id="btnAdd" style="flex:0 0 72px">추가</button>
  </div>
</div>

<div class="card">
  <div class="label">예정</div>
  <ul id="list"></ul>
</div>

<div id="appSheet" class="glass sheet">
  <div class="label">앱 추가</div>
  <input id="appName" placeholder="이름 (예: 카카오톡)">
  <input id="appUrl" placeholder="주소 또는 패키지명 (예: com.kakao.talk)" style="margin-top:8px" autocapitalize="off">
  <div class="hint">패키지명은 Play 스토어 앱 주소의 id= 뒤 값입니다. 목록에 없는 앱은 'kakaotalk://' 같은 앱 주소를 직접 넣어도 됩니다. 아이콘을 길게 누르면 편집/삭제할 수 있어요.</div>
  <div class="row">
    <button class="ghost" id="btnAppCancel">닫기</button>
    <button id="btnAppSave">저장</button>
  </div>
</div>

<div id="allSheet">
  <div class="row" style="margin:0 0 12px"><input id="allQ" placeholder="앱 검색" autocomplete="off"><button class="ghost" id="btnAllClose" style="flex:0 0 72px">닫기</button></div>
  <ul id="allList"></ul>
</div>

<div id="wp" class="glass">
  <div class="label">배경화면</div>
  <div class="sw" id="sw"></div>
  <div class="row">
    <button class="ghost" id="btnPick">사진 선택</button>
    <button id="btnWpClose">닫기</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

async function call(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } });
  return res.json();
}

const b64ToBytes = (s) => {
  const p = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
  return Uint8Array.from(atob(p), (c) => c.charCodeAt(0));
};

async function refreshStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { $('status').textContent = '이 브라우저는 푸시를 지원하지 않아요.'; return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  $('status').textContent = sub ? '켜짐' : (Notification.permission === 'denied' ? '차단됨 — 브라우저 설정에서 허용해주세요' : '꺼짐');
}

$('btnSub').onclick = async () => {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return refreshStatus();
  const reg = await navigator.serviceWorker.ready;
  const { key } = await (await fetch('/api/vapid')).json();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
  await call('/api/subscribe', { method: 'POST', body: JSON.stringify(sub) });
  refreshStatus();
};

$('btnTest').onclick = async () => {
  const r = await call('/api/test', { method: 'POST' });
  $('status').textContent = `테스트 발송: ${r.sent}대`;
};

async function load() {
  const items = await call('/api/reminders');
  $('list').innerHTML = items.length ? '' : '<li class="empty">없음</li>';
  for (const r of items) {
    const li = document.createElement('li');
    const when = new Date(r.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
    li.innerHTML = `<div class="t"><div></div><div class="when">${when}</div></div><button aria-label="삭제">✕</button>`;
    li.querySelector('.t div').textContent = r.title;
    li.querySelector('button').onclick = async () => { await call('/api/reminders/' + r.id, { method: 'DELETE' }); load(); };
    $('list').appendChild(li);
  }
}

$('btnAdd').onclick = async () => {
  const title = $('title').value.trim(), at = $('at').value;
  if (!title || !at) return;
  await call('/api/reminders', { method: 'POST', body: JSON.stringify({ title, at: new Date(at).toISOString() }) });
  $('title').value = '';
  load();
};

// 기본값: 10분 뒤
const d = new Date(Date.now() + 10 * 60000 - new Date().getTimezoneOffset() * 60000);
$('at').value = d.toISOString().slice(0, 16);

// 배경화면 (모바일)
const PRESETS = [
  '#008080',
  '#000080',
  'linear-gradient(180deg,#4a8fd8,#a9cdf0 60%,#e8f2fb)',
  '#3a6ea5',
  '#000',
  '#808080',
  'repeating-conic-gradient(#008080 0 25%, #007070 0 50%) 0 0/8px 8px',
  '#5a2d82',
];
const applyWall = (v) => { if (v) document.documentElement.style.setProperty('--wall', v); };
applyWall(store.get('wall98'));
for (const p of PRESETS) {
  const b = document.createElement('button');
  b.style.background = p;
  b.setAttribute('aria-label', '배경 선택');
  b.onclick = () => { applyWall(p); store.set('wall98', p); };
  $('sw').appendChild(b);
}
$('btnWp').onclick = () => { $('appSheet').classList.remove('open'); $('wp').classList.toggle('open'); };
$('btnWpClose').onclick = () => $('wp').classList.remove('open');
$('btnPick').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  const img = await createImageBitmap(f);
  const k = Math.min(1, 1440 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const v = `url("${c.toDataURL('image/jpeg', 0.82)}")`;
  applyWall(v);
  store.set('wall98', v);
  $('file').value = '';
};

// 시계
const tick = () => {
  const n = new Date();
  $('time').textContent = n.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  $('tray').textContent = n.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  $('date').textContent = n.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
};
tick(); setInterval(tick, 10000);

// 앱 런처: 패키지명이면 안드로이드 intent로, 아니면 URL/스킴 그대로 연다
const DEFAULT_APPS = [
  { name: '전화', url: 'tel:' },
  { name: '문자', url: 'sms:' },
  { name: '카카오톡', url: 'com.kakao.talk' },
  { name: '네이버지도', url: 'com.nhn.android.nmap' },
  { name: '캘린더', url: 'https://calendar.google.com' },
  { name: '메일', url: 'https://mail.google.com' },
];
const COLORS = ['#0a84ff', '#30d158', '#ff9f0a', '#ff375f', '#bf5af2', '#64d2ff', '#5e5ce6', '#ff453a'];
const loadApps = () => { try { return JSON.parse(store.get('apps')) || DEFAULT_APPS; } catch { return DEFAULT_APPS; } };
let apps = loadApps(), editIdx = -1;
const saveApps = () => store.set('apps', JSON.stringify(apps));
const isPkg = (u) => /^[a-z][\w]*(\.[\w]+)+$/i.test(u) && !u.includes('/');
// 크롬은 '앱 실행' 인텐트를 막으므로, 앱마다 등록된 딥링크 스킴으로 연다
const SCHEMES = {
  'com.kakao.talk': 'kakaotalk', 'com.nhn.android.nmap': 'nmap', 'net.daum.android.map': 'kakaomap',
  'com.google.android.youtube': 'vnd.youtube', 'com.instagram.android': 'instagram', 'com.nhn.android.search': 'naversearchapp',
  'com.spotify.music': 'spotify', 'com.kakao.taxi': 'kakaot', 'com.coupang.mobile': 'coupang', 'com.coupang.mobile.eats': 'coupangeats',
  'viva.republica.toss': 'supertoss', 'com.kakao.bank': 'kakaobank', 'com.whatsapp': 'whatsapp', 'com.google.android.gm': 'googlegmail',
  'com.sampleapp': 'baemin', 'com.towneers.www': 'towneers', 'com.iloen.melon': 'melonapp', 'com.nhn.android.webtoon': 'naverwebtoon',
  'com.skt.tmap.ku': 'tmap', 'com.nhn.android.blog': 'naverblog', 'com.nhn.android.band': 'bandapp', 'com.twitter.android': 'twitter',
  'com.zhiliaoapp.musically': 'snssdk1233', 'com.discord': 'discord', 'com.google.android.apps.maps': 'geo',
  // 브라우저는 웹 주소를 해당 앱으로 연다
  'org.mozilla.firefox': 'https://www.google.com', 'org.mozilla.firefox_beta': 'https://www.google.com', 'com.android.chrome': 'https://www.google.com',
  'com.sec.android.app.sbrowser': 'https://www.google.com',
};
const hrefOf = (u) => {
  if (!isPkg(u)) return u;
  const store = encodeURIComponent('https://play.google.com/store/apps/details?id=' + u);
  const sc = SCHEMES[u];
  if (sc && sc.includes('://')) {
    const [scheme, rest] = sc.split('://');
    return `intent://${rest}#Intent;scheme=${scheme};action=android.intent.action.VIEW;package=${u};S.browser_fallback_url=${store};end`;
  }
  return sc
    ? `intent://${sc === 'geo' ? '0,0' : ''}#Intent;scheme=${sc};package=${u};S.browser_fallback_url=${store};end`
    : `intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${u};S.browser_fallback_url=${store};end`;
};

function renderApps() {
  const box = $('apps');
  box.innerHTML = '';
  apps.forEach((a, i) => {
    const el = document.createElement('a');
    el.className = 'app';
    el.href = hrefOf(a.url);
    if (window.Jarvis && isPkg(a.url)) el.onclick = (e) => { e.preventDefault(); if (!Jarvis.launch(a.url)) alert('설치되지 않은 앱이에요.'); };
    const hue = COLORS[[...a.name].reduce((h, c) => h + c.charCodeAt(0), 0) % COLORS.length];
    el.innerHTML = `<div class="ic" style="background:linear-gradient(160deg,${hue},${hue}cc)"></div><div class="nm"></div>`;
    el.querySelector('.ic').textContent = [...a.name][0] || '?';
    el.querySelector('.nm').textContent = a.name;
    let t;
    el.addEventListener('touchstart', () => { t = setTimeout(() => { t = 'long'; openSheet(i); }, 550); }, { passive: true });
    el.addEventListener('touchend', (e) => { if (t === 'long') e.preventDefault(); else clearTimeout(t); });
    el.addEventListener('touchmove', () => clearTimeout(t), { passive: true });
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); openSheet(i); });
    box.appendChild(el);
  });
  if (window.Jarvis) {
    const all = document.createElement('button');
    all.className = 'app add';
    all.innerHTML = '<div class="ic">⋯</div><div class="nm">모든 앱</div>';
    all.onclick = openAll;
    box.appendChild(all);
  }
  const add = document.createElement('button');
  add.className = 'app add';
  add.innerHTML = '<div class="ic">+</div><div class="nm">추가</div>';
  add.onclick = () => openSheet(-1);
  box.appendChild(add);
}
function openSheet(i) {
  editIdx = i;
  $('appName').value = i < 0 ? '' : apps[i].name;
  $('appUrl').value = i < 0 ? '' : apps[i].url;
  $('btnAppCancel').textContent = i < 0 ? '닫기' : '삭제';
  $('wp').classList.remove('open');
  $('appSheet').classList.add('open');
}
$('btnAppSave').onclick = () => {
  const name = $('appName').value.trim(), url = $('appUrl').value.trim();
  if (!name || !url) return;
  if (editIdx < 0) apps.push({ name, url }); else apps[editIdx] = { name, url };
  saveApps(); renderApps(); $('appSheet').classList.remove('open');
};
$('btnAppCancel').onclick = () => {
  if (editIdx >= 0 && confirm(`'${apps[editIdx].name}'을(를) 삭제할까요?`)) { apps.splice(editIdx, 1); saveApps(); renderApps(); }
  $('appSheet').classList.remove('open');
};
renderApps();

// 런처(안드로이드 앱) 안에서만: 모든 앱 목록
let allApps = [];
function openAll() {
  try { allApps = JSON.parse(Jarvis.apps()).sort((a, b) => a.name.localeCompare(b.name, 'ko')); } catch { allApps = []; }
  $('allQ').value = '';
  renderAll();
  $('allSheet').classList.add('open');
}
function renderAll() {
  const q = $('allQ').value.trim().toLowerCase();
  $('allList').innerHTML = '';
  for (const a of allApps.filter((a) => !q || a.name.toLowerCase().includes(q))) {
    const li = document.createElement('li');
    li.textContent = a.name;
    const pin = document.createElement('span');
    pin.textContent = '홈에 추가';
    li.appendChild(pin);
    li.onclick = (e) => {
      if (e.target === pin) { apps.push({ name: a.name, url: a.pkg }); saveApps(); renderApps(); pin.textContent = '추가됨'; return; }
      Jarvis.launch(a.pkg);
    };
    $('allList').appendChild(li);
  }
}
$('allQ').oninput = renderAll;
$('btnAllClose').onclick = () => $('allSheet').classList.remove('open');
$('btnStart').onclick = () => $('btnWp').onclick();
$('btnAll2').onclick = () => (window.Jarvis ? openAll() : openSheet(-1));
if (!window.Jarvis) $('btnAll2').textContent = '앱 추가';
const closeSheets = () => ['allSheet', 'appSheet', 'wp'].forEach((id) => $(id).classList.remove('open'));
window.onJarvisBack = closeSheets;
window.onJarvisHome = () => { closeSheets(); scrollTo({ top: 0, behavior: 'smooth' }); };
window.onJarvisResume = () => { tick(); load().catch(() => {}); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').then(refreshStatus);
load();
</script>
</body>
</html>
