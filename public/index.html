<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>자비스</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --fg:#e2e8f0; --dim:#94a3b8; --acc:#38bdf8; --red:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Pretendard", sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px 32px; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 4px 0 16px; letter-spacing: -0.02em; }
  h1 span { color: var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .label { font-size:13px; color:var(--dim); margin-bottom:8px; }
  input, button { font:inherit; color:inherit; border-radius:10px; border:1px solid var(--line); background:var(--bg); padding:10px 12px; width:100%; }
  button { background:var(--acc); color:#0f172a; border:none; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; min-width:0; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:none; }
  li .t { flex:1; }
  li .when { font-size:13px; color:var(--dim); }
  li button { width:auto; background:none; color:var(--red); padding:4px 8px; }
  .status { font-size:13px; color:var(--dim); }
  .empty { color:var(--dim); font-size:14px; }

  /* 모바일 전용: 리퀴드 글라스 */
  .wpbtn, #wp { display:none; }
  @media (max-width: 720px) {
    :root { --glass: rgba(255,255,255,.14); --glass-hi: rgba(255,255,255,.38); --glass-line: rgba(255,255,255,.22); --fg:#fff; --dim:rgba(255,255,255,.72); }
    html { background:#111; }
    body { background:transparent; min-height:100dvh; }
    #wall { position:fixed; inset:0; z-index:-1; background:var(--wall, linear-gradient(160deg,#4f46e5,#0ea5e9 55%,#22d3ee)); background-size:cover; background-position:center; }
    #wall::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.28)); }
    h1 { display:flex; align-items:center; font-size:28px; font-weight:700; margin:8px 4px 18px; text-shadow:0 1px 8px rgba(0,0,0,.25); }
    h1 span { color:#fff; }
    .wpbtn { display:block; margin-left:auto; width:auto; font-size:14px; font-weight:600; padding:8px 14px; border-radius:999px; }
    .card, .glass { position:relative; background:var(--glass); border:1px solid var(--glass-line); border-radius:24px; padding:16px;
      -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
      box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.18); }
    .label { color:var(--dim); font-weight:600; }
    input { background:rgba(255,255,255,.12); border:1px solid var(--glass-line); border-radius:14px; color:#fff; }
    input::placeholder { color:rgba(255,255,255,.6); }
    input[type=datetime-local] { color-scheme:dark; }
    button { border-radius:14px; background:rgba(255,255,255,.88); color:#111; box-shadow:inset 0 1px 0 #fff, 0 4px 14px rgba(0,0,0,.15); }
    button.ghost, .wpbtn { background:rgba(255,255,255,.16); color:#fff; border:1px solid var(--glass-line);
      -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%); box-shadow:inset 0 1px 0 var(--glass-hi); }
    li { border-top-color:rgba(255,255,255,.14); }
    li button { background:none; box-shadow:none; color:#fecaca; }
    #wp { position:fixed; left:12px; right:12px; bottom:max(12px, env(safe-area-inset-bottom)); z-index:10; }
    #wp.open { display:block; }
    .sw { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:6px 0 12px; }
    .sw button { aspect-ratio:1; padding:0; border-radius:16px; border:2px solid rgba(255,255,255,.5); }
  }
  @media (max-width: 720px) and (prefers-color-scheme: light) { #wall::after { background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.2)); } }
</style>
</head>
<body>
<div id="wall"></div>
<h1><span>●</span>&nbsp;자비스<button class="wpbtn" id="btnWp">배경</button></h1>

<div class="card" id="setup">
  <div class="label">알림</div>
  <div class="status" id="status">확인 중…</div>
  <div class="row">
    <button id="btnSub">알림 켜기</button>
    <button class="ghost" id="btnTest">테스트</button>
  </div>
</div>

<div class="card">
  <div class="label">리마인더 추가</div>
  <input id="title" placeholder="무엇을 알려줄까요?">
  <div class="row">
    <input id="at" type="datetime-local">
    <button id="btnAdd" style="flex:0 0 72px">추가</button>
  </div>
</div>

<div class="card">
  <div class="label">예정</div>
  <ul id="list"></ul>
</div>

<div id="wp" class="glass">
  <div class="label">배경화면</div>
  <div class="sw" id="sw"></div>
  <div class="row">
    <button class="ghost" id="btnPick">사진 선택</button>
    <button id="btnWpClose">닫기</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function token() {
  let t = store.get('token');
  if (!t) { t = prompt('앱 토큰을 입력하세요'); if (t) store.set('token', t.trim()); }
  return t;
}

async function call(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token(), ...opts.headers } });
  if (res.status === 401) { store.set('token', ''); try { localStorage.removeItem('token'); } catch {} alert('토큰이 틀렸어요. 다시 입력해주세요.'); throw new Error('401'); }
  return res.json();
}

const b64ToBytes = (s) => {
  const p = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
  return Uint8Array.from(atob(p), (c) => c.charCodeAt(0));
};

async function refreshStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { $('status').textContent = '이 브라우저는 푸시를 지원하지 않아요.'; return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  $('status').textContent = sub ? '켜짐' : (Notification.permission === 'denied' ? '차단됨 — 브라우저 설정에서 허용해주세요' : '꺼짐');
}

$('btnSub').onclick = async () => {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return refreshStatus();
  const reg = await navigator.serviceWorker.ready;
  const { key } = await (await fetch('/api/vapid')).json();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
  await call('/api/subscribe', { method: 'POST', body: JSON.stringify(sub) });
  refreshStatus();
};

$('btnTest').onclick = async () => {
  const r = await call('/api/test', { method: 'POST' });
  $('status').textContent = `테스트 발송: ${r.sent}대`;
};

async function load() {
  const items = await call('/api/reminders');
  $('list').innerHTML = items.length ? '' : '<li class="empty">없음</li>';
  for (const r of items) {
    const li = document.createElement('li');
    const when = new Date(r.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
    li.innerHTML = `<div class="t"><div></div><div class="when">${when}</div></div><button aria-label="삭제">✕</button>`;
    li.querySelector('.t div').textContent = r.title;
    li.querySelector('button').onclick = async () => { await call('/api/reminders/' + r.id, { method: 'DELETE' }); load(); };
    $('list').appendChild(li);
  }
}

$('btnAdd').onclick = async () => {
  const title = $('title').value.trim(), at = $('at').value;
  if (!title || !at) return;
  await call('/api/reminders', { method: 'POST', body: JSON.stringify({ title, at: new Date(at).toISOString() }) });
  $('title').value = '';
  load();
};

// 기본값: 10분 뒤
const d = new Date(Date.now() + 10 * 60000 - new Date().getTimezoneOffset() * 60000);
$('at').value = d.toISOString().slice(0, 16);

// 배경화면 (모바일)
const PRESETS = [
  'linear-gradient(160deg,#4f46e5,#0ea5e9 55%,#22d3ee)',
  'linear-gradient(160deg,#f97316,#ec4899 50%,#8b5cf6)',
  'linear-gradient(160deg,#064e3b,#10b981 60%,#a7f3d0)',
  'linear-gradient(160deg,#0f172a,#334155 60%,#64748b)',
  'radial-gradient(circle at 30% 20%,#fde68a,#f472b6 45%,#1e1b4b)',
  'linear-gradient(200deg,#111,#3f3f46)',
  'linear-gradient(160deg,#1e3a8a,#7c3aed 50%,#db2777)',
  'linear-gradient(160deg,#fafafa,#d4d4d8)',
];
const applyWall = (v) => { if (v) document.documentElement.style.setProperty('--wall', v); };
applyWall(store.get('wall'));
for (const p of PRESETS) {
  const b = document.createElement('button');
  b.style.background = p;
  b.setAttribute('aria-label', '배경 선택');
  b.onclick = () => { applyWall(p); store.set('wall', p); };
  $('sw').appendChild(b);
}
$('btnWp').onclick = () => $('wp').classList.toggle('open');
$('btnWpClose').onclick = () => $('wp').classList.remove('open');
$('btnPick').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  const img = await createImageBitmap(f);
  const k = Math.min(1, 1440 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const v = `url("${c.toDataURL('image/jpeg', 0.82)}")`;
  applyWall(v);
  store.set('wall', v);
  $('file').value = '';
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').then(refreshStatus);
load();
</script>
</body>
</html>
