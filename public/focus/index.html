<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Focus</title>
<meta name="description" content="CRT 브라운관 속 열대 해변 집중 타이머. 실제 시각과 오늘 날씨에 따라 하늘이 바뀐다">
<meta name="theme-color" content="#04070b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one curved CRT tube fills the window. The beach runs through the same WebGL tube as Skylance 2099;
   the clock and the few controls float above it in a plain face with a phosphor glow and a faint glitch. */
:root{
  --void:#04070b;
  --ink:#f2fcff;
  --soft:rgba(236,250,255,.62);
  --glow:rgba(150,228,255,.85);
  --glow2:rgba(40,170,255,.42);
  --shade:rgba(0,28,64,.32);
  --lime:#c6ff7a;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--void);color:var(--ink);font-family:var(--sans);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
#stage{height:100%;box-sizing:border-box;padding-block:12px;display:flex;min-width:0}
#tube{position:relative;flex:1;min-width:0}
#cv{display:block;width:100%;height:100%;touch-action:manipulation}
#ov{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto auto 1fr auto;justify-items:center;
  padding:clamp(28px,7vh,72px) clamp(24px,6vw,80px);box-sizing:border-box;pointer-events:none}
#ov button{pointer-events:auto;font:inherit;color:inherit;background:none;border:0;padding:10px 6px;cursor:pointer;touch-action:manipulation}
#ov button:focus-visible{outline:1px solid var(--glow);outline-offset:2px;border-radius:2px}
.glow{text-shadow:0 0 1px rgba(255,255,255,.9),0 0 9px var(--glow),0 0 26px var(--glow2),0 1px 14px var(--shade)}
#ov #time{grid-row:2;position:relative;font-weight:200;font-size:clamp(52px,min(13vw,19vh),148px);line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;padding:0 8px!important;transition:color .6s,opacity .4s}
#time::before,#time::after{content:attr(data-t);position:absolute;inset:0;padding:inherit;opacity:0;pointer-events:none}
#time::before{color:rgba(255,70,110,.55);clip-path:inset(var(--a,20%) 0 var(--b,60%) 0);transform:translateX(var(--x,3px))}
#time::after{color:rgba(80,230,255,.6);clip-path:inset(var(--c,55%) 0 var(--d,25%) 0);transform:translateX(calc(var(--x,3px) * -1))}
#time.gl{transform:translateX(var(--j,1px)) skewX(var(--k,0deg))}
#time.gl::before,#time.gl::after{opacity:1}
#time.done{color:#f4ffe6;--glow:rgba(198,255,122,.9);--glow2:rgba(110,220,40,.45)}
#time.paused{animation:breathe 2.4s ease-in-out infinite}
#ov #tin{grid-row:2;grid-column:1;pointer-events:auto;font:200 clamp(52px,min(13vw,19vh),148px)/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  width:5.4ch;padding:0 8px;text-align:center;color:var(--ink);caret-color:var(--lime);background:none;border:0;border-bottom:1px solid rgba(220,246,255,.45);outline:none;border-radius:0}
#tin::placeholder{color:rgba(236,250,255,.35)}
#ov>*{grid-column:1}
#ov #time.editing{visibility:hidden}
#hint{grid-row:3;margin-top:14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
#ov.ed #bar{visibility:hidden}
#ov #tin,#hint{visibility:hidden}
#ov.ed #tin,#ov.ed #hint{visibility:visible}
#bar{grid-row:3}
@keyframes breathe{50%{opacity:.45}}
#bar{grid-row:3;width:min(240px,48vw);height:1px;margin-top:14px;background:rgba(220,246,255,.22);box-shadow:0 0 8px var(--shade);position:relative}
#bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);box-shadow:0 0 6px var(--glow),0 0 14px var(--glow2)}
#ctl{grid-row:4;align-self:start;display:flex;gap:clamp(20px,4vw,40px);margin-top:clamp(18px,4vh,34px)}
#ctl button,#pre button{font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);transition:color .25s,opacity .25s}
#ctl button:hover,#pre button:hover,#ctl button:focus-visible,#pre button:focus-visible{color:var(--ink)}
#go{color:var(--ink)!important}
#snd{position:absolute;top:clamp(18px,4vh,40px);right:clamp(22px,5vw,56px);font-size:10px!important;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);opacity:.7;transition:opacity .25s}
#snd:hover,#snd:focus-visible{opacity:1}
#tl{position:absolute;top:clamp(18px,4vh,40px);left:clamp(22px,5vw,56px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:auto}
.sab{font-size:10px;font-weight:500;letter-spacing:.24em;color:var(--soft);text-decoration:none;opacity:.7}
.sab span{margin-left:.8em;opacity:.75}
.sab:hover,.sab:focus-visible{opacity:1}
#ov #wx{padding:4px 0;font-size:12px;letter-spacing:.03em;font-weight:300;color:var(--ink);text-align:left}
#vol{position:absolute;top:calc(clamp(18px,4vh,40px) + 34px);right:clamp(22px,5vw,56px);pointer-events:auto;display:grid;gap:12px;padding:14px 16px;min-width:190px;
  background:rgba(4,22,44,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(220,246,255,.22);border-radius:6px}
#vol[hidden]{display:none}
#vol label{display:grid;gap:4px;font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
#vol input{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer}
#vol input::-webkit-slider-runnable-track{height:1px;background:rgba(220,246,255,.5)}
#vol input::-moz-range-track{height:1px;background:rgba(220,246,255,.5)}
#vol input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--glow)}
#vol input::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--glow)}
#vol input:focus-visible{outline:1px solid var(--glow);outline-offset:2px}
#ov #vTest{justify-self:start;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);padding:4px 0}
#ov.clk #bar{opacity:0}
#tl .glow,#snd{text-shadow:0 0 1px rgba(255,255,255,.8),0 0 8px var(--glow),0 1px 3px rgba(0,22,50,.85),0 0 10px rgba(0,22,50,.55)}
#pre{grid-row:5;display:flex;gap:clamp(14px,3vw,28px);transition:opacity .5s}
#pre button{font-size:11px;letter-spacing:.18em;font-weight:300}
#pre button[aria-pressed="true"]{color:var(--ink);font-weight:500}
#pre.hide{opacity:0;pointer-events:none}
#tin.bad{border-bottom-color:rgba(255,120,140,.8)}
#pre button.glow{color:rgba(255,255,255,.82);text-shadow:0 0 1px rgba(255,255,255,.9),0 0 8px var(--glow),0 1px 7px rgba(0,30,60,.6)}
#pre button[aria-pressed="true"]{color:#fff}
#pre.hide button{pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion: reduce){#time.paused{animation:none;opacity:.6}}
</style>
</head>
<body>

<div id="stage"><div id="tube">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="ov">
    <div id="tl"><a class="sab glow" href="/" aria-label="Sabathia 홈으로">SABATHIA<span>FOC-07</span></a><button id="wx" class="glow" aria-label="오늘 날씨. 눌러서 새로 고침">날씨 불러오는 중</button></div>
    <button id="snd" class="glow" aria-expanded="false" aria-controls="vol">Sound</button>
    <div id="vol" hidden>
      <label class="glow">Waves<input id="vAmb" type="range" min="0" max="100" step="1"></label>
      <label class="glow">Alarm<input id="vAlm" type="range" min="0" max="100" step="1"></label>
      <button id="vTest" class="glow">Test alarm</button>
    </div>
    <button id="time" class="glow" data-t="25:00" aria-label="남은 시간. 눌러서 시간 직접 입력, 진행 중에는 일시정지">25:00</button>
    <input id="tin" class="glow" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="6" placeholder="min" aria-label="분 단위로 입력. 12:30처럼 초까지 쓸 수 있음">
    <div id="bar" aria-hidden="true"><i></i></div>
    <div id="hint" class="glow">Minutes · Enter</div>
    <div id="ctl"><button id="go" class="glow">Start</button><button id="rs" class="glow">Reset</button></div>
    <div id="pre" role="group" aria-label="시간 프리셋">
      <button class="glow" data-m="15" aria-pressed="false">15</button><button class="glow" data-m="25" aria-pressed="false">25</button><button class="glow" data-m="45" aria-pressed="false">45</button><button class="glow" data-m="60" aria-pressed="false">60</button><button class="glow" id="cus" aria-pressed="false">Custom</button>
    </div>
  </div>
</div></div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="/sabathia.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage');let out=cv.getContext('2d');
const LO=document.createElement('canvas');let ctx=LO.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const cnv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b,c){let n=(Math.imul(a|0,73856093)^Math.imul(b|0,19349663)^Math.imul(c|0,83492791))>>>0;n=Math.imul(n^n>>>13,1274126177)>>>0;return((n^n>>>16)>>>0)/4294967296}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const E={out:t=>1-Math.pow(1-t,3),inq:t=>t*t,back:t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const HX={};function rgb(h){if(h[0]==='r')return h.slice(h.indexOf('(')+1,-1).split(',').map(Number);let c=HX[h];if(!c){const n=parseInt(h.slice(1),16);c=HX[h]=[n>>16&255,n>>8&255,n&255]}return c}
function mix(a,b,m){const A=rgb(a),B=rgb(b);return 'rgb('+(A[0]+(B[0]-A[0])*m|0)+','+(A[1]+(B[1]-A[1])*m|0)+','+(A[2]+(B[2]-A[2])*m|0)+')'}

/* ================= PALETTE: tropical noon and the golden hour it drifts toward ================= */
const PAL={
  day:{sky:['#0a4cc2','#1262d8','#1c7ce8','#2c97f2','#48b2f8','#71cbfb','#a6e2fe','#d8f6ff'],
       sea:['#0a5aa8','#0a6cb8','#0b80c6','#0e96d0','#16aed6','#27c6d8','#4cdcd6','#86eedc'],
       sand:['#fbe9b6','#f2d898','#e9c680','#ddb46e'],speck:'#cfa262',haze:'#e6faff',
       isl:['#5fa9bd','#1c7658','#2e9a68','#f4e6b4','#0f5a44']},
  gold:{sky:['#24409c','#3552b2','#5d66c2','#8c74c2','#c482b2','#ec9a96','#ffbb88','#ffdcaa'],
       sea:['#1d4a92','#22599f','#2a6caa','#3880b0','#4f96b2','#6caeb2','#93c6b0','#bcdab2'],
       sand:['#f8d9a6','#eec48c','#e1ae78','#d29a68'],speck:'#b98454',haze:'#ffe4c0',
       isl:['#7c78a8','#30506a','#46677e','#ecc79a','#22384c']}
};
const UI={ink:'#ffffff',dim:'#cfeeff',aqua:'#7fe9ff',lime:'#b6ff5c',amber:'#ffd36b',line:'#06315a'};

/* ================= AUDIO (Web Audio only, starts on first touch) ================= */
const AU={ac:null,
  init(){if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return}try{this.ac=new(window.AudioContext||window.webkitAudioContext)();const a=this.ac;this.amb=a.createGain();this.amb.gain.value=VOL.amb;this.amb.connect(a.destination);
    const cp=a.createDynamicsCompressor();cp.threshold.value=-12;cp.ratio.value=8;cp.connect(a.destination);this.alm=a.createGain();this.alm.gain.value=VOL.alarm;this.alm.connect(cp)}catch(e){this.ac=null}},
  ok(){return this.ac&&VOL.amb>0},
  tone(f,type,d,delay,v,f2,force,bus){if(!(force?this.ac:this.ok()))return;const a=this.ac,t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.6);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bus||this.amb);o.start(t);o.stop(t+d+.05);if(bus&&bus===this.alm)this.alarmNodes.push(o)},
  blip(up){this.tone(up?950:760,'sine',.09,0,.08,up?1450:520)},
  hiss(v){if(!this.ok())return;const a=this.ac,n=a.sampleRate*.18|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=3200;f.Q.value=.6;g.gain.value=v||.05;s.connect(f);f.connect(g);g.connect(this.amb);s.start()},
  alarmNodes:[],
  chime(test){if(!this.ac||(!T.chime&&!test))return;const t=this.ac.currentTime;this.alm.gain.cancelScheduledValues(t);this.alm.gain.setValueAtTime(VOL.alarm,t);
    const N=[[523.25,0],[659.25,.13],[783.99,.26],[1046.5,.39],[1318.51,.52]],reps=test?1:3;
    for(let r=0;r<reps;r++){const o=r*2.4;N.forEach(([f,d])=>{this.tone(f,'sine',1.7,o+d,.45,null,true,this.alm);this.tone(f*2,'triangle',.9,o+d,.1,null,true,this.alm)});this.tone(2093,'sine',2.4,o+.72,.22,null,true,this.alm)}
    if(!test)try{navigator.vibrate&&navigator.vibrate([400,150,400,150,700])}catch(e){}
    setTimeout(()=>{this.alarmNodes=[]},reps*2400+2600)},
  stopAlarm(){if(!this.ac||!this.alarmNodes.length)return;const t=this.ac.currentTime;for(const o of this.alarmNodes){try{o.stop(t+.06)}catch(e){}}this.alarmNodes=[];try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}},
  setVol(){if(!this.ac)return;const t=this.ac.currentTime;this.amb.gain.setTargetAtTime(VOL.amb,t,.05);this.alm.gain.setTargetAtTime(VOL.alarm,t,.05)},
  thunder(k){if(!this.ok())return;this.noise(3.4,.4*k,'lowpass',420,55,.7);this.noise(1.4,.2*k,'lowpass',1100,140,.5)},
  noise(d,v,type,f0,f1,q){if(!this.ok())return;const a=this.ac,t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=this.nb();s.loop=true;f.type=type;f.Q.value=q||.7;
    f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.04,d*.3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.amb);s.start(t,Math.random()*2);s.stop(t+d+.05)},
  _nb:null,nb(){if(this._nb)return this._nb;const a=this.ac,n=a.sampleRate*4,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return this._nb=b},
  _br:null,br(){if(this._br)return this._br;const a=this.ac,n=a.sampleRate*6,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
    const F=a.sampleRate*.5|0;for(let i=0;i<F;i++){const k=i/F;d[n-F+i]=d[n-F+i]*(1-k)+d[i]*k}return this._br=b},
  sea:null,
  seaStart(){if(!this.ac||this.sea)return;try{const a=this.ac,m=a.createGain();m.gain.value=0;m.connect(this.amb);
    const mk=(buf,type,f,q,v,off)=>{const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;s.loop=true;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(m);s.start(0,off);return{fl,g}};
    this.sea={m,wave:mk(this.br(),'lowpass',500,.4,.1,0),foam:mk(this.nb(),'highpass',1800,.5,.01,1.3),wind:mk(this.br(),'lowpass',260,.3,.05,3.1),rain:mk(this.nb(),'highpass',2400,.4,0,2.2),patter:mk(this.nb(),'bandpass',5200,1.2,0,.7)};this.seaVol()}catch(e){this.sea=null}},
  seaVol(){if(!this.sea)return;const t=this.ac.currentTime;this.sea.m.gain.cancelScheduledValues(t);this.sea.m.gain.setTargetAtTime(.85,t,.8)},
  seaTick(t){if(!this.sea||RM)return;const cyc=t*TAU/6.8-W*.5*.004,w=Math.sin(cyc)*.5+.5,dw=Math.cos(cyc),at=this.ac.currentTime,S=this.sea;
    S.wave.g.gain.setTargetAtTime(.05+.32*w*w,at,.15);S.wave.fl.frequency.setTargetAtTime(320+1500*w*w,at,.2);S.foam.g.gain.setTargetAtTime(dw<0?.012+.05*w:.008,at,.25);S.rain.g.gain.setTargetAtTime(WS.rain*.16,at,.6);S.patter.g.gain.setTargetAtTime(WS.rain*.05,at,.6);S.wind.g.gain.setTargetAtTime(.04+clamp(WS.wind/40,0,1)*.12,at,1)},
  plop(){this.tone(620,'sine',.16,0,.12,180);this.noise(.25,.05,'bandpass',2200,900,.8)},
  swish(){this.noise(.22,.03,'bandpass',1400,700,.6)},
  scratch(){this.noise(.08,.035,'highpass',3000,null,.5)},
  rustle(){this.noise(.45,.07,'highpass',2600,4200,.4);this.noise(.3,.03,'bandpass',900,600,.5)},
  thud(v){this.tone(110,'sine',.22,0,.22*v,55);this.noise(.08,.06*v,'lowpass',600,null,.5)},
  ding(){this.tone(1568,'sine',.9,0,.07);this.tone(2349,'sine',1.2,.06,.05);this.tone(3136,'sine',1.4,.12,.03)},
  squawk(){this.tone(1500,'triangle',.11,0,.07,950);this.tone(1350,'triangle',.16,.15,.06,820)},
  boom(){this.tone(80,'sine',.6,0,.1,38);this.noise(.6,.05,'lowpass',1500,180,.5);this.noise(.9,.02,'highpass',4000,null,.4)},
  honk(){this.tone(700,'square',.12,0,.022,540);this.tone(800,'square',.15,.15,.022,600)},
  hi(){this.tone(880,'sine',.12,0,.06,1100);this.tone(1175,'sine',.16,.12,.05)},
  bray(){[[470,.16,0],[560,.14,.19],[430,.32,.36]].forEach(n=>this.tone(n[0],'square',n[1],n[2],.025,n[0]*.78))},
  whoosh(k){this.noise(.6,.03+.06*k,'bandpass',500,1800,.7)}
};

/* ================= TIMER STATE (wall clock based, survives reloads) ================= */
const PRE=[15,25,45,60],MAXM=180;
const T={total:25*60000,remain:25*60000,endAt:0,run:false,done:false,chime:true,snd:true,doneAt:0};
{const s=store.get('aerofocus.v1',null);
 if(s&&typeof s.total==='number'){T.total=clamp(s.total,10000,MAXM*60000);T.remain=clamp(typeof s.remain==='number'?s.remain:T.total,0,T.total);T.endAt=+s.endAt||0;T.run=!!s.run;T.done=!!s.done;T.chime=s.chime!==false;T.snd=s.snd!==false;T.doneAt=+s.doneAt||0;
  if(T.run&&T.endAt-Date.now()<=0){T.run=false;T.done=true;T.remain=0;T.doneAt=T.endAt}}}
let VOL=store.get('aerofocus.vol',null);if(!VOL||typeof VOL.amb!=='number')VOL={amb:.7,alarm:.9};
const rep=()=>{try{window.Sabathia&&Sabathia.report('focus',{n:DAY.n,run:T.run,endAt:T.endAt,total:T.total,remain:remainNow()})}catch(e){}};
const save=()=>{rep();store.set('aerofocus.v1',{total:T.total,remain:T.remain,endAt:T.endAt,run:T.run,done:T.done,chime:T.chime,snd:T.snd,doneAt:T.doneAt})};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

const FX={sweep:-1e9,gl:0,bub:[],pops:[],boot:null,doneT:-1e9};
let wl=null;

const live=$('live');const say=m=>{live.textContent=m};
const hm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function start(){if(T.done||T.remain<=0){T.remain=T.total;T.done=false}T.endAt=Date.now()+T.remain;T.run=true;FX.sweep=performance.now();AU.blip(1);wake();save();say('집중 시작, '+hm(T.endAt)+'에 끝납니다')}

function reset(){T.run=false;T.done=false;T.remain=T.total;FX.bub.length=0;AU.blip(0);unwake();glitch(.45);save();say('리셋')}
function setPreset(m){T.run=false;T.done=false;T.total=T.remain=m*60000;FX.bub.length=0;unwake();glitch(1);AU.hiss(.05);AU.blip(1);save();say(m+'분으로 설정')}
function stepM(d){const D=d*60000;
  if(T.run){const r=clamp(T.endAt-Date.now()+D,60000,MAXM*60000);T.endAt=Date.now()+r;T.total=clamp(T.total+D,r,MAXM*60000)}
  else if(T.done||T.remain===T.total){const m=clamp(Math.round(T.total/60000)+d,1,MAXM);T.total=T.remain=m*60000;T.done=false;FX.bub.length=0}
  else{T.remain=clamp(T.remain+D,60000,MAXM*60000);T.total=clamp(T.total+D,T.remain,MAXM*60000)}
  glitch(.35);AU.blip(d>0);save();say(Math.ceil((T.run?T.endAt-Date.now():T.remain)/60000)+'분 남음')}
function complete(){T.run=false;T.done=true;T.remain=0;T.doneAt=Date.now();FX.doneT=performance.now();FX.sweep=FX.doneT;unwake();
  DAY=store.get('aerofocus.day',DAY);if(!DAY||DAY.d!==today())DAY={d:today(),n:0};DAY.n++;store.set('aerofocus.day',DAY);
  spawnBubbles();AU.chime();save();say('집중 시간이 끝났습니다')}
function toggle(){T.run?pause():start()}
function toggleFull(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}catch(e){}}
function act(id){AU.init();AU.stopAlarm();
  if(id==='start'||id==='digits')toggle();else if(id==='reset')reset();else if(id==='minus')stepM(-5);else if(id==='plus')stepM(5);
  else if(id==='snd'){if(VOL.amb>0){VOL.prev=VOL.amb;VOL.amb=0}else VOL.amb=VOL.prev||.7;store.set('aerofocus.vol',VOL);AU.seaStart();AU.setVol();syncVol();say(VOL.amb?'소리 켬':'소리 끔')}
  else if(id==='chime'){T.chime=!T.chime;save();AU.blip(1);say(T.chime?'알림음 켬':'알림음 끔')}
  else if(id==='full'){AU.blip(1);toggleFull()}
  else if(id[0]==='p')setPreset(+id.slice(1));
  syncUI();if(id[0]==='p')textGlitch(true)}
function remainNow(){return T.run?Math.max(0,T.endAt-Date.now()):T.remain}
function tickTimer(){if(T.run&&T.endAt-Date.now()<=0)complete()}

const activePreset=()=>PRE.includes(T.total/60000)?T.total/60000:0;

/* ================= GEOMETRY ================= */
let W=480,H=270,K=1;const G={};let CO=new Int16Array(1);
function geo(){
  const port=H>W*1.1;G.port=port;G.s=Math.min(W,H*1.6)/480;
  G.hz=Math.round(H*(port?.6:.585));G.shore=Math.round(H*(port?.8:.8));G.amp=Math.max(3,Math.round(H*.028));
  G.sun=[W*(port?.78:.8),H*(port?.13:.17)];G.sunG=[W*(port?.82:.87),G.hz-H*.075];G.sunR=Math.max(5,Math.round(Math.min(W,H)*.042));
  CO=new Int16Array(W);for(let x=0;x<W;x++)CO[x]=Math.round(G.shore+Math.sin(x*.018*480/W*G.s+1.3)*H*.012+Math.sin(x*.047+.4)*H*.005);
}

/* ================= BACKDROP CACHE: dithered sky, sea, sand ================= */
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
let BG={},ISL={};
function buildBG(p){const c=cnv(W,H),g=c.getContext('2d'),id=g.createImageData(W,H),d=id.data;
  const S=p.sky.map(rgb),SE=p.sea.map(rgb),SA=p.sand.map(rgb);
  const put=(i,col)=>{d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const b=(B4[(y&3)*4+(x&3)]+.5)/16,i=(y*W+x)*4;let C,f;
    if(y<G.hz){C=S;f=y/Math.max(1,G.hz-1)}
    else if(y<CO[x]){C=SE;f=Math.pow((y-G.hz)/Math.max(1,G.shore-G.hz),.85)}
    else{C=SA;f=(y-CO[x])/Math.max(1,H-G.shore)}
    const n=C.length-1;f=clamp(f,0,1)*n;const k=Math.min(n-1,Math.floor(f));put(i,C[f-k>b?k+1:k])}
  g.putImageData(id,0,0);
  g.fillStyle=p.haze;g.fillRect(0,G.hz,W,1);g.globalAlpha=.45;g.fillRect(0,G.hz-1,W,1);g.globalAlpha=1;
  const R=mulberry(7);g.fillStyle=p.speck;for(let i=0;i<W*H*.004;i++){const x=R()*W|0,y=G.shore+R()*(H-G.shore)|0;if(y>CO[x]+G.amp*2)g.fillRect(x,y,1,1)}
  return c}
function buildIsland(p){const c=cnv(W,G.hz+1),g=c.getContext('2d'),hz=G.hz;
  const isle=(a,b,pk,cone,seed)=>{const R=mulberry(seed);const hs=[];
    for(let x=Math.floor(a);x<b;x++){const u=(x-a)/(b-a),bump=Math.pow(Math.sin(PI*u),.8),v=Math.exp(-Math.pow((u-cone)/.15,2));hs.push([x,Math.round(pk*bump*(.5+.5*v)+Math.sin(x*.4+seed)*.6)])}
    g.fillStyle=p.isl[0];for(const [x,h] of hs)if(h>0)g.fillRect(x+Math.round(pk*.6),hz-Math.round(h*.7),1,Math.round(h*.7));
    g.fillStyle=p.isl[1];for(const [x,h] of hs)if(h>0)g.fillRect(x,hz-h,1,h);
    g.fillStyle=p.isl[2];for(let i=1;i<hs.length;i++){const [x,h]=hs[i];if(h>hs[i-1][1]&&h>1)g.fillRect(x,hz-h,1,2)}
    g.fillStyle=p.isl[4];for(let i=0;i<hs.length;i+=1){const [x,h]=hs[i];if(h>3&&R()<.25)g.fillRect(x,hz-h+2+(R()*h*.6|0),1,1)}
    g.fillStyle=p.isl[3];g.fillRect(Math.floor(a)+2,hz-1,Math.max(1,Math.round(b-a-4)),1);
    for(const px of [a+(b-a)*.12,a+(b-a)*.86]){const x=Math.round(px),h=Math.max(3,Math.round(pk*.28));g.fillStyle=p.isl[4];g.fillRect(x,hz-1-h,1,h);g.fillRect(x-2,hz-1-h,5,1);g.fillRect(x-3,hz-h,1,1);g.fillRect(x+3,hz-h,1,1)}};
  const pk=Math.round(H*(G.port?.05:.075));
  if(G.port){isle(W*.04,W*.5,pk,.42,3);isle(W*.66,W*.8,Math.round(pk*.35),.5,9)}
  else{isle(W*.07,W*.36,pk,.42,3);isle(W*.6,W*.7,Math.round(pk*.33),.5,9)}
  return c}

/* ================= CLOUDS: three parallax decks of pixel cumulus that slowly boil ================= */
let CL=[];
function disc(g,cx,cy,r){cx=Math.round(cx);cy=Math.round(cy);const R=Math.max(1,Math.round(r));for(let y=-R;y<=R;y++){const w=Math.round(Math.sqrt(Math.max(0,R*R-y*y+R*.6)));if(w>0)g.fillRect(cx-w,cy+y,w*2,1)}}
const CLC={
  far:{day:['#e4f4ff','#b5d5ef','#f6fcff','#a5c7e5'],gold:['#f2d6d8','#c8a2bc','#ffeadf','#ad8eae']},
  near:{day:['#f2f9ff','#c4dcf3','#ffffff','#a9c6e6'],gold:['#ffe7dc','#cf9fbb','#fff4e2','#a98bad']}
};
function layerSpec(name){const s=G.s,w=G.port?W*1.5:W;
  return name==='far'?{n:G.port?3:5,w:[.07*w,.13*w],r:[3*s,5.5*s],y:[G.hz-H*.12,G.hz-H*.035],v:[1.4*s,2.4*s],a:.9,pal:'far'}
    :name==='mid'?{n:G.port?3:4,w:[.13*w,.22*w],r:[6.5*s,10*s],y:G.port?[H*.2,H*.42]:[H*.18,H*.36],v:[3.6*s,5.4*s],a:1,pal:'near'}
    :{n:G.port?2:3,w:[.22*w,.34*w],r:[10*s,16*s],y:G.port?[H*.03,H*.13]:[H*.015,H*.12],v:[7*s,10*s],a:1,pal:'near'}}
function makeCloud(layer,x,R){const S=layerSpec(layer);const w=lerp(S.w[0],S.w[1],R()),rr=lerp(S.r[0],S.r[1],R());
  const P=[];const n=Math.max(3,Math.round(w/(rr*1.2)));
  for(let i=0;i<n;i++){const u=i/(n-1),dome=Math.sin(PI*(.1+.8*u)),r=rr*(.5+.6*dome)*(.85+R()*.3);P.push({x:(u-.5)*(w-rr*1.2),y:-r*.3-dome*rr*.25,r,ph:R()*TAU,sp:.3+R()*.4})}
  const m=Math.max(1,Math.round(n*.5));for(let i=0;i<m;i++){const u=.22+R()*.56,dome=Math.sin(PI*u),r=rr*(.55+.5*dome)*(.9+R()*.3);P.push({x:(u-.5)*w*.75,y:-rr*.5-dome*rr*.6-R()*rr*.2,r,ph:R()*TAU,sp:.3+R()*.4})}
  let x0=1e9,x1=-1e9,y0=1e9;for(const p of P){x0=Math.min(x0,p.x-p.r*1.12);x1=Math.max(x1,p.x+p.r*1.12);y0=Math.min(y0,p.y-p.r*1.12)}
  const yb=Math.round(rr*.3),ox=Math.ceil(-x0)+2,oy=Math.ceil(-y0)+2,c=cnv(x1-x0+4,yb-y0+3);
  return{layer,S,x,y:lerp(S.y[0],S.y[1],R()),v:lerp(S.v[0],S.v[1],R()),w:x1-x0,P,rr,yb,ox,oy,c,g:c.getContext('2d'),k:(R()*6)|0}}
function initClouds(){CL=[];const R=Math.random;for(const L of ['far','mid','near']){const S=layerSpec(L),N=S.n*2;for(let i=0;i<N;i++){const c=makeCloud(L,(i+R()*.7)/N*(W+80)-40,R);c.rk=R();CL.push(c)}}
  for(const c of CL)renderCloud(c,0)}
function renderCloud(cl,t){const g=cl.g,pal=CLC[cl.S.pal],C=[0,1,2,3].map(i=>{const c=mix(pal.day[i],pal.gold[i],GM);return WS.over>.02?mix(c,['#c6ccd3','#98a1ab','#dce0e5','#88929d'][i],Math.min(1,WS.over*.9)):c});
  g.globalCompositeOperation='source-over';g.clearRect(0,0,cl.c.width,cl.c.height);const ox=cl.ox,oy=cl.oy,b=RM?0:1;
  const rs=cl.P.map(p=>p.r*(1+.075*b*Math.sin(t*p.sp+p.ph))),dx=cl.P.map(p=>b*Math.sin(t*p.sp*.7+p.ph*2)*p.r*.06);
  g.fillStyle=C[1];cl.P.forEach((p,i)=>disc(g,ox+p.x+dx[i],oy+p.y+rs[i]*.24,rs[i]));
  g.fillStyle=C[0];cl.P.forEach((p,i)=>disc(g,ox+p.x+dx[i],oy+p.y,rs[i]*.92));
  g.fillStyle=C[2];cl.P.forEach((p,i)=>disc(g,ox+p.x+dx[i]-rs[i]*.2,oy+p.y-rs[i]*.32,rs[i]*.52));
  g.clearRect(0,oy+cl.yb,cl.c.width,cl.c.height);
  g.globalCompositeOperation='source-atop';const sh=Math.max(1,Math.round(cl.rr*.18));g.fillStyle=C[3];g.fillRect(0,oy+cl.yb-sh,cl.c.width,sh);
  g.fillStyle=C[1];g.fillRect(0,oy+cl.yb-sh*2,cl.c.width,sh);g.globalCompositeOperation='source-over'}
function drawClouds(layer,t,dt){for(const cl of CL){if(cl.layer!==layer)continue;
  cl.pv=(cl.pv||0)*Math.exp(-dt*.7);cl.py=(cl.py||0)*Math.exp(-dt*.8);cl.x+=(cl.v*(RM?.35:1)*(.6+WS.wind/18)+clamp(cl.pv,-500,500))*dt;if(cl.x+cl.w/2<-W*.3)cl.x=W+cl.w/2;if(cl.x-cl.w/2>W+6){const n=makeCloud(layer,-cl.w/2-Math.random()*W*.25,Math.random);Object.assign(cl,n);renderCloud(cl,t)}
  if((FR+cl.k)%6===0)renderCloud(cl,t);
  const vis=clamp((.22+WS.cloud*.9-cl.rk)*5,0,1);if(vis<=0)continue;ctx.globalAlpha=cl.S.a*vis;ctx.drawImage(cl.c,Math.round(cl.x-cl.ox),Math.round(cl.y+(cl.py||0)-cl.oy));ctx.globalAlpha=1}}

/* ================= SUN, SEA, SHORE, PALMS, GULLS ================= */
function drawSun(t){const SI=sunInfo();if(!SI.vis)return;ctx.save();ctx.beginPath();ctx.rect(0,0,W,G.hz);ctx.clip();ctx.globalAlpha=1-WS.over*.88;const x=SI.x,y=SI.y,r=G.sunR,m=clamp(GM,0,1),fk=clamp((performance.now()-IX.flare)/1300,0,1);
  const gr=ctx.createRadialGradient(x,y,r*.5,x,y,r*6);gr.addColorStop(0,m>.5?'rgba(255,214,150,.6)':'rgba(255,252,226,.6)');gr.addColorStop(.35,'rgba(255,246,214,.18)');gr.addColorStop(1,'rgba(255,240,210,0)');
  ctx.fillStyle=gr;ctx.fillRect(x-r*6,y-r*6,r*12,r*12);
  ctx.fillStyle='rgba(255,252,232,'+(.07+.2*(1-fk)*(1-fk)).toFixed(3)+')';const a0=(RM?0:t*.025)+(1-E.out(fk))*.6*(fk<1?1:0);for(let i=0;i<12;i++){const a=a0+i*TAU/12,L=r*(i%2?6:8.5);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a-.06)*L,y+Math.sin(a-.06)*L);ctx.lineTo(x+Math.cos(a+.06)*L,y+Math.sin(a+.06)*L);ctx.closePath();ctx.fill()}
  if(fk<1){ctx.strokeStyle='rgba(255,250,220,'+((1-fk)*.75).toFixed(3)+')';ctx.lineWidth=1;for(const o of [0,.18]){const k=clamp(fk-o,0,1);if(k>0){ctx.beginPath();ctx.arc(x,y,r*(1.3+E.out(k)*6),0,TAU);ctx.stroke()}}}
  ctx.fillStyle=mix('#fff3c4','#ffc070',m);disc(ctx,x,y,r*(1+.18*(1-fk)*(fk<1?1:0)));ctx.fillStyle=mix('#fffdf0','#ffe2a8',m);disc(ctx,x-r*.15,y-r*.15,r*.72);ctx.restore()}
let GL_=[];
function initSea(){GL_=[];const R=mulberry(11),n=Math.round(W*.4);for(let i=0;i<n;i++){const d=Math.pow(R(),1.35);GL_.push({d,x:R()*W,len:1+Math.round(d*6*G.s),v:(R()<.5?-1:1)*(1+d*4)*G.s,ph:R()*TAU,rt:.7+R()*1.4})}}
function drawSea(t){const hz=G.hz,span=G.shore-hz;
  ctx.fillStyle=mix('#0a62ac','#284e8c',GM);ctx.globalAlpha=.5;
  for(let j=0;j<7;j++){const d=((j+(RM?0:t*.045))%7)/7;if(d>.82)continue;const y=Math.round(hz+3+Math.pow(d,1.5)*span*.95);
    for(let x=(j*13)%9-9;x<W;x+=9){if(Math.sin(x*.05+j*1.7+t*.4)>.1)ctx.fillRect(x,y,Math.round(5+d*6),1)}}
  ctx.globalAlpha=1;
  const c1=mix('#c4f1ff','#ffe6c0',GM),c2=mix('#f2ffff','#fff4dc',GM);
  for(const g of GL_){const y=Math.round(hz+2+g.d*(span-4));let x=((g.x+g.v*t)%W+W)%W|0;if(y>=CO[x]-2)continue;
    if(Math.sin(t*g.rt+g.ph)>.25){ctx.fillStyle=g.d>.5?c2:c1;ctx.fillRect(x,y,g.len,1)}}
  const SI=sunInfo(),sx=SI.x,fr=Math.floor(t*11);ctx.fillStyle=mix('#fffbe0','#ffd890',GM);
  if(SI.vis&&SI.y<G.hz-2)for(let y=hz+1;y<G.shore-G.amp*2;y+=2){const d=(y-hz)/span,hw=1+d*G.sunR*1.9;for(let k=0;k<3;k++){if(hash(y,k,fr)<.55){const x=Math.round(sx+(hash(y,k+7,fr)-.5)*2*hw);ctx.fillRect(x,y,Math.round(1+d*3),1)}}}
  const bx=((t*2.2*G.s)%(W+40))-20,by=G.hz-1;ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(bx),by-4,1,4);ctx.fillRect(Math.round(bx)+1,by-3,1,3);ctx.fillRect(Math.round(bx)+2,by-1,1,1);
  ctx.fillStyle=mix('#1b3a5a','#3a2a40',GM);ctx.fillRect(Math.round(bx)-2,by,6,1)}
function drawShore(t){const cyc=(RM?0:t)*TAU/6.8,A=G.amp;
  const wet=mix('#d8bd84','#c99d70',GM),lag=mix('#86f2df','#cfd8b4',GM),foam='#ffffff';
  const fys=new Int16Array(W);for(let x=0;x<W;x++){const w=Math.sin(cyc-x*.004)*.5+.5;fys[x]=Math.round(CO[x]+Math.pow(w,1.6)*A*1.7-A*.35+Math.sin(x*.11+t*1.6)*.9+Math.sin(x*.037-t*.9)*1.1)}
  if(smx)for(let x=0;x<W;x++){const top=CO[x]-4;smx.clearRect(x,top,1,fys[x]+2-top)}
  ctx.globalAlpha=.55;ctx.fillStyle=wet;for(let x=0;x<W;x++){const pk=CO[x]+Math.round(A*1.35);if(pk>fys[x])ctx.fillRect(x,fys[x],1,pk-fys[x])}
  ctx.globalAlpha=.85;ctx.fillStyle=lag;for(let x=0;x<W;x++){const top=CO[x]-3;if(fys[x]>top)ctx.fillRect(x,top,1,fys[x]-top)}
  ctx.globalAlpha=1;ctx.fillStyle=foam;const lf=Math.floor(t*6);for(let x=0;x<W;x++){ctx.fillRect(x,fys[x]-1,1,2);if(hash(x,lf,3)<.35)ctx.fillRect(x,fys[x]-3,1,1);if(hash(x,lf,5)<.18)ctx.fillRect(x,fys[x]+1,1,1)}
  const ph=((cyc/TAU)%1+1)%1;ctx.globalAlpha=Math.sin(ph*PI)*.85;for(let x=0;x<W;x+=2){const by=Math.round(CO[x]-A*(3.2-2.4*ph)+Math.sin(x*.06+t)*1);if(Math.sin(x*.09+t*.7)>-.2)ctx.fillRect(x,by,2,1)}
  ctx.globalAlpha=1}
function palm(bx,by,hgt,lean,sc,t,seed,maxL,dt){
  const P=PALMS[seed]||(PALMS[seed]={shake:0});P.shake=Math.max(0,P.shake-dt*1.1);const sk=P.shake*P.shake;
  const sway=(RM?0:Math.sin(t*.7+seed)*1.6*sc*(.7+WS.wind/25)+Math.sin(t*1.9+seed*2)*.5*sc)+Math.sin(t*21)*sk*4*sc;
