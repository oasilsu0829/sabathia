<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키 생성</title>
<style>
  body { margin:0; background:#0f172a; color:#e2e8f0; font:15px/1.5 system-ui, sans-serif; padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; }
  p { color:#94a3b8; font-size:14px; }
  .k { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:12px; margin-bottom:12px; }
  .n { font-weight:600; color:#38bdf8; margin-bottom:6px; }
  code { display:block; word-break:break-all; font-size:12px; background:#0f172a; padding:8px; border-radius:8px; }
  button { margin-top:8px; width:100%; padding:10px; border:none; border-radius:10px; background:#38bdf8; color:#0f172a; font:inherit; font-weight:600; }
</style>
</head>
<body>
<h1>자비스 키 생성</h1>
<p>키는 이 폰 안에서만 만들어지고 어디로도 전송되지 않아요. 각 값을 복사해서 Cloudflare 대시보드 → 이 Worker → Settings → Variables and Secrets에 <b>Secret</b> 타입으로 같은 이름으로 등록하세요. 새로고침하면 다른 키가 나오니 셋 다 같은 화면에서 복사하세요.</p>
<div id="out"></div>
<script>
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
(async () => {
  const kp = await crypto.subtle.generateKey({ name:'ECDSA', namedCurve:'P-256' }, true, ['sign','verify']);
  const pub = b64u(await crypto.subtle.exportKey('raw', kp.publicKey));
  const { kty, crv, x, y, d } = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const keys = {
    VAPID_PUBLIC: pub,
    VAPID_PRIVATE_JWK: JSON.stringify({ kty, crv, x, y, d }),
    APP_TOKEN: b64u(crypto.getRandomValues(new Uint8Array(24))),
  };
  for (const [name, val] of Object.entries(keys)) {
    const div = document.createElement('div'); div.className = 'k';
    div.innerHTML = `<div class="n">${name}</div><code></code><button>복사</button>`;
    div.querySelector('code').textContent = val;
    div.querySelector('button').onclick = async (e) => {
      try { await navigator.clipboard.writeText(val); e.target.textContent = '복사됨'; }
      catch { e.target.textContent = '길게 눌러 직접 복사하세요'; }
    };
    document.getElementById('out').appendChild(div);
  }
  const note = document.createElement('p');
  note.textContent = 'APP_TOKEN은 앱에서 입력해야 하니 따로 적어두세요.';
  document.getElementById('out').appendChild(note);
})();
</script>
</body>
</html>
