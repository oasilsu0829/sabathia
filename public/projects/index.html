<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장부</title>
<meta name="description" content="프로젝트 장부. 프로젝트마다 다음 할 일 하나, 단계 진행률, 연결된 일정·논문·결정 수">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&family=Hahmlet:wght@500;800&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 장부 · 디자인 언어 v1.0 (6장 장부)
   머리(장부 + 개수 + 정렬) → 필터(전체·진행·멈춤·완료) → 카드 목록 → 추가 버튼. 시트로 추가·편집.
   카드: [맵] 상태 · 고친 날 / 명조 이름 / 설명 / 다음 할 일(체크) / n/m 단계 / 일정 · 논문 · 결정 */
:root {
  --bg: #ffffff; --ink: #000000; --muted: #5c5c5c;
  --accent: #026395; --on-accent: #ffffff;
  --warn: #d1001f; --on-warn: #ffffff; --warn-text: #d1001f;
  --map-empty: #f0f0f0; --map-pending: #b8b8b8;
  --line-bold: 3px; --line-thin: 1px; --body-size: 16px;
  --pad-x: 20px; --gap-section: 24px;
  --font-title: 'Hahmlet', 'Noto Serif KR', serif;
  --font-body: 'Gothic A1', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --font-num: 'Space Grotesk', 'Gothic A1', sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --ink: #ffffff; --muted: #a3a3a3;
    --accent: #4fb3e0; --on-accent: #000000;
    --warn: #e4002b; --on-warn: #ffffff; --warn-text: #ff6b6b;
    --map-empty: #1c1c1c; --map-pending: #4a4a4a;
    --line-thin: 2px; --body-size: 17px;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --ink: #ffffff; --muted: #a3a3a3;
  --accent: #4fb3e0; --on-accent: #000000;
  --warn: #e4002b; --on-warn: #ffffff; --warn-text: #ff6b6b;
  --map-empty: #1c1c1c; --map-pending: #4a4a4a;
  --line-thin: 2px; --body-size: 17px;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-weight: 500; font-size: var(--body-size); line-height: 22px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; word-break: keep-all;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 640px; margin: 0 auto;
  padding-left: max(var(--pad-x), env(safe-area-inset-left, 0px));
  padding-right: max(var(--pad-x), env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
}
.sab { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-family: var(--font-num); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; color: var(--ink); text-decoration: none; }
.sab span { color: var(--muted); }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 4px; }
.page-title { font-family: var(--font-title); font-weight: 800; font-size: 44px; line-height: 48px; margin: 0; display: flex; align-items: baseline; gap: 12px; }
.page-title .n { font-family: var(--font-num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.sort { position: relative; padding-bottom: 4px; }
.sort select {
  min-height: 44px; padding: 0 26px 0 0; border: 0; background: none; font-weight: 800; font-size: 13px; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 11px) 50%, calc(100% - 5px) 50%; background-size: 6px 6px; background-repeat: no-repeat;
}
.sub { margin: 6px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }

/* 필터: 활성은 3px 파랑 밑줄 */
.filters { display: flex; gap: 20px; margin-top: 16px; border-bottom: var(--line-thin) solid var(--ink); overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { position: relative; min-height: 44px; padding: 0; background: none; border: 0; font-weight: 800; font-size: 15px; white-space: nowrap; color: var(--muted); }
.filters button .c { font-family: var(--font-num); font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] { color: var(--accent); }
.filters button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: calc(-1 * var(--line-thin)); height: var(--line-bold); background: var(--accent); }

/* 카드 = 장부 행 (모서리 0, 그림자 0, 위 3px 선) */
.list { list-style: none; margin: 0; padding: 0; }
.card { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 14px; padding-block: 16px; border-bottom: var(--line-thin) solid var(--ink); }
.card.done { color: var(--muted); }
.map { display: grid; gap: 2px; align-self: start; margin-top: 4px; }
.map i { display: block; width: 6px; height: 6px; background: var(--map-empty); }
.map i.p { background: var(--map-pending); }
.map i.f { background: var(--accent); }
.card.paused .map i.f { background: var(--muted); }
.body { min-width: 0; display: grid; gap: 6px; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; line-height: 16px; }
.chip { border: 2px solid currentColor; font-weight: 800; font-size: 11px; letter-spacing: 0.06em; line-height: 16px; padding: 0 4px; }
.chip.active { color: var(--accent); }
.chip.paused { color: var(--ink); }
.chip.done { color: var(--muted); }
.chip.pri { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.code, .upd { font-family: var(--font-num); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.name { font-family: var(--font-title); font-weight: 800; font-size: 22px; line-height: 28px; margin: 0; overflow-wrap: anywhere; }
.name button { all: unset; cursor: pointer; }
.name button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.desc { margin: 0; font-size: 13px; line-height: 18px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 다음 할 일: 체크 칸 + 라벨 + 할 일 */
.next { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; margin-top: 4px; border-top: var(--line-thin) solid var(--ink); }
.check { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.check i { width: 20px; height: 20px; border: 2px solid var(--ink); display: grid; place-items: center; transition: transform 160ms var(--ease-out); }
.check:active i { transform: scale(0.9); }
.check.on i { background: var(--accent); border-color: var(--accent); }
.check.on i::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: translateY(-1px) rotate(-45deg); }
.check:disabled { cursor: default; }
.check:disabled i { border-color: var(--muted); }
.next-t { min-width: 0; padding-block: 6px; }
.next-l { font-weight: 800; font-size: 11px; letter-spacing: 0.06em; color: var(--accent); }
.card.paused .next-l { color: var(--ink); }
.next-a { font-weight: 800; font-size: 15px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next-a.struck { text-decoration: line-through; color: var(--muted); font-weight: 500; }

.prog { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.pct { font-family: var(--font-num); font-weight: 700; font-size: 28px; line-height: 32px; font-variant-numeric: tabular-nums; }
.steps { font-family: var(--font-num); font-weight: 700; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.links { display: flex; gap: 16px; font-size: 12px; line-height: 16px; color: var(--muted); }
.links b { font-family: var(--font-num); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.card.done .links b { color: var(--muted); }
.empty { padding: 32px 0; color: var(--muted); font-size: 13px; text-align: center; }

/* 추가 버튼 */
.fab { position: fixed; z-index: 20; right: max(var(--pad-x), env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border: 0; background: var(--ink); color: var(--bg); font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1; transition: transform 160ms var(--ease-out); }
.fab:active { transform: scale(0.97); }

/* 알림 줄 */
.toast { position: fixed; z-index: 30; left: max(var(--pad-x), env(safe-area-inset-left, 0px)); right: calc(96px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 800; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); max-width: 520px; }
.toast.on { opacity: 1; transform: none; pointer-events: auto; }
.toast button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }

/* 시트 */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.4); opacity: 0; transition: opacity 280ms var(--ease-out); }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-top: var(--line-bold) solid var(--ink); transform: translateY(100%); transition: transform 280ms var(--ease-drawer); padding: 0 max(var(--pad-x), env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(var(--pad-x), env(safe-area-inset-left, 0px)); }
.sheet.on { transform: none; transition-duration: 460ms; }
.sheet-in { max-width: 600px; margin: 0 auto; }
.sh-head { display: flex; justify-content: space-between; align-items: center; min-height: 56px; }
.sh-title { font-family: var(--font-title); font-weight: 800; font-size: 24px; margin: 0; }
.x { min-height: 44px; min-width: 44px; background: none; border: 0; font-weight: 800; font-size: 15px; }
.form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > span { font-weight: 800; font-size: 12px; letter-spacing: 0.06em; }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 10px; border: var(--line-thin) solid var(--ink); border-radius: 0; background: var(--bg); font-size: 16px; line-height: 22px; appearance: none; -webkit-appearance: none; }
.field textarea { resize: vertical; min-height: 120px; }
.field small { font-size: 12px; line-height: 16px; color: var(--muted); }
.sh-actions { display: flex; gap: 12px; margin-top: 18px; }
.btn { flex: 1; min-height: 48px; padding: 0 16px; border: 0; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 15px; }
.btn.line { background: none; color: var(--ink); border: var(--line-bold) solid var(--ink); }
.btn.warn { flex: none; background: none; color: var(--warn-text); border: var(--line-bold) solid var(--warn); }
.log { margin: 18px 0 0; padding: 0; list-style: none; border-top: var(--line-bold) solid var(--ink); }
.log li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding-block: 10px; border-bottom: var(--line-thin) solid var(--ink); font-size: 13px; line-height: 18px; }
.log time { font-family: var(--font-num); font-weight: 700; color: var(--muted); }
.log-h { font-family: var(--font-title); font-weight: 800; font-size: 18px; margin: 18px 0 0; }

@media (prefers-reduced-motion: reduce) {
  .sheet, .sheet.on, .toast, .check i { transition: opacity 200ms linear; transform: none; }
  .sheet:not(.on) { opacity: 0; pointer-events: none; }
}
</style>
</head>
<body>
<div class="app">
  <a class="sab" href="/" aria-label="Sabathia 홈으로">SABATHIA<span>PRJ-06</span></a>
  <header class="page-head">
    <h1 class="page-title">장부 <span class="n" id="count">00</span></h1>
    <label class="sort"><span hidden>정렬</span>
      <select id="sort" aria-label="정렬">
        <option value="updated">최근 고친 순</option>
        <option value="status">상태순</option>
        <option value="priority">우선순위순</option>
        <option value="progress">진행률순</option>
      </select>
    </label>
  </header>
  <p class="sub" id="summary"></p>
  <nav class="filters" id="filters" aria-label="필터">
    <button data-f="all" aria-pressed="true">전체<span class="c"></span></button>
    <button data-f="active" aria-pressed="false">진행<span class="c"></span></button>
    <button data-f="paused" aria-pressed="false">멈춤<span class="c"></span></button>
    <button data-f="done" aria-pressed="false">완료<span class="c"></span></button>
  </nav>
  <ul class="list" id="list"></ul>
</div>

<button class="fab" id="add" aria-label="프로젝트 추가">+</button>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undo" hidden>되돌리기</button></div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="sheet-in">
    <div class="sh-head"><h2 class="sh-title" id="shTitle">새 프로젝트</h2><button class="x" id="close">닫기</button></div>
    <form class="form" id="form">
      <label class="field wide"><span>이름</span><input name="name" required maxlength="80"></label>
      <label class="field wide"><span>설명</span><input name="desc" maxlength="160"></label>
      <label class="field"><span>코드</span><input name="code" maxlength="10" placeholder="EXP-01"></label>
      <label class="field"><span>상태</span><select name="status"><option value="active">진행</option><option value="paused">멈춤</option><option value="done">완료</option></select></label>
      <label class="field"><span>우선순위</span><select name="pri"><option value="1">높음</option><option value="2" selected>보통</option><option value="3">낮음</option></select></label>
      <label class="field wide"><span>단계</span><textarea name="steps" placeholder="한 줄에 한 단계. 끝난 단계는 앞에 x"></textarea><small>맨 위의 안 끝난 단계가 '다음 할 일'. 진행률은 단계 수로 계산한다.</small></label>
      <label class="field"><span>일정</span><input name="events" type="number" min="0" inputmode="numeric" value="0"></label>
      <label class="field"><span>논문</span><input name="papers" type="number" min="0" inputmode="numeric" value="0"></label>
      <label class="field"><span>결정</span><input name="decisions" type="number" min="0" inputmode="numeric" value="0"></label>
    </form>
    <div class="sh-actions">
      <button class="btn warn" id="del" hidden>지우기</button>
      <button class="btn line" id="cancel" type="button">취소</button>
      <button class="btn" id="save" type="button">저장</button>
    </div>
    <h3 class="log-h" id="logH" hidden>기록</h3>
    <ul class="log" id="log" hidden></ul>
  </div>
</section>

<script src="/sabathia.js"></script>
<script>
(() => {
  'use strict';
  const KEY = 'projects.v1';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // 처음 열면 시안의 예시 프로젝트로 시작한다. 지우거나 고쳐 쓰면 된다
  function seed() {
    const now = Date.now(), h = 3600e3, d = 24 * h;
    const mk = (code, name, desc, status, pri, upd, total, done, steps, ev, pa, de) => {
      const st = [];
      for (let i = 0; i < total; i++) st.push({ t: steps[i - done] || `단계 ${i + 1}`, done: i < done });
      for (let i = 0; i < done; i++) st[i].t = `단계 ${i + 1}`;
      return { id: uid(), code, name, desc, status, pri, updated: now - upd, steps: st, events: ev, papers: pa, decisions: de, log: [] };
    };
    return [
      mk('EXP-01', 'DeepFold 구조', '하이브리드 확산으로 매크로사이클 펩타이드 결합 예측 파이프라인', 'active', 1, 2 * h, 18, 12, ['CASP15 세트로 결합 에너지 벤치마크'], 3, 6, 9),
      mk('EXP-02', 'CryoEM 프로토콜 표준화', '얼음 오염 제거, 자동 유리화 그리드 처리량 올리기', 'active', 2, d, 12, 5, ['Vitrobot 습도 챔버 센서 보정'], 2, 4, 5),
      mk('CODE-03', '생물정보 모음집', '구조 RNA 유전체학에 쓴 트랜스포머 모델 정리', 'active', 2, 17 * d, 20, 17, ['Ribonanza 벤치마크 데이터 메모 달기'], 1, 11, 8),
      mk('SCH-04', '장비 연구비 제안서', '고처리량 로봇 분주기 장비비 확보', 'paused', 3, 24 * d, 10, 3, ['학과장 공동 서명 검토 기다리기'], 0, 2, 3),
      mk('CODE-05', '자동 유리화 셔틀 v1', '시료 자동 장착 냉각 스테이지 펌웨어 다시 쓰기', 'done', 3, 39 * d, 14, 14, [], 0, 0, 14),
    ];
  }

  let data;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!Array.isArray(data)) { data = seed(); save(); }

  let filter = 'all';
  let sort = 'updated';
  try { sort = localStorage.getItem('projects.sort') || 'updated'; } catch {}
  $('#sort').value = sort;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
    report();
  }

  // 홈 아이콘: 진행 중 프로젝트 단계 합계 진행률, 배지는 멈춘 프로젝트 수
  function report() {
    if (!window.Sabathia) return;
    const act = data.filter((p) => p.status === 'active');
    let n = 0, dn = 0;
    for (const p of act) { n += p.steps.length; dn += p.steps.filter((s) => s.done).length; }
    Sabathia.report('projects', { pct: n ? dn / n * 100 : 0, active: act.length, paused: data.filter((p) => p.status === 'paused').length, n, done: dn });
  }

  const pctOf = (p) => (p.steps.length ? Math.round(p.steps.filter((s) => s.done).length / p.steps.length * 100) : (p.status === 'done' ? 100 : 0));
  const nextOf = (p) => p.steps.find((s) => !s.done);

  function ago(t) {
    const m = Math.floor((Date.now() - t) / 60e3);
    if (m < 1) return '방금';
    if (m < 60) return `${m}분 전`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}시간 전`;
    if (h < 48) return '어제';
    const d = new Date(t);
    return `${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  }

  // 컨택트 맵 (디자인 언어 5장)
  function contactMap(seedStr, n, pct) {
    let h = 7;
    for (const ch of seedStr) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
    const set = new Set();
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (Math.abs(i - j) <= 1) set.add(i + ',' + j);
    for (let t = 0; t < n; t++) {
      const a = Math.floor(rnd() * n), b = Math.floor(rnd() * n);
      if (Math.abs(a - b) >= 2) { set.add(a + ',' + b); set.add(b + ',' + a); }
    }
    const order = [...set].map((k) => k.split(',').map(Number)).sort((p, q) =>
      Math.abs(p[0] - p[1]) - Math.abs(q[0] - q[1]) || Math.min(...p) - Math.min(...q) || p[0] - q[0]);
    const filled = new Set(order.slice(0, Math.round(order.length * pct / 100)).map((c) => c.join(',')));
    let out = '';
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const k = i + ',' + j;
      out += `<i class="${filled.has(k) ? 'f' : set.has(k) ? 'p' : ''}"></i>`;
    }
    return `<div class="map" role="img" aria-label="${pct}퍼센트 진행" style="grid-template-columns:repeat(${n},6px)">${out}</div>`;
  }

  const ST = { active: '진행', paused: '멈춤', done: '완료' };
  const ORDER = { active: 0, paused: 1, done: 2 };

  function render() {
    const c = { all: 0, active: 0, paused: 0, done: 0 };
    for (const p of data) { c[p.status]++; if (p.status !== 'done') c.all++; }
    $('#count').textContent = pad(c.all);
    $('#summary').textContent = `진행 ${c.active} · 멈춤 ${c.paused}`;
    document.querySelectorAll('#filters button').forEach((b) => {
      b.setAttribute('aria-pressed', b.dataset.f === filter);
      b.querySelector('.c').textContent = c[b.dataset.f];
    });

    let rows = data.filter((p) => (filter === 'all' ? p.status !== 'done' : p.status === filter));
    const cmp = {
      updated: (a, b) => b.updated - a.updated,
      status: (a, b) => ORDER[a.status] - ORDER[b.status] || b.updated - a.updated,
      priority: (a, b) => a.pri - b.pri || b.updated - a.updated,
      progress: (a, b) => pctOf(b) - pctOf(a),
    }[sort];
    rows = rows.slice().sort(cmp);

    $('#list').innerHTML = rows.length ? rows.map(card).join('') : `<li class="empty">${filter === 'all' ? '프로젝트가 없다. + 로 추가' : '해당 프로젝트 없음'}</li>`;
  }

  function card(p) {
    const pct = pctOf(p);
    const nx = nextOf(p);
    const doneN = p.steps.filter((s) => s.done).length;
    const last = p.lastDone && Date.now() - p.lastDone.at < 10 * 60e3 ? p.lastDone : null;
    let next = '';
    if (p.status !== 'done') {
      const label = p.status === 'paused' ? '대기 중' : '다음';
      if (last && !nx) {
        next = nextRow(p, true, label, last.t);
      } else if (nx) {
        next = nextRow(p, false, label, nx.t);
      } else {
        next = `<div class="next"><span></span><div class="next-t"><div class="next-l">다음</div><div class="next-a struck">단계를 모두 끝냄</div></div></div>`;
      }
    }
    const top = p.status === 'done'
      ? `<span class="chip done">완료</span><span class="upd">${ago(p.updated)} 보관</span>`
      : `<span class="chip ${p.status}">${ST[p.status]}</span>${p.pri === 1 ? '<span class="chip pri">우선</span>' : ''}<span class="upd">${ago(p.updated)}</span>`;
    return `<li class="card ${p.status}" data-id="${p.id}">
      ${contactMap(p.name, 6, pct)}
      <div class="body">
        <div class="top">${p.code ? `<span class="code">${esc(p.code)}</span>` : ''}${top}</div>
        <h2 class="name"><button data-edit>${esc(p.name)}</button></h2>
        ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
        ${next}
        <div class="prog"><span class="pct">${pct}%</span><span class="steps">${p.steps.length ? `${doneN} / ${p.steps.length} 단계` : '단계 없음'}${p.status === 'paused' ? ' · 멈춤' : ''}</span></div>
        <div class="links"><span>일정 <b>${p.events | 0}</b></span><span>논문 <b>${p.papers | 0}</b></span><span>결정 <b>${p.decisions | 0}</b></span></div>
      </div>
    </li>`;
  }

  function nextRow(p, on, label, text) {
    return `<div class="next">
      <button class="check${on ? ' on' : ''}" data-check aria-label="${on ? '다음 할 일 되돌리기' : '다음 할 일 끝내기'}: ${esc(text)}" aria-pressed="${on}"><i></i></button>
      <div class="next-t"><div class="next-l">${label}</div><div class="next-a${on ? ' struck' : ''}">${esc(text)}</div></div>
    </div>`;
  }

  const stamp = () => { const d = new Date(); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };

  function complete(p) {
    const s = nextOf(p);
    if (!s) return;
    s.done = true;
    p.updated = Date.now();
    p.lastDone = { t: s.t, at: Date.now() };
    p.log = [{ at: Date.now(), t: `끝냄 — ${s.t}` }, ...(p.log || [])].slice(0, 50);
    save(); render();
    const nx = nextOf(p);
    toast(nx ? `기록함. 다음 — ${nx.t}` : '기록함. 단계를 모두 끝냄', () => reopen(p, s));
  }

  function reopen(p, s) {
    s = s || (p.lastDone && [...p.steps].reverse().find((x) => x.done && x.t === p.lastDone.t));
    if (!s) return;
    s.done = false;
    p.lastDone = null;
    p.updated = Date.now();
    p.log = [{ at: Date.now(), t: `되돌림 — ${s.t}` }, ...(p.log || [])].slice(0, 50);
    save(); render();
    toast('다음 할 일을 되돌림');
  }

  let tt;
  function toast(msg, undo) {
    clearTimeout(tt);
    $('#toastMsg').textContent = msg;
    const u = $('#undo');
    u.hidden = !undo;
    u.onclick = undo ? () => { $('#toast').classList.remove('on'); undo(); } : null;
    $('#toast').classList.add('on');
    tt = setTimeout(() => $('#toast').classList.remove('on'), undo ? 4000 : 2200);
  }

  $('#list').addEventListener('click', (e) => {
    const li = e.target.closest('.card');
    if (!li) return;
    const p = data.find((x) => x.id === li.dataset.id);
    if (e.target.closest('[data-check]')) {
      const on = e.target.closest('[data-check]').classList.contains('on');
      on ? reopen(p) : complete(p);
      return;
    }
    if (e.target.closest('button, a')) { if (e.target.closest('[data-edit]')) openSheet(p); return; }
    openSheet(p);
  });

  $('#filters').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    filter = b.dataset.f;
    render();
  });
  $('#sort').addEventListener('change', (e) => {
    sort = e.target.value;
    try { localStorage.setItem('projects.sort', sort); } catch {}
    render();
  });

  // 시트
  let editing = null;
  const form = $('#form');
  function openSheet(p) {
    editing = p || null;
    $('#shTitle').textContent = p ? '프로젝트 고치기' : '새 프로젝트';
    $('#del').hidden = !p;
    const nums = data.map((x) => parseInt((x.code || '').split('-')[1], 10) || 0);
    const v = p || { name: '', desc: '', code: `EXP-${pad(Math.max(0, ...nums) + 1)}`, status: 'active', pri: 2, steps: [], events: 0, papers: 0, decisions: 0 };
    form.name.value = v.name; form.desc.value = v.desc || ''; form.code.value = v.code || '';
    form.status.value = v.status; form.pri.value = String(v.pri);
    form.steps.value = v.steps.map((s) => (s.done ? 'x ' : '') + s.t).join('\n');
    form.events.value = v.events | 0; form.papers.value = v.papers | 0; form.decisions.value = v.decisions | 0;
    const log = (p && p.log) || [];
    $('#logH').hidden = $('#log').hidden = !log.length;
    $('#log').innerHTML = log.map((l) => { const d = new Date(l.at); return `<li><time>${pad(d.getMonth() + 1)}.${pad(d.getDate())}</time><span>${esc(l.t)}</span></li>`; }).join('');
    $('#scrim').hidden = $('#sheet').hidden = false;
    requestAnimationFrame(() => { $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); if (!p) form.name.focus(); });
  }
  function closeSheet() {
    if ($('#sheet').hidden) return false;
    $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
    setTimeout(() => { $('#scrim').hidden = $('#sheet').hidden = true; }, 280);
    return true;
  }
  window.Sabathia.back = closeSheet;

  $('#add').onclick = () => openSheet(null);
  $('#close').onclick = $('#cancel').onclick = $('#scrim').onclick = closeSheet;
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  $('#save').onclick = () => {
    const name = form.name.value.trim();
    if (!name) { form.name.focus(); return; }
    const steps = form.steps.value.split('\n').map((l) => l.trim()).filter(Boolean)
      .map((l) => (/^x\s+/i.test(l) ? { t: l.replace(/^x\s+/i, ''), done: true } : { t: l, done: false }));
    const v = {
      name, desc: form.desc.value.trim(), code: form.code.value.trim().toUpperCase(),
      status: form.status.value, pri: +form.pri.value, steps,
      events: Math.max(0, +form.events.value | 0), papers: Math.max(0, +form.papers.value | 0), decisions: Math.max(0, +form.decisions.value | 0),
      updated: Date.now(),
    };
    if (editing) {
      if (editing.status !== v.status) editing.log = [{ at: Date.now(), t: `상태 — ${ST[v.status]}` }, ...(editing.log || [])].slice(0, 50);
      Object.assign(editing, v);
      editing.lastDone = null;
    } else {
      data.push({ id: uid(), log: [{ at: Date.now(), t: '만듦' }], ...v });
    }
    save(); render(); closeSheet();
    toast(editing ? '저장함' : '프로젝트를 추가함');
  };
  $('#del').onclick = () => {
    if (!editing || !confirm(`'${editing.name}' 을(를) 지울까?`)) return;
    const gone = editing, at = data.indexOf(gone);
    data = data.filter((x) => x !== gone);
    save(); render(); closeSheet();
    toast('지움', () => { data.splice(at, 0, gone); save(); render(); });
  };

  render();
  report();
  addEventListener('pageshow', render);
})();
</script>
</body>
</html>
