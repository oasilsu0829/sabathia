<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T/L/L로 이동</title>
<meta name="theme-color" content="#18181b">
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #18181b; color: #fafafa; font: 600 15px system-ui, sans-serif; }
  b { font-size: 40px; letter-spacing: -.01em; } b i { font-style: normal; color: #ef4444; }
  p { color: #a1a1aa; text-align: center; } a { color: #fafafa; }
</style>
</head>
<body>
<main><p><b>T<i>/</i>L<i>/</i>L</b></p><p>음악은 새 주소로 옮겼습니다.<br><a id="go" href="https://tll.oasilsu0829.workers.dev/">tll.oasilsu0829.workers.dev</a></p></main>
<script>
  // 음악 앱은 별도 앱 T/L/L로 옮겼다(2026-11-13). 이 주소는 그쪽으로 넘긴다.
  // 처음 한 번은 이 기기의 음악 기록(music.* · mag.*, 로그인 토큰 제외)을 #from= 에 담아 보낸다. 받는 쪽은 T/L/L public/shell.js
  (() => {
    const NEW = 'https://tll.oasilsu0829.workers.dev/';
    const hash = location.hash.slice(1);
    let from = '';
    try {
      if (!localStorage.getItem('tll.moved')) {
        const d = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (/^(music|mag)\./.test(k) && !/^music\.(tok|pkce)/.test(k)) d[k] = localStorage.getItem(k);
        }
        if (Object.keys(d).length) {
          const bytes = new TextEncoder().encode(JSON.stringify(d));
          let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          from = 'from=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        localStorage.setItem('tll.moved', String(Date.now()));
      }
    } catch {}
    const tail = [from, hash].filter(Boolean).join('&');
    const url = NEW + (tail ? '#' + tail : '');
    document.getElementById('go').href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
