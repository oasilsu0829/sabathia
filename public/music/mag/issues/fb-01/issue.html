        <p class="drop">월요일은 한 주 가운데 가장 무거운 날이다. 그래서 이 잡지는 월요일에 나온다. 출근길 지하철에서, 아직 덜 깬 채로 펼쳐 볼 수 있게.</p>
        <p>feedback은 앰프 앞에 기타를 댔을 때 생기는 울림이다. 소리가 돌아와 다시 소리를 만든다. 밴드와 관객, 노래와 듣는 사람 사이도 그렇다고 우리는 믿는다. 제호를 소문자로 쓰는 것은 크게 외치지 않고 가까이서 말하겠다는 뜻이다.</p>
        <p>우리는 점수보다 장면을 믿는다. 이 판이 어떤 밤에, 어떤 거리에서, 누구 곁에서 울려야 하는지를 쓴다. 다만 우리는 판을 직접 듣지 못한다. 그래서 소리에 대한 문장은 들은 사람들의 말을 옮기고, 장면은 우리의 상상이라고 밝혀 둔다.</p>
        <p>첫 호의 커버는 열 번째 앨범을 낸 킹스 오브 리온이다. 경기장을 울리던 밴드가 이번에는 거실 크기의 노래를 골랐다. 서툰 진심이 매끈한 거짓보다 낫다고 믿는 이 잡지가, 첫 장을 그 판에 내주는 이유다.</p>
        <p class="ni" style="font-family:var(--it);font-style:italic;font-size:3.6cqw;text-align:right;margin-top:3cqw">— 윤서해</p>

<template class="sp"><div class="spread">
    <div class="pg L">
      <div class="rh"><span>Cover story · Kings of Leon</span><span>O My Beloved · 7/11</span></div>
      <div class="body2 cols" style="position:absolute;left:6cqw;right:6cqw;top:10cqw;bottom:38cqw;column-fill:balance;column-gap:3.6cqw;font-size:2.75cqw">
        <p class="drop">테네시의 팔로윌 형제 셋과 사촌 하나. 넷이 내슈빌에서 처음 한 방에 모인 게 1999년이었다. 그로부터 스물일곱 해, 열 번째 앨범에서 그들은 처음으로 누구에게도 손잡이를 넘기지 않았다. 전작 [Can We Please Have Fun]을 키드 하푼에게 맡겼던 밴드가, 이번에는 직접 프로듀서 자리에 앉았다.</p>
        <p>밴드는 이 판을 지금까지 가장 내밀하고 무방비한 기록이라고 불렀다. AP는 어쿠스틱하고 개인적인 쪽으로 방향을 틀었다고 썼고, 9월에 먼저 나온 'My Whole World'가 그 문을 열었다.</p>
      </div>
      <div style="position:absolute;left:6cqw;right:6cqw;bottom:11cqw;border-top:1.4cqw solid #2bb3d9;padding-top:3cqw;font-family:var(--body);font-weight:900;font-size:5.4cqw;line-height:1.3;letter-spacing:-.02em;word-break:keep-all">경기장을 울리던 밴드가, 이번에는 거실 크기의 노래를 골랐다.</div>
      <div class="folio">8</div>
    </div>
    <div class="pg R">
      <div class="photo" style="left:0;right:0;top:0;height:58cqw;background-image:url(/music/mag/issues/fb-01/d041a0d96f.jpg)"></div>
      <div class="cap" style="position:absolute;left:6cqw;right:6cqw;top:60cqw"><b>킹스 오브 리온의 공연.</b> 노란 조명 아래의 기타. 사진 wonker / CC BY 2.0</div>
      <div class="body2" style="position:absolute;left:6cqw;right:6cqw;top:68cqw;font-size:2.55cqw">
        <p class="ni">'KOYSAR'의 뮤직비디오에는 멤버들의 아이들이 가족 나들이처럼 등장한다. 무대 위의 밴드가 아니라 아버지들의 하루를 찍은 영상이다. 이 판이 어디를 향하는지, 그 영상 하나가 먼저 말해 준다.</p>
        <p>모두가 반긴 것은 아니다. Riff는 너무 안전하고 되풀이된다며 10점 중 5점을 줬고, Clash는 아메리카나와 다정한 선율을 들어 8점을 줬다. Daily Bruin은 예전 히트곡보다 크게 울리려 하지 않아서 오히려 낫다고 했다.</p>
      </div>
      <div class="folio">9</div>
    </div>
  </div></template>
<template class="sp"><div class="spread">
    <div class="pg L">
      <div class="rh"><span>Cover story · Kings of Leon</span><span>O My Beloved · 7/11</span></div>
      <div class="body2 cols" style="position:absolute;left:6cqw;right:6cqw;top:10cqw;bottom:38cqw;column-fill:balance;column-gap:3.6cqw;font-size:2.75cqw">
        <p class="ni">같은 판을 두고 '안전하다'와 '진심이다'가 함께 나온다. 나는 그게 이 판의 정확한 초상이라고 생각한다. 젊은 날의 킹스 오브 리온을 그리워하는 사람에게 이 판은 조금 심심할지 모른다.</p>
        <p>열 장을 내는 동안 넷은 한 번도 얼굴을 바꾸지 않았다. 형제와 사촌으로 이루어진 밴드에게 가족 이야기는 새 주제가 아니다. 다만 이번에는 그 가족에 다음 세대가 들어왔다. 'KOYSAR'의 아이들 말이다. 16쪽에 지난 열 장을 적어 두었다.</p>
        <p>하지만 밴드가 나이 드는 방법은 여러 가지이고, 그중 가장 다정한 것은 집으로 돌아오는 것이다. 볼륨은 7. 끝까지 올리지는 않되, 옆방에서 자는 사람이 깨지 않을 만큼만.</p>
      </div>
      <div style="position:absolute;left:6cqw;right:6cqw;bottom:11cqw;background:#efe6d6;padding:3cqw"><div class="lbl" style="color:#d23a26">다른 시각</div><div class="body2" style="font-size:2.4cqw;margin-top:1cqw"><p class="ni" style="margin:0">Riff의 말처럼, 이 판의 다정함은 같은 온도가 열세 곡 내내 이어진다는 뜻이기도 하다. 그 온도가 맞지 않는 밤도 있을 것이다.</p></div></div>

        <p class="ni">이건 내가 그려 본 장면이다. 하루가 끝나고 집 안의 소리가 하나씩 꺼진다. 냉장고 소리, 창밖의 빗소리, 그리고 판 하나.</p>
        <p>제목부터 새벽 쪽으로 기우는 'Cold Blue Dawn'을 먼저 건다. 곁에 누가 있다는 것만으로 충분하다는 이름의 'Warm Company'가 그다음. 마지막으로 불을 끄기 전에 'My Whole World'. 이 세 곡을 고른 이유는 소리가 아니라 이름이다. 소리는 당신의 거실에서 확인해 주길.</p>
