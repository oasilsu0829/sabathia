        <p>몇 가지를 약속한다. 화제와 실력을 섞지 않는다. 비프가 앨범을 좋게 만들지 않고, 조회 수가 랩을 잘하게 만들지 않는다. 국내와 해외를 같은 자로 잰다. 가사는 인용하지 않는다. 무엇을 말했는지, 어떻게 말했는지를 분석한다.</p>
