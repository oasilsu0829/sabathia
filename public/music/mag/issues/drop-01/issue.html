      <div class="body2 cols" style="position:absolute;left:7cqw;right:7cqw;top:35cqw;bottom:12cqw;column-fill:auto;column-gap:3.6cqw">
        <p class="drop">첫 호를 낸다. Drop은 매주 금요일, 그 주에 나온 앨범을 다룬다. 금요일마다 수백 장이 나오고, 대부분은 다음 금요일이면 잊힌다. 우리는 그중 10년 뒤에도 꺼낼 판을 찾는다. 찾지 못한 주에는 찾지 못했다고 쓴다. 이번 호가 그렇다. 필청 자리는 비어 있다.</p>
        <p>이 잡지에는 몇 가지 고집이 있다. 앨범은 처음부터 끝까지 듣는 물건이라는 것. 곡이 아니라 곡 순서를, 하이라이트가 아니라 앞면과 뒷면을 본다는 것. 화제와 판매량과 다른 매체의 박수는 점수에 넣지 않는다는 것.</p>
        <p>첫 호에서 밝혀 둘 것이 있다. 이 지면의 편집부는 판을 직접 듣지 못한다. 그래서 소리에 대한 문장은 들은 사람들의 말을 옮기고, 그 출처를 뒤에 적는다. 우리가 하는 일은 확인한 사실을 쌓고 그 위에서 판단하는 것이다. 판단은 틀릴 수 있다. 그래서 점수마다 이유를 남긴다.</p>
        <p>이번 주 우리가 붙든 판은 U2의 열여섯 번째 정규 앨범이다. 9년 만의 새 노래들이고, 이 지면은 6.5를 줬다. 낮다고 느낄 독자도 있을 것이다. 6쪽부터 그 이유를 길게 적었다. 같은 날 다시 나온 1979년의 한 장도 함께 권한다. 새 판이 어디에 기대고 있는지 알고 싶다면, 거기서 시작하면 된다.</p>
        <p class="ni" style="font-family:var(--it);font-style:italic;font-size:3.6cqw;text-align:right;margin-top:3cqw">— 고한석</p>

<template class="sp"><div class="spread">
    <div class="pg L">
      <div class="rh"><span>Review · U2</span><span>Carnaval de Luz · 6.5</span></div>
      <div class="body2 cols" style="position:absolute;left:6cqw;right:6cqw;top:10cqw;bottom:38cqw;column-fill:balance;column-gap:3.6cqw;font-size:2.75cqw">
        <p class="drop">9년이다. U2가 새 노래로만 채운 정규 앨범을 내놓은 것이 그만큼 만이다. 올해 초의 EP 두 장 [Days of Ash]와 [Easter Lily]가 예고였다면, 이 판은 그보다 앞에 있던 축제의 밤을 그린다고 밴드는 설명한다. 열두 곡. 이 지면이 가장 먼저 반긴 숫자다.</p>
        <p>판은 'Go (Carnaval De Luz)'로 문을 연다. 브라이언 이노의 신시사이저 리프 위에 세운 곡이고, Riff는 그 에너지를 신경질적으로 떨린다고 적었다. 이노는 세 곡을 함께 썼고 대니얼 라노이도 이름을 올렸다. 전체를 다듬은 잭나이프 리는 2004년부터 밴드 곁에 있었다. 같은 사람들이 같은 방에 다시 모였다는 뜻이다.</p>
        <p>축제는 어디서 왔나. 밴드는 2006년 브라질 카니발에서 질베르투 질과 보낸 시간이 이 앨범의 씨앗이 됐다고 돌아봤다. 제목 그대로 빛의 축제다. 그런데 앨범을 발표하며 먼저 들려준 곡의 제목은 'Silencio', 침묵이다. 축제의 판에서 침묵이라는 이름을 단 곡을 먼저 내놓는 순서. 이 지면은 그 선택을 이 앨범에서 가장 흥미로운 대목으로 본다.</p>
      </div>
      <div style="position:absolute;left:6cqw;right:6cqw;bottom:11cqw;border-top:1.4cqw solid var(--pink);padding-top:3cqw;font-family:var(--body);font-weight:900;font-size:5.4cqw;line-height:1.3;letter-spacing:-.02em;color:var(--ink);word-break:keep-all">축제의 판에서, 침묵이라는 이름을 먼저 들려주다.</div><div class="folio">6</div>
    </div>
    <div class="pg R">
      <div class="photo" style="left:0;right:0;top:0;height:54cqw;background-image:url(/music/mag/issues/drop-01/7ab5b67d4d.jpg)"></div>
      <div class="cap" style="position:absolute;left:6cqw;right:6cqw;top:56cqw"><b>2023년 라스베이거스 스피어 공연.</b> 같은 밴드, 같은 사람들. 사진 cygenta / CC BY-NC-SA 2.0</div>
      <div class="body2" style="position:absolute;left:6cqw;right:6cqw;top:64cqw">
        <p class="ni">그 방이 어디를 향하는지는 평단에서도 갈린다. 아이리시 이그재미너는 30년 만의 최고작이라 했고, Riff는 [Achtung Baby]를 꺼냈다. 루더는 쉰 해 가까운 경력의 열여섯 번째 앨범에서 이만큼 깊이 파고드는 것 자체가 놀랍다고 썼다. 반대편에서 롤링스톤 브라질은 얕은 가사를 문제 삼으며 'The Mirror Maker (Rosalía)'를 가장 낮은 곳으로 꼽았다. 이 지면은 남의 점수를 빌리지 않는다. 다만 의견이 갈린 곳이 가사라는 사실은 적어 둔다.</p>
      </div>
      <div style="position:absolute;left:6cqw;right:6cqw;top:102cqw;font-family:var(--body);font-weight:900;font-size:5.6cqw;line-height:1.25;color:var(--blue);letter-spacing:-.02em"><span style="font-family:var(--it);font-style:italic;font-weight:400;font-size:11cqw;line-height:0;vertical-align:-3cqw;color:var(--pink)">“</span>그 방은 1991년을 닮았다.</div>

<template class="sp"><div class="spread">
    <div class="pg L">
      <div class="rh"><span>Review · U2</span><span>Carnaval de Luz · 6.5</span></div>
      <div class="body2 cols" style="position:absolute;left:6cqw;right:6cqw;top:10cqw;bottom:38cqw;column-fill:balance;column-gap:3.6cqw;font-size:2.75cqw">
        <p class="ni">구성을 보자. 열두 곡이고, 올해 초 EP 두 장의 이야기를 이어받는다고 밴드는 말한다. 그렇다면 이 판은 홀로 서는 작품인가, 3부작의 마지막 장인가. 이 지면은 앨범을 처음부터 끝까지 듣는 물건으로 본다. 앞의 두 장을 들어야 완성되는 판이라면, 그만큼 완결성 점수는 깎인다.</p>
        <p>마틴 개릭스가 'Glorify'를 함께 썼고, 로살리아의 이름이 곡 제목에 들어갔다. 이 밴드가 여전히 바깥의 새 이름을 방 안에 들이려 한다는 뜻이다. 다만 방의 주인은 그대로다.</p>
        <p>마지막 곡 'Torn'은 보노와 돌리 파튼의 이중창이다. 밴드는 이것이 파튼이 생전에 남긴 마지막 녹음이라고 밝혔다. 판의 무게중심이 끝에 놓인 셈이다.</p>
        <p>그래서 6.5다. 잘 만든 판이다. 열두 곡으로 끝낼 줄 아는 절제는 이 지면이 가장 높이 사는 덕목이고, 그 칸에는 7.5를 적었다. 그러나 10년 뒤에도 꺼낼지를 묻는 마지막 칸에는 5.5를 적었다. 그 칸을 채우는 것은 시간이지 우리가 아니다. 틀렸다면 10년 뒤의 Drop이 정정할 것이다.</p>
      </div>

        <p class="drop">브라이언 이노. 그는 자신을 연주자보다 '비음악가'라고 부르곤 했다. 1975년에는 화가 피터 슈미트와 함께, 작업이 막혔을 때 한 장씩 뽑아 보는 카드 [Oblique Strategies]를 만들었다. 1978년의 [Music for Airports]로는 '앰비언트'라는 말을 하나의 장르 이름으로 만들었다.</p>
        <p>그런 사람이 밴드의 방에 들어가면 무슨 일이 벌어지는가. 토킹 헤즈와는 1978년부터 1980년까지 세 장을 함께 만들었다. [Fear of Music]은 그 가운데 두 번째다. 이번 주 확장판으로 돌아온 바로 그 판이다.</p>
