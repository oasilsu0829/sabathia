<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어원 단어</title>
<meta name="description" content="능률보카 어원편 1,474단어를 간격 반복으로 외우는 앱">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&family=Hahmlet:wght@500;800&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 어원 단어 · 디자인 언어 v1.0
   흑백 표처럼 정렬하고, 파랑은 "평소"(오늘·진행·다음·정답), 빨강은 "문제"(오답·지연)에만.
   둥근 모서리·그림자·그라데이션·반투명 없음. 진행률 그래픽은 컨택트 맵 하나.
   Layout: 480px 단일 열. 화면 제목 → 탭 내용 → 하단 글자 탭바(오늘 · 시험 · 단어장 · 설정). 학습·시험·설정은 화면 전체를 덮는다 */
:root{
  --bg:#ffffff; --ink:#000000; --muted:#5c5c5c;
  --accent:#026395; --on-accent:#ffffff;
  --warn:#d1001f; --on-warn:#ffffff; --warn-text:#d1001f;
  --map-pending:#c4c4c4; --map-empty:#f0f0f0;
  --line-bold:3px; --line-thin:1px; --body-size:16px;
  --pad-x:20px; --gap-section:24px; --tab-h:56px;
  --font-title:'Hahmlet','Noto Serif KR',serif;
  --font-body:'Gothic A1','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --font-num:'Space Grotesk','Gothic A1',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#ffffff; --muted:#a3a3a3;
    --accent:#4fb3e0; --on-accent:#000000;
    --warn:#e4002b; --on-warn:#ffffff; --warn-text:#ff6b6b;
    --map-pending:#5a5a5a; --map-empty:#1c1c1c;
    --line-thin:2px; --body-size:17px;
    color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-theme="projector"]{
  --bg:#000000; --ink:#ffffff; --muted:#a3a3a3;
  --accent:#4fb3e0; --on-accent:#000000;
  --warn:#e4002b; --on-warn:#ffffff; --warn-text:#ff6b6b;
  --map-pending:#5a5a5a; --map-empty:#1c1c1c;
  --line-thin:2px; --body-size:17px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:var(--body-size);line-height:22px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;border-radius:0;padding:0}
input,select,textarea{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;
  padding-left:max(var(--pad-x),env(safe-area-inset-left,0px));padding-right:max(var(--pad-x),env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--tab-h) + 3px + 40px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column}

/* Sabathia 홈으로 돌아가는 줄 (모든 앱 공통) */
.sab{display:flex;align-items:center;justify-content:space-between;min-height:44px;font:700 12px/1 var(--font-num);letter-spacing:.06em;color:var(--ink);text-decoration:none}
.sab span{color:var(--muted)}

/* 화면 머리: 제목 · 연속 일수 | 시험 D-day 또는 암기 완료 수 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.page-title{font:800 44px/48px var(--font-title);margin:0;white-space:nowrap}
.streak{display:block;margin-top:4px;font:800 11px/14px var(--font-body);letter-spacing:.06em;color:var(--muted);min-height:14px}
.pill{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding-bottom:2px}
.pill small{font:800 11px/14px var(--font-body);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.pill b{margin-top:4px;font:700 36px/36px var(--font-num);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.soon b{color:var(--accent)}

/* 섹션 (예전 패널) */
.panel,.sec{margin-top:var(--gap-section)}
.panel h2,.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:var(--line-bold) solid var(--ink);padding:10px 0 6px;margin:0;
  font:800 24px/30px var(--font-title)}
.panel h2 small,.sec-head small{font:700 13px/18px var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.hint2,.note{font-size:13px;line-height:18px;color:var(--muted);margin:10px 0 0}
.empty{color:var(--muted);font-size:13px;line-height:18px;padding:14px 0;margin:0;border-bottom:var(--line-thin) solid var(--ink)}

/* 버튼: 검정 면 · 3px 선 */
.primary,.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:56px;padding:0 16px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px}
.primary:disabled{background:var(--muted)}
.ghost{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;border:var(--line-bold) solid var(--ink);font-weight:800;font-size:15px}
.ghost:disabled{color:var(--muted);border-color:var(--muted)}
.danger{min-height:48px;padding:0 16px;border:var(--line-bold) solid var(--ink);font-weight:800;font-size:15px}
.danger.arm{background:var(--warn);color:var(--on-warn);border-color:var(--warn)}
.textbtn{min-height:44px;font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:12px}
.row>*{flex:1}
.kb{display:none;font:500 11px/1 var(--font-num)}
@media (hover:hover) and (pointer:fine){.kb{display:inline}}

/* 선택 칩: 파랑은 테두리만 */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:var(--line-thin) solid var(--ink);font-weight:500;font-size:14px}
.chip small{font:700 12px/1 var(--font-num);color:var(--muted)}
.chip[aria-pressed="true"]{border:2px solid var(--accent);color:var(--accent);font-weight:800;padding:0 11px}
.chip[aria-pressed="true"] small{color:var(--accent)}
.in{width:100%;min-height:44px;padding:10px;border:var(--line-thin) solid var(--ink);background:var(--bg);font-size:16px;line-height:22px}
.in::placeholder{color:var(--muted)}
select.in{appearance:none;-webkit-appearance:none;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 11px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.range{display:flex;align-items:center;gap:8px;margin-top:12px}
.range span{color:var(--muted);flex:none;font-family:var(--font-num)}
.range select{flex:1}
.pos{font-style:normal;font:800 11px/1 var(--font-body);letter-spacing:.06em;color:var(--muted);margin:0 4px 0 2px;vertical-align:1px}

/* 어근 */
.mo{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.mo b{font:800 20px/26px var(--font-title)}
.mo em{font-style:normal;font-size:12px;line-height:16px;color:var(--muted)}
.plus{color:var(--muted);font:500 16px/26px var(--font-num);margin:0 8px;align-self:flex-start}
.roots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:4px 0}
.roots.sm .mo{flex-direction:row;align-items:baseline;gap:4px}
.roots.sm .mo b{font-size:15px;line-height:20px}
.roots.sm .plus{font-size:13px;line-height:20px;margin:0 6px;align-self:center}

/* 컨택트 맵 */
.cmap{display:block;flex:none;shape-rendering:crispEdges}
.cmap .f{fill:var(--accent)}
.cmap .p{fill:var(--map-pending)}
.cmap .e{fill:var(--map-empty)}

/* 오늘 */
.todo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:8px}
.stat{font:700 52px/44px var(--font-num);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat small{font:800 13px/18px var(--font-body);letter-spacing:0;margin-left:4px}
.split{display:flex;gap:20px;margin-top:14px}
.split div{display:flex;flex-direction:column}
.split b{font:700 28px/28px var(--font-num);font-variant-numeric:tabular-nums}
.split span{font:800 11px/14px var(--font-body);letter-spacing:.06em;color:var(--muted);margin-top:4px}
.hero .primary,.hero .row{margin-top:16px}
.prog{display:flex;align-items:flex-start;gap:20px;padding-top:12px}
.nums{flex:1;margin:0}
.nums div{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:var(--line-thin) solid var(--ink)}
.nums dt{font-weight:800;font-size:13px}
.nums dd{margin:0;font:700 15px/22px var(--font-num);font-variant-numeric:tabular-nums}
.nums .is-done dd{color:var(--accent)}
/* Day 칸: 60개를 10열로. 파랑 = 절반 이상 암기, 회색 = 익히는 중, 연한 칸 = 아직 안 봄 */
.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;margin-top:16px}
.days button{aspect-ratio:1;min-height:30px;display:grid;place-items:center;background:var(--map-empty);font:700 11px/1 var(--font-num);font-variant-numeric:tabular-nums;color:var(--muted)}
.days .p{background:var(--map-pending);color:var(--ink)}
.days .f{background:var(--accent);color:var(--on-accent)}
.days button[aria-pressed="true"]{box-shadow:inset 0 0 0 var(--line-bold) var(--ink)}
.days .f[aria-pressed="true"]{box-shadow:inset 0 0 0 var(--line-bold) var(--ink),inset 0 0 0 5px var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12px;line-height:16px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;display:inline-block;background:var(--map-empty)}
.sw.p{background:var(--map-pending)}
.sw.f{background:var(--accent)}
/* 다가오는 복습: 주간 줄. 오늘 칸만 파랑 면 */
.fcast{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:6px}
.fcast div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.fcast span{font:800 11px/14px var(--font-body);letter-spacing:.06em;color:var(--muted)}
.fcast b{font:700 19px/22px var(--font-num);font-variant-numeric:tabular-nums}
.fcast div:first-child{background:var(--accent);color:var(--on-accent)}
.fcast div:first-child span{color:var(--on-accent)}
.foot{display:flex;justify-content:center;margin-top:16px}

/* 시험 */
.tdesc{font-size:13px;line-height:18px;color:var(--muted);margin:10px 0 0}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:12px 0;border-bottom:var(--line-thin) solid var(--ink);font-size:13px;line-height:18px}
.hist b{font:700 19px/22px var(--font-num);font-variant-numeric:tabular-nums}
.hist span{font-weight:800;min-width:0}
.hist em{font:500 13px/18px var(--font-num);font-style:normal;color:var(--muted);white-space:nowrap}
.startbar{margin-top:var(--gap-section)}

/* 단어장 */
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:var(--line-bold) solid var(--ink);padding-top:10px}
.dhead .nixie{font:700 36px/36px var(--font-num);letter-spacing:-.03em}
.lbl{font:800 11px/14px var(--font-body);letter-spacing:.06em;color:var(--muted)}
.droots{font-size:13px;line-height:18px;color:var(--muted);margin:8px 0 12px}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 0;border-bottom:var(--line-thin) solid var(--ink)}
.wtop{display:flex;align-items:baseline;gap:8px;min-width:0}
.ww{font:800 22px/28px var(--font-title);text-align:left;overflow-wrap:anywhere}
.wn{font:500 12px/16px var(--font-num);color:var(--muted);font-variant-numeric:tabular-nums}
.wm{grid-column:1/-1;font-size:15px;line-height:22px}
.wr{grid-column:1/-1;margin-top:4px}
.wr .roots{justify-content:flex-start}
.sdot{width:12px;height:12px;align-self:center;background:var(--map-empty)}
.sdot.s1{background:var(--map-pending)}
.sdot.s2{background:var(--accent)}
.search{margin-top:var(--gap-section)}

/* 학습 · 시험 화면 */
.stage{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.st-top,.st-body{width:100%;max-width:480px;margin:0 auto;padding-left:max(var(--pad-x),env(safe-area-inset-left,0px));padding-right:max(var(--pad-x),env(safe-area-inset-right,0px))}
.st-top{display:flex;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
.st-top>*{padding-bottom:10px}
.st-top{border-bottom:var(--line-bold) solid var(--ink)}
.st-close{min-height:44px;font-weight:800;font-size:14px;padding-bottom:10px}
.st-prog{flex:1;display:flex;justify-content:center;align-items:center;min-height:44px}
.st-count{min-width:72px;text-align:right;font:700 19px/22px var(--font-num);font-variant-numeric:tabular-nums}
.st-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.fc{flex:1;min-height:280px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.fc-meta{display:flex;gap:6px;align-self:stretch;justify-content:space-between;align-items:center;min-height:44px}
.fc-meta .tags{display:flex;gap:10px;align-items:center}
.tag{font:700 12px/16px var(--font-num);letter-spacing:.04em}
.tag.plain{color:var(--muted)}
.tag.new{font:800 11px/16px var(--font-body);letter-spacing:.06em;border:2px solid var(--accent);color:var(--accent);padding:0 3px}
.spk{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.fc-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
.word{font:800 clamp(40px,12vw,64px)/1.05 var(--font-title);overflow-wrap:anywhere}
.word.sm{font-size:clamp(30px,9vw,44px)}
.mean{font-size:18px;line-height:27px;font-weight:500;max-width:34em}
.mean.lg{font-size:20px;line-height:30px;font-weight:800}
.pattern{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.pattern b{font:700 clamp(22px,7vw,30px)/1.2 var(--font-num);letter-spacing:.2em;white-space:nowrap;padding-left:.2em;color:var(--ink)}
.pattern small{font-size:12px}
.reveal{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.divider{width:44px;height:var(--line-bold);background:var(--ink)}
.acts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.acts.three{grid-template-columns:repeat(3,1fr)}
.acts.one{grid-template-columns:1fr}
.acts .primary,.acts .ghost,.gbtn{min-height:56px;width:100%}
.gbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;border:var(--line-bold) solid var(--ink);font-weight:800;font-size:15px;line-height:20px}
.gbtn small{font:500 11px/14px var(--font-num)}
.gbtn.g2{background:var(--ink);color:var(--bg)}
.spell-in{min-height:56px;font-size:22px;text-align:center;font-family:var(--font-num)}
.verdict{font:800 12px/20px var(--font-body);letter-spacing:.06em;padding:0 6px}
.verdict.ok{border:2px solid var(--accent);color:var(--accent);line-height:16px;padding:0 5px}
.verdict.no{background:var(--warn);color:var(--on-warn)}
.verdict.near{border:2px solid var(--ink);line-height:16px;padding:0 5px}
.yours{font-size:14px;color:var(--muted)}
.yours s{color:var(--ink)}
.opts{display:flex;flex-direction:column;border-top:var(--line-bold) solid var(--ink)}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;text-align:left;border-bottom:var(--line-thin) solid var(--ink);font-size:15px;line-height:21px}
.opt .k{flex:none;width:26px;height:26px;display:grid;place-items:center;border:var(--line-thin) solid var(--ink);font:700 13px/1 var(--font-num)}
.opt .w{font:800 22px/28px var(--font-title)}
.opt.right{font-weight:800}
.opt.right .k{border:2px solid var(--accent);color:var(--accent)}
.opt.wrong .k{background:var(--warn);border-color:var(--warn);color:var(--on-warn)}
.opt.fade{color:var(--muted)}
.opt:disabled{cursor:default}
.end{display:flex;flex-direction:column;gap:20px}
.end .panel{margin-top:0}
.score{display:flex;align-items:baseline;gap:8px;padding-top:8px}
.dval{font:700 52px/44px var(--font-num);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dval small{font:800 13px/18px var(--font-body);letter-spacing:0;margin-left:4px}
.score .dval{font-size:96px;line-height:80px}
.score .of{font:700 28px/28px var(--font-num);color:var(--muted)}
.sumline{display:flex;gap:24px;margin-top:16px;flex-wrap:wrap}
.sumline div{display:flex;flex-direction:column}
.sumline b{font:700 28px/28px var(--font-num);font-variant-numeric:tabular-nums}
.sumline span{font:800 11px/14px var(--font-body);letter-spacing:.06em;color:var(--muted);margin-top:4px}

/* 시트: 화면 전체를 덮는다 */
.sheet-wrap{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.scrim{display:none}
.sheet{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(var(--pad-x),env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(var(--pad-x),env(safe-area-inset-left,0px))}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:var(--line-bold) solid var(--ink);padding-bottom:10px}
.sh-head h2{font:800 24px/30px var(--font-title);margin:0}
.close{min-height:44px;font-weight:800;font-size:14px}
.sheet .f{display:block;margin:20px 0}
.sheet .f>span{display:block;font:800 12px/16px var(--font-body);letter-spacing:.06em;margin-bottom:8px}
.sheet .f small{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:8px}
.sheet .f.tg{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:var(--line-thin) solid var(--ink)}
.sheet .f.tg>span{margin:0;font:800 15px/22px var(--font-body);letter-spacing:0}
.sheet .f.tg>span small{margin-top:2px;font-weight:500}
.tog{position:relative;width:52px;height:30px;flex:none;border:var(--line-bold) solid var(--ink)}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:var(--ink)}
.tog[aria-pressed="true"]{background:var(--ink)}
.tog[aria-pressed="true"]::after{left:auto;right:3px;background:var(--bg)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:56px;height:56px;border:var(--line-bold) solid var(--ink);font:700 24px/1 var(--font-num)}
.stepper output{flex:1;text-align:center;font:700 52px/44px var(--font-num);letter-spacing:-.04em}
.sh-foot{display:flex;gap:12px;margin-top:24px}
.sh-foot .primary{flex:1}
.method{margin:6px 0 0;padding:0;list-style:none;counter-reset:m}

function fresh(){ return {v:2, updatedAt:0, set:{perDay:20, spell:true, speak:false, start:0, ok:false, test:null, exam:{on:true, date:'2026-10-16', from:30, to:44}}, c:{}, log:{}, tests:[]}; }
function normalize(s){
  const f = fresh(); if(!s || typeof s !== 'object') return f;
  s.set = Object.assign(f.set, s.set || {}); s.c = s.c && typeof s.c === 'object' ? s.c : {};
  s.log = s.log && typeof s.log === 'object' ? s.log : {}; s.tests = Array.isArray(s.tests) ? s.tests.slice(-30) : [];
  if(!(s.set.start >= 0 && s.set.start < DAYS.length)) s.set.start = 0;
  if(!(s.v >= 2)) migrate46(s);

}
/* v2: Day 46·47 단어를 시험 범위 목록으로 바꿈(26·25개 → 79·76개). 단어 번호가 곧 기록 키라서
   옛 Day 46·47 기록은 지우고, Day 48부터는 늘어난 개수만큼 번호를 밀어 기록을 그대로 둔다 */
function migrate46(s){
  const lo = DAYS[45].ids[0], oldHi = lo + 26 + 25, shift = DAYS[45].ids.length + DAYS[46].ids.length - 51;
  const mv = id => id < lo ? id : id < oldHi ? null : id + shift;
  const c = {};
  for(const k in s.c){ const id = mv(+k.slice(1)); if(id != null) c['k' + id] = s.c[k]; }
  s.c = c;
  s.tests.forEach(h => { if(h.wrong) h.wrong = String(h.wrong).split(',').filter(Boolean).map(Number).map(mv).filter(x => x != null).join(','); });
  s.v = 2;
}

const CLOUD = {projectId:'p15577', apiKey:'AIzaSyCMxJrxsFFEh9A9gDmbT4_rda9XLo8JgPE'};
const CLOUD_KEY = 'eowon.vocab.cloudId', ID_RE = /^[a-z0-9_-]{3,22}$/;
let cloudId = null, cloudAt = 0, cloudDirty = false, cloudBusy = false, cloudErr = '', cloudPending = null, cloudT = null;

const cloudUrl = id => `https://firestore.googleapis.com/v1/projects/${CLOUD.projectId}/databases/(default)/documents/planners/v-${id}?key=${CLOUD.apiKey}`;
async function cloudGet(id){
  const r = await fetch(cloudUrl(id), {cache:'no-store'});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('get ' + r.status);
  const f = (await r.json()).fields || {};
  return f.data ? JSON.parse(f.data.stringValue) : null;
}
async function cloudPut(id, data){
  const body = {fields:{data:{stringValue:JSON.stringify(data)}, updatedAt:{integerValue:String(data.updatedAt || 0)}}};
  const r = await fetch(cloudUrl(id), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error('put ' + r.status);
}
function cloudQueue(){ if(!cloudId) return; cloudDirty = true; clearTimeout(cloudT); cloudT = setTimeout(cloudPush, 1500); paintCloud(); }

/* ---------- 카드: [단계, 복습일, 틀린 횟수, 복습 횟수, 마지막 학습일, 시험 오답 수] ---------- */
const card = id => S.c['k' + id];
const setCard = (id, c) => { S.c['k' + id] = c; };
function status(id){ const c = card(id); if(!c || c[0] < 1) return 0; return c[0] >= MASTER ? 2 : 1; }
function lg(t){ const k = 'd' + t; return S.log[k] || (S.log[k] = {n:0, r:0, ok:0}); }
function logOf(t){ return S.log['d' + t] || {n:0, r:0, ok:0, nx:0}; }
/* ---------- 영어 시험 대비 ---------- */
function examInfo(){
  const e = S.set.exam; if(!e || !e.on || !e.date) return null;
  const p = String(e.date).split('-').map(Number); if(p.length !== 3 || p.some(isNaN)) return null;
  const day = Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 864e5), t = today(); if(t > day) return null;
  const a = Math.min(e.from, e.to), b = Math.max(e.from, e.to), lo = DAYS[a].ids[0], hi = DAYS[b].ids[DAYS[b].ids.length - 1];
  return {day, left:day - t, a, b, lo, hi, n:hi - lo + 1, deadline:day - 5, m:p[1], d:p[2]};
}
const inEx = (E, id) => !!E && id >= E.lo && id <= E.hi;
function unseenRange(E){ let n = 0; for(let i = E.lo; i <= E.hi; i++) if(!card(i)) n++; return n; }
/* 시험 범위 단어는 시험 날까지 남은 기간의 절반을 넘지 않게, 늦어도 시험 전날엔 다시 나오게 */
function capDue(id, t, due){
  const E = examInfo(); if(!inEx(E, id) || t >= E.day - 1) return due;
  return Math.min(due, t + Math.max(1, Math.ceil((E.day - t) / 2)), E.day - 1);
}
function examQuota(E, t){
  const un = unseenRange(E); if(!un) return 0;
  const L = logOf(t), days = Math.max(1, E.deadline - t + 1);
  return Math.max(0, Math.ceil((un + (L.nx || 0)) / days) - (L.nx || 0));
}
function dueIds(t){ const out = []; for(const k in S.c){ const c = S.c[k]; if(c[0] >= 1 && c[1] <= t) out.push(+k.slice(1)); } return out; }
function unseen(){ let n = 0; for(let i = 0; i < W.length; i++) if(!card(i)) n++; return n; }
/* 시험 대비 중엔 범위 단어만 새로 내주고, 범위를 다 봤으면 시험 날까지 새 단어 없이 복습만 */
function newLeft(t){ const E = examInfo(); if(E && E.left > 0) return unseenRange(E) ? examQuota(E, t) : 0; return Math.max(0, S.set.perDay - logOf(t).n); }
function newAvail(){ const E = examInfo(); return E && E.left > 0 && unseenRange(E) ? unseenRange(E) : unseen(); }
function newIds(n, skip){
  const out = []; if(n <= 0) return out;
  const ok = i => !card(i) && !(skip && skip.has(i));
  const E = examInfo();
  if(E && E.left > 0 && unseenRange(E)){ for(let i = E.lo; i <= E.hi && out.length < n; i++) if(ok(i)) out.push(i); return out; }
  const start = DAYS[S.set.start].ids[0];
  for(let i = start; i < W.length && out.length < n; i++) if(ok(i)) out.push(i);
  for(let i = 0; i < start && out.length < n; i++) if(ok(i)) out.push(i);
  return out;
}
function nextNewDay(){ const x = newIds(1); return x.length ? W[x[0]].d : null; }
function counts(){ let l = 0, m = 0; for(const k in S.c){ const s = S.c[k][0]; if(s >= MASTER) m++; else if(s >= 1) l++; } return [W.length - l - m, l, m]; }
function dayStats(d){ let l = 0, m = 0; for(const id of DAYS[d].ids){ const s = status(id); if(s === 2) m++; else if(s === 1) l++; } const n = DAYS[d].ids.length; return {n, l, m, pm: m / n * 100, pl: l / n * 100}; }
function streak(){ const act = d => { const L = S.log['d' + d]; return L && (L.n + L.r) > 0; }; let k = today(); if(!act(k)) k--; let n = 0; while(act(k)){ n++; k--; } return n; }
function wrongIds(){
  return Object.keys(S.c).map(k => [+k.slice(1), S.c[k]]).filter(([, c]) => (c[2] || 0) + (c[5] || 0) > 0)
    .sort((a, b) => ((b[1][2] || 0) + (b[1][5] || 0)) - ((a[1][2] || 0) + (a[1][5] || 0)) || a[0] - b[0]).map(x => x[0]);
}
function fuzz(d){ if(d < 7) return d; const f = Math.round(d * .1); return d - f + Math.floor(Math.random() * (2 * f + 1)); }
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* 같은 Day(같은 어근) 단어가 연달아 나오지 않게 흩뜨림 */
function spread(a){
  for(let i = 1; i < a.length; i++){
    if(W[a[i]].d !== W[a[i - 1]].d) continue;
    for(let j = i + 1; j < a.length; j++) if(W[a[j]].d !== W[a[i - 1]].d){ [a[i], a[j]] = [a[j], a[i]]; break; }
  }
  return a;
}

/* ---------- 표시 도우미 ---------- */
/* 컨택트 맵 (디자인 언어 5장): 대각선 띠 + 이름 해시로 뽑은 대칭 접촉점. 진행률만큼 대각선부터 채움 */
function contactMap(seed, n, pct){
  let h = 7;
  for(const ch of seed) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const set = new Set();
  for(let i = 0; i < n; i++) for(let j = 0; j < n; j++) if(Math.abs(i - j) <= 1) set.add(i + ',' + j);
  for(let t = 0; t < n; t++){ const a = Math.floor(rnd() * n), b = Math.floor(rnd() * n); if(Math.abs(a - b) >= 2){ set.add(a + ',' + b); set.add(b + ',' + a); } }
  const order = [...set].map(k => k.split(',').map(Number)).sort((p, q) => Math.abs(p[0] - p[1]) - Math.abs(q[0] - q[1]) || Math.min(...p) - Math.min(...q) || p[0] - q[0]);
  const filled = new Set(order.slice(0, Math.round(order.length * pct / 100)).map(c => c.join(',')));
  return {set, filled};
}
function mapSVG(seed, n, pct, cell, label){
  const {set, filled} = contactMap(seed, n, pct), g = 2, w = n * cell + (n - 1) * g;
  let r = '';
  for(let i = 0; i < n; i++) for(let j = 0; j < n; j++){ const k = i + ',' + j; r += `<rect class="${filled.has(k) ? 'f' : set.has(k) ? 'p' : 'e'}" x="${j * (cell + g)}" y="${i * (cell + g)}" width="${cell}" height="${cell}"/>`; }
  return `<svg class="cmap" viewBox="0 0 ${w} ${w}" width="${w}" height="${w}" role="img" aria-label="${esc(label)}">${r}</svg>`;
}
function fmtM(m){ return esc(m).replace(/(^|\s)(n|v|a|ad|prep)\.\s/g, (x, p, pos) => `${p}<i class="pos">${pos}</i>`); }
function rootHTML(r, sm){
  if(!r) return '';
  return `<div class="roots${sm ? ' sm' : ''}">` + r.split(' + ').map(p => {
    const s = p.indexOf(' '); const mo = s < 0 ? p : p.slice(0, s), gl = s < 0 ? '' : p.slice(s + 1);
    return `<span class="mo"><b>${esc(mo)}</b>${gl ? `<em>${esc(gl)}</em>` : ''}</span>`;
  }).join('<span class="plus">+</span>') + '</div>';
}
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function speak(w){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); }catch(e){} }
function spkBtn(id){ return canSpeak ? `<button class="spk" data-act="speak" data-id="${id}" aria-label="발음 듣기">${IC.spk}</button>` : ''; }
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g, ' '); }
function lev(a, b){
  if(Math.abs(a.length - b.length) > 1) return 2;
  const d = []; for(let i = 0; i <= a.length; i++){ d[i] = [i]; }
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
/* depend (up)on 처럼 괄호가 있으면 넣은 것·뺀 것 모두 정답 */
function judge(inp, w){
  const a = norm(inp); if(!a) return 0;
  const bs = [...new Set([w, w.replace(/[()]/g, ''), w.replace(/\(.*?\)/g, '')].map(norm))];
  if(bs.includes(a)) return 2; return bs.some(b => lev(a, b) === 1) ? 1 : 0;
}
function pattern(w){ return `<b>${esc(w[0])}${esc(w.slice(1).replace(/[^ ()]/g, '_'))}</b><small>${w.replace(/[ ()]/g, '').length}글자</small>`; }
function theme(v){ const r = document.documentElement; if(v === 'light' || v === 'dark') r.setAttribute('data-theme', v); else r.removeAttribute('data-theme'); }
function getTheme(){ try{ return localStorage.getItem(LS_THEME) || 'auto'; }catch(e){ return 'auto'; } }

/* Day 칸: 절반 이상 암기면 파랑, 하나라도 익히는 중이면 회색 */
function dayCell(d, s, act){
  const lv = s.pm >= 50 ? 'f' : s.pm + s.pl > 0 ? 'p' : '';
  return `<button class="${lv}" data-act="${act}" data-d="${d}" aria-label="${DN(d)}, ${s.n}개 중 암기 ${s.m}, 익히는 중 ${s.l}"${act === 'selDay' ? ` aria-pressed="${SEL_DAY === d}"` : ''}>${DD(d)}</button>`;

const LEGEND = '<div class="legend"><span><i class="sw f"></i>절반 이상 암기</span><span><i class="sw p"></i>익히는 중</span><span><i class="sw"></i>아직 안 봄</span></div>';
function numsHTML(m, l, u){

}
function vToday(){
  const t = today(), due = dueIds(t).length, nl = Math.min(newLeft(t), newAvail()), L = logOf(t), E = examInfo();
  const total = due + nl, done = L.n + L.r, started = done > 0, nd = nextNewDay();
  const pctToday = done + total ? done / (done + total) * 100 : 100;

  if(total > 0){
    let note = nl > 0 && nd != null ? (E && nd >= E.a && nd <= E.b ? `새 단어는 시험 범위에서 번호순으로, 오늘은 <b>${DN(nd)}</b>부터 나와요. 복습 사이사이에 섞여서 나옵니다.` : `새 단어는 <b>${DN(nd)}</b>부터 번호순으로 나와요. 복습 사이사이에 섞여서 나옵니다.`) : '오늘은 복습만 있어요.';
    if(due >= 80) note = `밀린 복습이 <b>${due}개</b>예요. 새 단어를 줄이고 복습부터 비우는 게 효율적이에요. 중간에 닫아도 진행한 만큼 저장돼요.`;
    hero = `<section class="panel hero"><h2>오늘 할 단어<small>${done} / ${done + total}</small></h2>
      <div class="todo"><div><div class="stat">${total}<small>개 남음</small></div>

      <p class="hint2">${note}</p>
      <button class="primary" data-act="study">${started ? '이어서 하기' : '학습 시작'}</button></section>`;

        <div class="split"><div><b>${L.r}</b><span>복습</span></div><div><b>${L.n}</b><span>새 단어</span></div></div></div>
        ${mapSVG('어원 단어', 7, 100, 8, '오늘 100퍼센트 진행')}</div>
      <p class="hint2">${unseen() ? '더 하고 싶으면 새 단어를 추가로 익히거나, 틀렸던 단어로 시험을 볼 수 있어요.' : '1,474개를 모두 한 번 이상 익혔어요. 이제는 복습 일정만 따라가면 돼요.'}</p>
      <div class="row">${unseen() ? '<button class="ghost" data-act="more">새 단어 10개 더</button>' : ''}<button class="ghost" data-act="wrongTest">오답 노트 시험</button></div></section>`;
  }
  let days = '';
  for(let d = 0; d < DAYS.length; d++) days += dayCell(d, dayStats(d), 'gotoDay');
  const fc = [0, 0, 0, 0, 0, 0, 0];
  for(const k in S.c){ const c = S.c[k]; if(c[0] < 1) continue; const x = Math.max(0, c[1] - t); if(x < 7) fc[x]++; }
  const fcHTML = fc.map((n, i) => { const d = new Date((t + i) * 864e5); const lab = i === 0 ? '오늘' : i === 1 ? '내일' : WEEK[d.getUTCDay()]; return `<div><span>${lab}</span><b>${n}</b></div>`; }).join('');

    <div class="days">${days}</div>${LEGEND}

function examPanel(t){
  const E = examInfo(); if(!E) return '';
  let m = 0, l = 0; for(let i = E.lo; i <= E.hi; i++){ const s = status(i); if(s === 2) m++; else if(s === 1) l++; }
  const u = E.n - m - l;
  const dl = new Date(E.deadline * 864e5), dlTxt = `${dl.getUTCMonth() + 1}월 ${dl.getUTCDate()}일`;
  let pace;
  if(E.left === 0) pace = '오늘이 시험이에요. 시험 탭에서 시험 범위로 뜻 고르기를 한 번 훑어보세요.';
  else if(u === 0) pace = '범위 단어를 모두 한 번씩 봤어요. 이제 복습 간격이 시험 날에 맞춰 점점 좁아지고, 시험 전날엔 범위 단어가 한 번씩 다시 나와요.';
  else if(t <= E.deadline){ const per = Math.ceil((u + (logOf(t).nx || 0)) / Math.max(1, E.deadline - t + 1)); pace = `남은 ${u}개를 하루 ${per}개 안팎으로 ${dlTxt}까지 한 번씩 다 보고, 그 뒤 닷새는 복습만 해요. 복습 간격은 시험 날에 맞춰 알아서 좁혀요.`; }
  else pace = `남은 ${u}개를 오늘 다 봐야 시험 전에 복습할 시간이 생겨요.`;
  return `<section class="panel"><h2>영어 시험<small>${String(E.m).padStart(2, '0')}.${String(E.d).padStart(2, '0')} · Day ${DD(E.a)}–${DD(E.b)}</small></h2>
    <div class="prog">${mapSVG('영어 시험', 7, m / E.n * 100, 8, `시험 범위 암기 ${Math.round(m / E.n * 100)}퍼센트`)}${numsHTML(m, l, u)}</div>
    <p class="hint2">${pace}</p></section>`;
}

/* ---------- 시험 설정 ---------- */
function T(){
  if(!S.set.test){ const d = S.set.start; S.set.test = {scope:examInfo() ? 'exam' : 'range', from:Math.max(0, d - 1), to:d, type:'mcq', n:30, order:'shuffle'}; }
  if(S.set.test.scope === 'exam' && !examInfo()) S.set.test.scope = 'range';
  return S.set.test;
}
function testIds(c){
  let ids = [];
  const E = examInfo();
  if(c.scope === 'exam' && E){ for(let i = E.lo; i <= E.hi; i++) ids.push(i); }
  else if(c.scope === 'all') ids = W.map(x => x.id);
  else if(c.scope === 'studied') ids = Object.keys(S.c).map(k => +k.slice(1)).sort((a, b) => a - b);
  else if(c.scope === 'wrong') ids = wrongIds();
  else { const a = Math.min(c.from, c.to), b = Math.max(c.from, c.to); for(let d = a; d <= b; d++) ids.push(...DAYS[d].ids); }
  return ids;
}
function scopeLabel(c){
  if(c.scope === 'exam') return '시험 범위';
  if(c.scope === 'all') return '전체';
  if(c.scope === 'studied') return '학습한 단어';
  if(c.scope === 'wrong') return '오답 노트';
  const a = Math.min(c.from, c.to), b = Math.max(c.from, c.to);
  return a === b ? DN(a) : `Day ${DD(a)}~${DD(b)}`;
}
function chip(k, v, label, cur, extra){ return `<button class="chip" data-act="tset" data-k="${k}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${label}${extra ? ` <small>${extra}</small>` : ''}</button>`; }

    ${c.scope === 'range' ? `<div class="range"><select class="in" id="tFrom" aria-label="시작 Day">${sel(c.from)}</select><span>~</span><select class="in" id="tTo" aria-label="끝 Day">${sel(c.to)}</select></div>` : ''}
  </section>
  <section class="panel"><h2>유형</h2>
    <div class="chips">${Object.keys(TYPE).map(k => chip('type', k, TYPE[k], c.type)).join('')}</div>
    <p class="tdesc">${TYPE_DESC[c.type]}</p>
  </section>
  <section class="panel"><h2>문항 수<small>범위 안 ${pool}개</small></h2>
    <div class="chips">${[20, 30, 50, 100].map(n => chip('n', n, n + '문항', c.n)).join('')}${chip('n', 'all', '전부', c.n)}</div>
    <div class="chips" style="margin-top:10px">${chip('order', 'shuffle', '섞어서', c.order)}${chip('order', 'seq', '번호순', c.order)}</div>

  <button class="primary startbar" data-act="startTest" ${nq ? '' : 'disabled'}>${nq ? `${nq}문항 시험 보기` : (c.scope === 'wrong' ? '아직 틀린 단어가 없어요' : '범위에 단어가 없어요')}</button>

  ${hist ? `<section class="panel"><h2>최근 시험</h2><div class="hist">${hist}</div></section>` : ''}`;

/* ---------- 학습 세션 ---------- */
let SES = null, TS = null, KEY = null, AUTO = null;
function openStage(){ $('#stage').hidden = false; document.body.classList.add('lock'); }
function closeStage(){
  clearTimeout(AUTO); $('#stage').hidden = true; document.body.classList.remove('lock');
  SES = null; TS = null; KEY = null; if(canSpeak) try{ speechSynthesis.cancel(); }catch(e){}
  render();
}
function setProg(done, total){ const p = total ? done / total * 100 : 0; $('#stBar').innerHTML = mapSVG('학습', 5, p, 6, `${Math.round(p)}퍼센트 진행`); $('#stCount').textContent = `${done} / ${total}`; }
function reviewMode(id){ const c = card(id); return S.set.spell && c && c[0] >= 2 && Math.random() < .4 ? 'spell' : 'rec'; }
function buildQueue(nNew){
  const t = today(), rev = spread(shuffle(dueIds(t))), nw = newIds(nNew);
  const q = []; let ri = 0, ni = 0;
  while(ri < rev.length || ni < nw.length){
    for(let k = 0; k < 2 && ri < rev.length; k++, ri++){
      const id = rev[ri], c = card(id);
      /* 시험에서 틀려서 들어온, 아직 한 번도 익히지 않은 단어는 새 단어처럼 먼저 보여 줌 */
      q.push(c && !c[3] ? {id, mode:'learn', isNew:true} : {id, mode:reviewMode(id)});
    }
    if(ni < nw.length) q.push({id:nw[ni++], mode:'learn', isNew:true});
  }
  return q;
}
function startStudy(nNew){
  const q = buildQueue(nNew == null ? Math.min(newLeft(today()), newAvail()) : nNew);
  if(!q.length){ toast('지금 할 단어가 없어요'); return; }
  SES = {q, i:0, st:{}, fin:0, total:new Set(q.map(x => x.id)).size, ok1:0, rev:0, nw:0, known:0, inQ:new Set(q.map(x => x.id))};
  openStage(); showCard();
}
function reinsert(item, gap){ SES.q.splice(Math.min(SES.q.length, SES.i + 1 + gap), 0, item); }
function metaHTML(x, extra){ return `<div class="fc-meta"><div class="tags">${extra || ''}<span class="tag">${DN(x.d)}</span><span class="tag plain">${NUM(x.id)}</span></div>${spkBtn(x.id)}</div>`; }
function body(html){ const b = $('#stBody'); b.innerHTML = html; b.scrollTop = 0; }
function showCard(){
  clearTimeout(AUTO);
  if(SES.i >= SES.q.length) return endStudy();
  setProg(SES.fin, SES.total);
  const it = SES.q[SES.i], x = W[it.id];
  it.revealed = false; it.hint = false; it.checked = false;
  if(it.mode === 'learn') return renderLearn(it, x);
  if(it.mode === 'spell') return renderSpell(it, x, false);
  renderRec(it, x);
}
function renderLearn(it, x){
  body(`<div class="fc rim">${metaHTML(x, '<span class="tag new">새 단어</span>')}
    <div class="fc-main"><div class="word">${esc(x.w)}</div>${rootHTML(x.r)}<div class="divider"></div><div class="mean lg">${fmtM(x.m)}</div></div>
    <p class="hint2" style="margin:0">어근의 뜻을 이어서 단어 뜻을 한 문장으로 만들어 보세요. 몇 장 뒤에 가린 채로 다시 물어봐요.</p></div>
    <div class="acts"><button class="ghost" data-act="known">이미 알아요 <span class="kb">(K)</span></button><button class="primary" data-act="learned">봤어요 <span class="kb">(Space)</span></button></div>`);
  if(S.set.speak) speak(x.w);
  KEY = e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); ACT.learned(); } else if(e.key === 'k' || e.key === 'K') ACT.known(); };
}
function renderRec(it, x){
  const rev = it.revealed;
  body(`<div class="fc rim">${metaHTML(x, it.isNew ? '<span class="tag new">새 단어</span>' : '')}
    <div class="fc-main"><div class="word">${esc(x.w)}</div>
    ${rev ? `<div class="reveal"><div class="mean lg">${fmtM(x.m)}</div><div class="divider"></div>${rootHTML(x.r)}</div>`
          : (it.hint ? `<div class="reveal">${rootHTML(x.r)}</div>` : '<p class="hint2" style="margin:0">뜻을 먼저 떠올린 다음 확인하세요.</p>')}</div></div>
    ${rev ? `<div class="acts three"><button class="gbtn g0" data-act="grade" data-g="0">몰랐어<small class="kb">1</small></button><button class="gbtn" data-act="grade" data-g="1">헷갈렸어<small class="kb">2</small></button><button class="gbtn g2" data-act="grade" data-g="2">알았어<small class="kb">3</small></button></div>`
          : `<div class="acts">${it.hint ? '<button class="ghost" disabled>힌트 봄</button>' : '<button class="ghost" data-act="hint">어원 힌트 <span class="kb">(H)</span></button>'}<button class="primary" data-act="reveal">뜻 확인 <span class="kb">(Space)</span></button></div>`}`);
  if(S.set.speak && !rev && !it.hint) speak(x.w);
  KEY = e => {
    if(!it.revealed){ if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); ACT.reveal(); } else if(e.key === 'h' || e.key === 'H') ACT.hint(); }
    else if(['1', '2', '3'].includes(e.key)) gradeRec(+e.key - 1);

}
function gradeRec(g){
  const it = SES.q[SES.i]; if(!it) return;
  const st = SES.st[it.id] || (SES.st[it.id] = {fail:false, isNew:!!it.isNew});
  if(g === 0){
    st.fail = true;
    reinsert({id:it.id, mode:it.mode, isNew:it.isNew}, 3 + Math.floor(Math.random() * 3));
    SES.i++; return showCard();
  }
  finalize(it.id, it.hint && g === 2 ? 1 : g, st);
  SES.i++; showCard();
}
function finalize(id, g, st){
  const t = today(), L = lg(t); let c = card(id);
  if(st.isNew){ setCard(id, [1, t + 1, 0, 1, t, c ? (c[5] || 0) : 0]); L.n++; if(inEx(examInfo(), id)) L.nx = (L.nx || 0) + 1; SES.nw++; }
  else {
    if(!c){ c = [1, t, 0, 0, t, 0]; setCard(id, c); }
    if(st.fail){ c[0] = 1; c[1] = t + 1; c[2] = (c[2] || 0) + 1; }
    else if(g === 1){ c[1] = capDue(id, t, t + Math.max(1, Math.round(I[Math.max(1, c[0])] * .5))); }
    else { c[0] = Math.min(I.length - 1, c[0] + 1); c[1] = capDue(id, t, t + fuzz(I[c[0]])); L.ok++; }
    c[3] = (c[3] || 0) + 1; c[4] = t; L.r++; SES.rev++;

}
function renderSpell(it, x, inTest){

/* ---------- 시험 ---------- */
function makeOpts(id){
  const x = W[id], got = [], ws = new Set([x.w]), ms = new Set([x.m]);
  const add = j => { const y = W[j]; if(got.length >= 3 || ws.has(y.w) || ms.has(y.m)) return; ws.add(y.w); ms.add(y.m); got.push(j); };
  shuffle(DAYS[x.d].ids.slice()).forEach(add);
  for(let off = 1; got.length < 3 && off < DAYS.length; off++)
    [x.d - off, x.d + off].forEach(dd => { if(dd >= 0 && dd < DAYS.length) shuffle(DAYS[dd].ids.slice()).forEach(add); });
  return shuffle([id, ...got]);
}
function startTest(ids, type, label){
  if(!ids.length){ toast('시험 볼 단어가 없어요'); return; }
  TS = {qs:ids.map(id => ({id, opts:type === 'mcq' || type === 'mcqr' ? makeOpts(id) : null})), i:0, type, label, t0:Date.now()};
  openStage(); showQ();
}
function showQ(){
  clearTimeout(AUTO);

  const q = TS.qs[TS.i], x = W[q.id];
  const meta = `<div class="fc-meta"><div class="tags"><span class="tag">${DN(x.d)}</span><span class="tag plain">${NUM(x.id)}</span></div>${q.done || TS.type !== 'mcqr' ? spkBtn(x.id) : ''}</div>`;
  if(TS.type === 'spell') return renderSpell(q, x, true);
  if(TS.type === 'self'){
    body(`<div class="fc rim">${meta}<div class="fc-main"><div class="word">${esc(x.w)}</div>
      ${q.revealed ? `<div class="reveal"><div class="mean lg">${fmtM(x.m)}</div><div class="divider"></div>${rootHTML(x.r)}</div>` : '<p class="hint2" style="margin:0">뜻을 떠올린 다음 확인하세요.</p>'}</div></div>
      ${q.revealed ? '<div class="acts"><button class="gbtn g0" data-act="selfG" data-g="0">몰랐어<small class="kb">1</small></button><button class="gbtn g2" data-act="selfG" data-g="1">알았어<small class="kb">2</small></button></div>'
                   : '<div class="acts one"><button class="primary" data-act="selfReveal">뜻 확인 <span class="kb">(Space)</span></button></div>'}`);
    KEY = e => { if(!q.revealed){ if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); ACT.selfReveal(); } } else if(e.key === '1' || e.key === '2') answerQ(e.key === '2'); };
    return;
  }
  const rev = TS.type === 'mcqr';
  const prompt = rev ? `<div class="mean lg">${fmtM(x.m)}</div>` : `<div class="word">${esc(x.w)}</div>`;
  const opts = q.opts.map((j, k) => {
    let cls = '';
    if(q.done){ if(j === q.id) cls = 'right'; else if(j === q.pick) cls = 'wrong'; else cls = 'fade'; }
    return `<button class="opt ${cls}" data-act="pick" data-j="${j}" ${q.done ? 'disabled' : ''}><span class="k">${k + 1}</span>${rev ? `<span class="w">${esc(W[j].w)}</span>` : `<span>${fmtM(W[j].m)}</span>`}</button>`;
  }).join('');
  body(`<div class="fc rim" style="min-height:190px">${meta}<div class="fc-main" style="padding:10px 0">${prompt}${q.done ? `<div class="reveal">${rev ? `<div class="word sm">${esc(x.w)}</div>` : ''}${rootHTML(x.r)}</div>` : ''}</div></div>
    <div class="opts">${opts}</div>
    ${q.done && !q.ok ? '<div class="acts one"><button class="primary" data-act="nextQ" data-default>다음 <span class="kb">(Enter)</span></button></div>' : ''}`);
  if(S.set.speak && !rev && !q.done) speak(x.w);
  KEY = e => {
    if(!q.done){ const k = +e.key; if(k >= 1 && k <= q.opts.length) pickOpt(q.opts[k - 1]); }
    else if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ACT.nextQ(); }
  };
}
function pickOpt(j){
  const q = TS.qs[TS.i]; if(q.done) return;
  q.done = true; q.pick = j; q.ok = j === q.id;
  showQ();
  if(q.ok){ AUTO = setTimeout(() => { if(TS && TS.qs[TS.i] === q){ TS.i++; showQ(); } }, 750); }
}
function answerQ(ok, ans){ const q = TS.qs[TS.i]; q.done = true; q.ok = ok; if(ans != null) q.ansTxt = ans; TS.i++; showQ(); }
function endTest(){
  clearTimeout(AUTO); KEY = null;
  const done = TS.qs.filter(q => q.done), n = done.length, ok = done.filter(q => q.ok).length, wrong = done.filter(q => !q.ok);
  if(!TS.ended && n){
    TS.ended = true;
    const t = today(), mc = TS.type === 'mcq' || TS.type === 'mcqr';
    for(const q of done){
      let c = card(q.id);
      if(!q.ok){ if(c){ c[0] = 1; c[1] = t; c[2] = (c[2] || 0) + 1; c[5] = (c[5] || 0) + 1; } else setCard(q.id, [1, t, 0, 0, t, 1]); }
      else if(!c) setCard(q.id, mc ? [1, t + 1, 0, 1, t, 0] : [2, capDue(q.id, t, t + 3), 0, 1, t, 0]);
      else if(c[1] <= t){ c[0] = Math.min(I.length - 1, c[0] + 1); c[1] = capDue(q.id, t, t + fuzz(I[c[0]])); c[3] = (c[3] || 0) + 1; c[4] = t; }
    }

  const sec = Math.round((Date.now() - TS.t0) / 1000), mm = Math.floor(sec / 60), ss = String(sec % 60).padStart(2, '0');
  const list = wrong.map(q => {
    const x = W[q.id]; const pickTxt = q.pick != null && q.pick !== q.id ? (TS.type === 'mcqr' ? `고른 답: ${esc(W[q.pick].w)}` : `고른 뜻: ${fmtM(W[q.pick].m)} (${esc(W[q.pick].w)})`) : (q.ansTxt ? `쓴 답: ${esc(q.ansTxt)}` : '');
    return `<div class="wrow"><div class="wtop"><button class="ww" data-act="speak" data-id="${x.id}">${esc(x.w)}</button><span class="wn">${DN(x.d)}</span></div><span></span>
      <div class="wm">${fmtM(x.m)}</div>${pickTxt ? `<div class="wm yours">${pickTxt}</div>` : ''}<div class="wr">${rootHTML(x.r, true)}</div></div>`;
  }).join('');
  body(`<div class="end"><section class="panel">
    <div class="lbl">${esc(TS.label)}, ${TYPE[TS.type]}${n < TS.qs.length ? `, ${TS.qs.length}문항 중 ${n}문항에서 중단` : ''}</div>
    <div class="score"><span class="dval">${ok}</span><span class="of">/ ${n}</span></div>
    <div class="sumline"><div><b>${Math.round(ok / n * 100)}%</b><span>정답률</span></div><div><b>${mm}:${ss}</b><span>걸린 시간</span></div><div><b>${wrong.length}</b><span>틀림</span></div></div>
    ${wrong.length ? '<p class="hint2">틀린 단어는 오늘 복습에 넣었어요.</p>' : ''}</section>
    ${wrong.length ? `<section class="panel"><h2>틀린 단어</h2><div class="wlist">${list}</div></section>` : ''}
    <div class="acts ${wrong.length ? '' : 'one'}">${wrong.length ? '<button class="ghost" data-act="retryWrong">틀린 것만 다시</button>' : ''}<button class="primary" data-act="stClose">닫기</button></div></div>`);
  TS.wrongIds = wrong.map(q => q.id);

function examSettings(){
  const e = S.set.exam || {on:false, date:'', from:0, to:0};
  return `<div class="f tg"><span>영어 시험 대비<small>범위 단어를 먼저 새로 내주고, 복습 간격을 시험 날에 맞춰 좁혀요.</small></span><button class="tog" data-act="exTog" aria-pressed="${!!e.on}" aria-label="영어 시험 대비"></button></div>
  ${e.on ? `<div class="f" style="margin-top:-6px"><input class="in" type="date" id="exDate" value="${esc(e.date || '')}" aria-label="시험 날짜"><div class="range">${daySel('exFrom', e.from)}<span>~</span>${daySel('exTo', e.to)}</div></div>` : ''}`;
}
function methodHTML(){
  return `<div class="sh-head"><h2>외우는 방식</h2><button class="close" data-act="closeSheet">닫기</button></div>
  <ol class="method">
    <li><b>보기 전에 먼저 떠올리기</b><span>뜻을 보면서 읽는 것보다, 가린 채 떠올리려고 애쓰는 쪽이 훨씬 오래 남아요(인출 연습). 그래서 카드는 항상 영어만 먼저 보여 줘요.</span></li>
    <li><b>간격을 두고 다시 만나기</b><span>맞힌 단어는 1일, 3일, 7일, 16일 뒤로 점점 멀리 보내요. 한 번에 몰아서 반복하는 것보다 날을 나눠서 보는 쪽이 장기 기억에 크게 유리해요.</span></li>
    <li><b>서로 다른 날 세 번 맞히기</b><span>한 번 익힌 뒤 다른 날 세 번 연속 맞히면 암기 완료로 쳐요. 연속 재학습 연구에서 가장 효율 좋은 기준으로 권하는 방식이에요.</span></li>
    <li><b>틀리면 그 자리에서 다시</b><span>몰랐던 단어는 몇 장 뒤에 다시 나오고, 맞힐 때까지 세션이 끝나지 않아요. 다음 날 복습에도 다시 올라가요.</span></li>
    <li><b>양쪽 방향으로</b><span>영어를 보고 뜻 떠올리기가 기본이고, 두 번 이상 맞힌 단어는 가끔 뜻을 보고 철자를 쓰게 해요. 뜻 떠올리기는 의미를, 철자 쓰기는 형태를 굳혀 줘요.</span></li>
    <li><b>비슷한 단어는 떨어뜨려서</b><span>같은 Day 단어는 어근이 같아 서로 헷갈리기 쉬워요. 복습에서는 연달아 나오지 않게 섞고, 시험의 오답 보기로는 일부러 같은 Day 단어를 넣어 구별 연습을 해요.</span></li>
    <li><b>어원은 뜻을 붙잡는 고리</b><span>새 단어는 어근 뜻을 이어 붙여 이해하고, 복습 때는 막히면 어원 힌트를 볼 수 있어요. 힌트를 본 단어는 '헷갈렸어'로 기록해서 조금 더 빨리 다시 나와요.</span></li>
  </ol>`;
}

/* ---------- 동작 ---------- */
const ACT = {
  tab(b){ TAB = b.dataset.v; render(); window.scrollTo(0, 0); },
  settings(){ openSheet(settingsHTML(false)); },
  method(){ openSheet(methodHTML()); },
  closeSheet(){ if(!S.set.ok){ S.set.ok = true; save(); } closeSheet(); render(); },
  per(b){ S.set.perDay = Math.max(5, Math.min(60, S.set.perDay + +b.dataset.v)); $('#perOut').textContent = S.set.perDay; save(); },
  tog(b){ const k = b.dataset.k; S.set[k] = !S.set[k]; b.setAttribute('aria-pressed', S.set[k]); save(); },
  exTog(){ const e = S.set.exam || (S.set.exam = {on:false, date:'', from:S.set.start, to:S.set.start}); e.on = !e.on; save(); const y = $('#sheet').scrollTop; openSheet(settingsHTML(false)); $('#sheet').scrollTop = y; renderHead(); },
  theme(b){ const v = b.dataset.v; try{ localStorage.setItem(LS_THEME, v); }catch(e){} theme(v); document.querySelectorAll('[data-act="theme"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); },
  begin(){ S.set.ok = true; save(); closeSheet(); render(); },
  xExport(){ exportData(); },
  xImport(){ xferBox(); },
  cConnect(){ cloudConnect($('#cloudIn') ? $('#cloudIn').value : ''); },
  cPull(){ if(cloudPending) cloudUse(cloudPending.id, true); },
  cPush(b){ if(!cloudPending) return; if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent = '한 번 더 누르면 덮어써요'; return; } cloudUse(cloudPending.id, false); },
  cCancel(){ cloudPending = null; paintCloudBox(); },
  cSync(){ cloudPull().then(() => toast(cloudErr ? '동기화하지 못했어요' : '동기화했어요')); },
  cOff(b){ cloudOff(b); },
  xGo(b){ const ta = $('#xferTa'); if(!ta || !ta.value.trim()){ toast('붙여 넣거나 파일을 골라 주세요'); return; } importData(ta.value, b); },
  reset(b){
    if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { if(b.isConnected){ b.classList.remove('arm'); b.textContent = '기록 지우기'; } }, 3000); return; }
    const th = S.set; S = fresh(); S.set.perDay = th.perDay; save(); closeSheet(); render(); toast('학습 기록을 지웠어요');
  },
  study(){ startStudy(); },
  more(){ if(SES) closeStage(); startStudy(10); },
  wrongTest(){ const ids = shuffle(wrongIds()).slice(0, 30); if(!ids.length){ toast('아직 틀린 단어가 없어요'); return; } startTest(ids, 'mcq', '오답 노트'); },
  gotoDay(b){ SEL_DAY = +b.dataset.d; QUERY = ''; TAB = 'book'; render(); setTimeout(() => { const el = $('#bookList'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 30); },
  selDay(b){ const d = +b.dataset.d; SEL_DAY = SEL_DAY === d ? null : d; QUERY = ''; render(); if(SEL_DAY != null) setTimeout(() => $('#bookList').scrollIntoView({behavior:'smooth', block:'start'}), 30); },
  dayStart(b){ S.set.start = +b.dataset.d; save(); render(); toast(examInfo() && unseenRange(examInfo()) ? `시험 범위를 다 본 뒤 ${DN(S.set.start)}부터 나와요` : `새 단어는 ${DN(S.set.start)}부터 나와요`); },
  dayTest(b){ const d = +b.dataset.d, c = T(); c.scope = 'range'; c.from = c.to = d; save(); startTest(shuffle(DAYS[d].ids.slice()), c.type, DN(d)); },
  speak(b){ speak(W[+b.dataset.id].w); },
  tset(b){ const c = T(), k = b.dataset.k; let v = b.dataset.v; if(k === 'n' && v !== 'all') v = +v; c[k] = v; save(); render(); },
  startTest(){
    const c = T(); let ids = testIds(c);
    let pick = c.n === 'all' || c.n >= ids.length ? ids.slice() : shuffle(ids.slice()).slice(0, c.n);
    if(c.order === 'seq') pick.sort((a, b) => a - b); else shuffle(pick);
    startTest(pick, c.type, scopeLabel(c));
  },
  stClose(){ if(TS && !TS.ended && TS.qs.some(q => q.done)) return endTest(); closeStage(); },
  learned(){ const it = SES.q[SES.i]; reinsert({id:it.id, mode:'rec', isNew:true}, 3); SES.i++; showCard(); },
  known(){
    /* 이미 아는 단어도 오늘 새 단어 개수에 포함: 대신할 새 단어를 더 끌어오지 않음 */
    const it = SES.q[SES.i], t = today(), L = lg(t); setCard(it.id, [2, capDue(it.id, t, t + 3), 0, 1, t, 0]);
    L.n++; if(inEx(examInfo(), it.id)) L.nx = (L.nx || 0) + 1;
    SES.fin++; SES.known++; SES.nw++; save();
    SES.i++; showCard();
  },
  reveal(){ const it = SES.q[SES.i]; it.revealed = true; renderRec(it, W[it.id]); },
  hint(){ const it = SES.q[SES.i]; it.hint = true; if(it.mode === 'spell'){ const v = $('#spellIn') ? $('#spellIn').value : ''; renderSpell(it, W[it.id], false); if($('#spellIn')) $('#spellIn').value = v; } else renderRec(it, W[it.id]); },
  grade(b){ gradeRec(+b.dataset.g); },
  spellCheck(){
    const it = SES ? SES.q[SES.i] : TS.qs[TS.i], inp = $('#spellIn'); if(!inp || it.checked) return;
    it.ans = inp.value; it.j = judge(inp.value, W[it.id].w); it.checked = true;
    renderSpell(it, W[it.id], !SES);
    if(it.j === 2 && TS){ const q = it; AUTO = setTimeout(() => { if(TS && TS.qs[TS.i] === q) answerQ(true, q.ans); }, 800); }
  },
  spellSkip(){ const q = TS.qs[TS.i]; q.ans = ''; q.j = 0; q.checked = true; renderSpell(q, W[q.id], true); },
  sspell(b){ const g = +b.dataset.g; const it = SES.q[SES.i]; gradeRec(g === 2 && it.hint ? 1 : g); },
  tspell(b){ clearTimeout(AUTO); const q = TS.qs[TS.i]; answerQ(+b.dataset.g > 0, q.ans); },
  pick(b){ pickOpt(+b.dataset.j); },
  nextQ(){ clearTimeout(AUTO); if(TS){ TS.i++; showQ(); } },
  selfReveal(){ const q = TS.qs[TS.i]; q.revealed = true; showQ(); },
  selfG(b){ answerQ(b.dataset.g === '1'); },
  retryWrong(){ const ids = shuffle((TS.wrongIds || []).slice()), type = TS.type, label = TS.label + ' 오답'; TS = null; startTest(ids, type, label); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'setStart'){ S.set.start = +t.value; save(); }
  else if(t.id === 'xferFile'){ const f = t.files && t.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $('#xferTa').value = String(r.result || ''); toast('파일을 읽었어요. 확인 후 바꾸기를 누르세요'); }; r.readAsText(f); t.value = ''; }
  else if(t.id === 'exDate' || t.id === 'exFrom' || t.id === 'exTo'){ const e = S.set.exam; if(t.id === 'exDate') e.date = t.value; else e[t.id === 'exFrom' ? 'from' : 'to'] = +t.value; save(); renderHead(); }
  else if(t.id === 'tFrom' || t.id === 'tTo'){ const c = T(); c[t.id === 'tFrom' ? 'from' : 'to'] = +t.value; save(); render(); }
});
document.addEventListener('keydown', e => {
  if(!$('#sheetWrap').hidden){ if(e.key === 'Escape') ACT.closeSheet(); return; }
  if($('#stage').hidden) return;
  if(e.key === 'Escape'){ ACT.stClose(); return; }
  if(e.target.tagName === 'INPUT' && e.key !== 'Enter') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(KEY) KEY(e);
});

render();
if(!S.set.ok) openSheet(settingsHTML(true));
cloudBoot();
document.addEventListener('visibilitychange', () => { if(!document.hidden && !SES && !TS) render(); });

/* ---------- Sabathia: 홈 아이콘에 오늘 진행을 알리고, 런처 뒤로가기는 설정·학습 화면부터 닫음 ---------- */
function reportHome(){
  if(!window.Sabathia) return;
  const t = today(), L = logOf(t), done = L.n + L.r, left = dueIds(t).length + Math.min(newLeft(t), newAvail()), E = examInfo();
  const exam = E ? {title: '영어 시험', date: S.set.exam.date, note: `Day ${DD(E.a)}–${DD(E.b)}`} : null;
  Sabathia.report('vocab', {done, total: done + left, pct: done + left ? done / (done + left) * 100 : 100, exam});
}
document.addEventListener('visibilitychange', () => { if(document.hidden) reportHome(); });
if(window.Sabathia) Sabathia.back = () => {
  if(!$('#sheetWrap').hidden){ ACT.closeSheet(); return true; }
  if(!$('#stage').hidden){ ACT.stClose(); return true; }
  return false;
};
})();
</script>
</body>
</html>
