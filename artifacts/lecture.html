<title>수업 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&family=Hahmlet:wght@500;800&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: 디자인 언어 v1.0 — 한 열, 3px 섹션 머리선과 1px 행 선, 하단 글자 탭바 */
:root {
  --bg: #ffffff; --ink: #000000; --muted: #5c5c5c;
  --accent: #026395; --on-accent: #ffffff;
  --warn: #d1001f; --warn-ink: #d1001f; --on-warn: #ffffff;
  --map-pending: #c4c4c4; --map-empty: #f0f0f0;
  --line-bold: 3px; --line-thin: 1px;
  --font-title: 'Hahmlet', 'Noto Serif KR', 'AppleMyungjo', serif;
  --font-body: 'Gothic A1', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --font-num: 'Space Grotesk', 'Gothic A1', ui-monospace, monospace;
  --tabbar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --ink: #ffffff; --muted: #a3a3a3;
    --accent: #4fb3e0; --on-accent: #000000;
    --warn: #e4002b; --warn-ink: #ff6b6b; --on-warn: #ffffff;
    --map-pending: #5a5a5a; --map-empty: #1c1c1c;
    --line-thin: 2px; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --ink: #ffffff; --muted: #a3a3a3;
  --accent: #4fb3e0; --on-accent: #000000;
  --warn: #e4002b; --warn-ink: #ff6b6b; --on-warn: #ffffff;
  --map-pending: #5a5a5a; --map-empty: #1c1c1c;
  --line-thin: 2px; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-weight: 500; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--tabbar) + 40px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 24px;
}
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: var(--line-bold) solid var(--ink); padding-bottom: 10px; }
.head h1 { font-family: var(--font-title); font-weight: 800; font-size: clamp(30px, 8vw, 44px); line-height: 1.1; margin: 0; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.head-r { display: flex; gap: 8px; align-items: baseline; flex-shrink: 0; padding-bottom: 4px; }
.num { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-num); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.meta { font-size: 13px; line-height: 18px; color: var(--muted); margin: 0; }
.acc { color: var(--accent); }
.big-n { font-size: 36px; line-height: 36px; letter-spacing: -.04em; }

.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: var(--line-bold) solid var(--ink); padding-top: 8px; }
.sec-h h2 { font-family: var(--font-title); font-weight: 800; font-size: 22px; line-height: 28px; margin: 0; }
.link { font-weight: 800; font-size: 14px; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.back { min-height: 32px; margin-bottom: -16px; }

.seg { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); border-bottom: var(--line-thin) solid var(--ink); }
.seg button, .tabs button { min-height: 48px; font-size: 17px; border-bottom: 3px solid transparent; margin-bottom: calc(-1 * var(--line-thin)); }
.seg button[aria-pressed="true"], .tabs button[aria-selected="true"] { font-weight: 800; color: var(--accent); border-bottom-color: var(--accent); }
.tabs { display: flex; overflow-x: auto; border-bottom: var(--line-thin) solid var(--ink); }
.tabs button { flex: 1 0 auto; padding: 0 12px; font-size: 15px; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border: var(--line-thin) solid var(--ink); }
.chip[aria-pressed="true"] { border: 2px solid var(--accent); color: var(--accent); font-weight: 800; }
.chip .num { margin-left: 6px; font-size: 13px; }
.chip-warn { background: var(--warn); color: var(--on-warn); font-weight: 800; font-size: 12px; padding: 3px 8px; letter-spacing: .04em; white-space: nowrap; }
.chip-acc { border: 2px solid var(--accent); color: var(--accent); padding: 0 8px; font-size: 14px; }

.btn { min-height: 48px; padding: 0 18px; border: var(--line-thin) solid var(--ink); font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.big { min-height: 64px; font-size: 18px; width: 100%; }
.btn.wide { width: 100%; }
.btn:disabled { color: var(--muted); border-color: var(--map-pending); background: var(--map-empty); cursor: not-allowed; }
.btn.danger { background: var(--warn); color: var(--on-warn); border-color: var(--warn); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns.two { display: grid; grid-template-columns: 1fr 1fr; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 12px 0; border-bottom: var(--line-thin) solid var(--ink); width: 100%; min-height: 64px; }
.row-m { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-k { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row-k .num { font-size: 15px; }
.row-t { font-family: var(--font-title); font-weight: 800; font-size: 18px; line-height: 24px; overflow-wrap: anywhere; }
.row-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: var(--line-thin) solid var(--ink); min-height: 52px; }
.srow span { font-weight: 800; }
.addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

.cmap { display: grid; grid-template-columns: repeat(var(--n), 6px); gap: 2px; }
.cmap i { width: 6px; height: 6px; background: var(--map-empty); }
.cmap i.p { background: var(--map-pending); }
.cmap i.f { background: var(--accent); }

.draft { border: 2px solid var(--accent); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.draft .label { color: var(--accent); }
.mic { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.mic p { margin: 0; font-size: 15px; }
.mic a { color: inherit; font-weight: 800; }
.mic ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.err { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.status { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; min-height: 24px; margin: 0; }
.status.bad { color: var(--warn-ink); }
.dot { width: 10px; height: 10px; background: var(--accent); display: inline-block; flex-shrink: 0; animation: blink 1.2s steps(2, jump-none) infinite; }
@keyframes blink { 50% { background: transparent; } }

.rec { display: flex; flex-direction: column; gap: 16px; }
.clock { font-size: clamp(64px, 22vw, 132px); line-height: .95; letter-spacing: -.05em; }
.live { border-top: var(--line-bold) solid var(--ink); padding-top: 12px; min-height: 36vh; max-height: 52vh; overflow-y: auto; white-space: pre-wrap; font-size: 17px; line-height: 1.7; overflow-wrap: anywhere; }
.live .int { color: var(--muted); }
.live .ph { color: var(--muted); }

.fields { display: grid; grid-template-columns: 1fr 180px; gap: 12px; }
@media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input, textarea { font: inherit; color: var(--ink); background: var(--bg); border: var(--line-thin) solid var(--ink); border-radius: 0; padding: 10px 12px; min-height: 48px; width: 100%; }
textarea { line-height: 1.7; resize: vertical; }
#f-tx { min-height: 45vh; }
textarea.short { min-height: 140px; font-size: 14px; }
details.manual { border-top: var(--line-thin) solid var(--ink); padding-top: 12px; }
details.manual > summary { font-weight: 800; cursor: pointer; min-height: 32px; }
details.manual[open] > summary { margin-bottom: 12px; }
.manual-b { display: flex; flex-direction: column; gap: 10px; }

.lede { font-size: 17px; line-height: 1.75; margin: 0; }
.pt { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px 0; border-bottom: var(--line-thin) solid var(--ink); }
.grade { font-weight: 800; font-size: 13px; height: 28px; display: flex; align-items: center; justify-content: center; }
.g-0 { border: 2px solid var(--accent); color: var(--accent); }
.g-1 { border: var(--line-thin) solid var(--ink); }
.g-2 { color: var(--muted); }
.pt-b { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pt-t { font-weight: 800; font-size: 16px; line-height: 22px; }
.body { font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
.quote { font-size: 13px; line-height: 18px; color: var(--muted); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; line-height: 1.55; }
th { text-align: left; font-weight: 800; font-size: 12px; border-bottom: var(--line-bold) solid var(--ink); padding: 6px 10px 6px 0; }
td { border-bottom: var(--line-thin) solid var(--ink); padding: 10px 10px 10px 0; vertical-align: top; }
td:first-child { font-weight: 800; }
.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
details.trap { border-bottom: var(--line-thin) solid var(--ink); padding: 12px 0; }
details.trap summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; gap: 4px; }
details.trap summary::-webkit-details-marker { display: none; }
details.trap .ans { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
details.trap[open] .hint { display: none; }
.kv { padding: 12px 0; border-bottom: var(--line-thin) solid var(--ink); display: flex; flex-direction: column; gap: 4px; }
.kv b { font-weight: 800; }
ol.flow { list-style: none; margin: 0; padding: 0; counter-reset: f; }
.flow li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 12px 0; border-bottom: var(--line-thin) solid var(--ink); counter-increment: f; }
.flow li::before { content: counter(f, decimal-leading-zero); font-family: var(--font-num); font-weight: 700; font-size: 14px; line-height: 22px; }
.hw label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: var(--line-thin) solid var(--ink); min-height: 48px; cursor: pointer; }
.hw input { width: 22px; height: 22px; min-height: 0; flex-shrink: 0; accent-color: var(--accent); margin: 1px 0 0; }
.hw .done { color: var(--muted); text-decoration: line-through; }
.crow { padding: 12px 0; border-bottom: var(--line-thin) solid var(--ink); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.crow .q { font-weight: 800; }
.crow .a { color: var(--muted); font-size: 15px; grid-column: 1; }
.crow .label { grid-row: 1; grid-column: 2; }
.raw { white-space: pre-wrap; font-size: 15px; line-height: 1.8; overflow-wrap: anywhere; }
.empty { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 8px 0; }
.empty p { margin: 0; }
.foot { border-top: var(--line-thin) solid var(--ink); padding-top: 16px; }

.flash { border-top: var(--line-bold) solid var(--ink); padding-top: 12px; display: flex; flex-direction: column; gap: 20px; min-height: 36vh; }
.fq { font-family: var(--font-title); font-weight: 800; font-size: clamp(22px, 6vw, 30px); line-height: 1.4; text-wrap: balance; overflow-wrap: anywhere; }
.fa { border-top: var(--line-thin) solid var(--ink); padding-top: 12px; font-size: 18px; line-height: 1.6; font-weight: 800; overflow-wrap: anywhere; }
.score { display: flex; gap: 24px; }
.score div { display: flex; flex-direction: column; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: var(--line-bold) solid var(--ink);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { height: var(--tabbar); font-size: 15px; text-align: center; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 800; }
.tabbar button:disabled { color: var(--muted); cursor: not-allowed; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--ink); color: var(--bg); padding: 10px 16px; font-weight: 800; font-size: 14px; max-width: calc(100% - 40px); }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>

<main id="main" class="wrap"></main>
<nav class="tabbar" aria-label="화면"><div class="tabbar-in">
  <button data-act="go" data-v="new" data-tab="new">새 수업</button>
  <button data-act="go" data-v="list" data-tab="list">목록</button>
  <button data-act="go" data-v="review" data-tab="review">복습</button>
  <button data-act="go" data-v="subjects" data-tab="subjects">과목</button>
</div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- 상수 ---------- */
const DEF_SUBJ = { school: ['국어', '수학', '영어', '한국사', '사회', '과학'], academy: ['수학', '영어', '국어', '과학'] };
const MODE = {
  school: { name: '학교', code: 'SCH', desc: '내신 대비. 선생님 강조 발언, 교과서 밖 설명, 용어·수치, 비교쌍, 판서·프린트를 뽑아 출제 가능성 등급과 암기 카드로 정리합니다.' },
  academy: { name: '학원', code: 'ACA', desc: '개념 흐름과 풀이 전략. 개념 연결, 유형별 접근법, 숏컷, 실수 포인트, 숙제를 정리합니다.' },
};
const IV = [0, 1, 2, 4, 8, 16];              // 상자별 다음 복습까지 일수
const GRADE = { '상': 0, '중': 1, '하': 2 };
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition || null;

/* ---------- 작은 도구 ---------- */
const $ = s => document.querySelector(s);
const main = $('#main');
function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem('lec.' + k);
    if (v === null) localStorage.removeItem('lec.' + k); else localStorage.setItem('lec.' + k, v);
  } catch (e) { return null; }
}
function lsj(k, v) {
  if (v === undefined) { try { return JSON.parse(ls(k) || 'null'); } catch (e) { return null; } }
  ls(k, v === null ? null : JSON.stringify(v));
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const str = v => typeof v === 'string' ? v.trim() : (v == null ? '' : String(v));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
function addDays(s, n) { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); }
const md = s => s ? s.slice(5).replace('-', '.') : '';
function mmss(sec) {
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const p2 = n => String(n).padStart(2, '0');
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- 상태 ---------- */
const S = {
  view: 'new', mode: ls('mode') === 'academy' ? 'academy' : 'school', subject: '',
  subjects: lsj('subjects') || DEF_SUBJ, lectures: [], loaded: false,
  store: 'loading', storeNote: '', sample: undefined,
  draft: lsj('draft'), cur: null, tab: 'sum', tx: {},
  listMode: 'all', listSubj: '', rv: null, rvSubj: '',
  busy: '', err: '', micBlocked: ls('micBlocked') === '1',
};
S.subject = ls('subject.' + S.mode) || '';
const lec = id => S.lectures.find(x => x.id === id);

/* ---------- 저장소 (아티팩트 DB, 없으면 이 기기) ---------- */
const Store = {
  db: null, q: {},
  queue(key, fn) { const p = (this.q[key] || Promise.resolve()).then(fn); this.q[key] = p.catch(() => {}); return p; },
  async init() {
    const use = window.claude && window.claude.use ? n => window.claude.use(n).catch(() => null) : async () => null;
    const t = setTimeout(() => { if (S.store === 'loading') { S.storeNote = '저장소 연결을 기다리는 중입니다.'; refresh(); } }, 10000);
    const [db, sm] = await Promise.all([use('db'), use('sample')]);
    clearTimeout(t);
    S.sample = sm || null;
    if (db) { this.db = db; S.store = 'db'; S.storeNote = ''; this.subscribe(); }
    else { S.store = 'local'; S.storeNote = '온라인 저장을 쓸 수 없어 이 기기 브라우저에만 저장합니다.'; S.lectures = lsj('lectures') || []; S.loaded = true; }
    refresh();
  },
  subscribe() {
    const t = setTimeout(() => { if (!S.loaded) { S.storeNote = '저장된 수업을 아직 불러오지 못했습니다. 네트워크를 확인하세요.'; refresh(); } }, 10000);
    this.db.collection('lectures').orderBy('createdAt', 'desc').onSnapshot(snap => {
      if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(t); S.storeNote = ''; }
      S.lectures = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); S.loaded = true; refresh();
    }, e => { clearTimeout(t); S.storeNote = '저장소에 연결하지 못했습니다(' + (e && e.code || '오류') + '). 페이지를 다시 열어 주세요.'; S.loaded = true; refresh(); });
    this.db.doc('settings/subjects').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (d && Array.isArray(d.school) && Array.isArray(d.academy)) { S.subjects = { school: d.school, academy: d.academy }; lsj('subjects', S.subjects); refresh(); }
    }, () => {});
  },
  async saveLecture(l, transcript) {
    await this.ready;
    const parts = []; for (let i = 0; i < transcript.length; i += 60000) parts.push(transcript.slice(i, i + 60000));
    if (!parts.length) parts.push('');
    l.txParts = parts.length; l.txChars = transcript.length; S.tx[l.id] = transcript;
    if (this.db) {
      for (let i = 0; i < parts.length; i++) {
        const path = 'tx/' + l.id + '-' + i;
        await this.queue(path, () => this.db.doc(path).set({ lecture: l.id, i, text: parts[i] }));
      }
      await this.queue('lectures/' + l.id, () => this.db.doc('lectures/' + l.id).set(l));
      if (!lec(l.id)) S.lectures.unshift(l);
    } else {
      S.lectures = S.lectures.filter(x => x.id !== l.id); S.lectures.unshift(l);
      ls('tx.' + l.id, transcript); lsj('lectures', S.lectures);
    }
  },
  async update(id, patch) {
    await this.ready;
    const l = lec(id); if (l) Object.assign(l, patch);
    if (this.db) return this.queue('lectures/' + id, () => this.db.doc('lectures/' + id).update(patch));
    lsj('lectures', S.lectures);
  },
  async remove(id) {
    await this.ready;
    const l = lec(id), n = (l && l.txParts) || 1;
    S.lectures = S.lectures.filter(x => x.id !== id); delete S.tx[id];
    if (this.db) {
      await this.queue('lectures/' + id, () => this.db.doc('lectures/' + id).delete());
      for (let i = 0; i < n; i++) await this.db.doc('tx/' + id + '-' + i).delete();
    } else { lsj('lectures', S.lectures); ls('tx.' + id, null); }
  },
  async transcript(id) {
    if (S.tx[id] != null) return S.tx[id];
    await this.ready;

const R = {
  on: false, active: false, stopping: false, sr: null, final: '', sess: [], interim: '',

};
function startRec() {
  R.blocked = ''; R.lastErr = '';
  if (!SRC) { R.blocked = 'unsupported'; markBlocked(); S.view = 'rec'; render(); return; }
  R.final = S.draft.transcript || ''; R.sess = []; R.interim = ''; R.acc = S.draft.durationSec || 0;
  R.on = true; R.since = Date.now(); S.view = 'rec'; render();
  spawn(); wake(true);
  clearInterval(R.timer);
  R.timer = setInterval(() => { const c = $('#clock'); if (c) c.textContent = mmss(R.elapsed()); }, 1000);
}
function spawn() {
  if (!R.on || R.active) return;
  let sr; try { sr = new SRC(); } catch (e) { R.blocked = 'unsupported'; endBlocked(); return; }
  sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true; sr.maxAlternatives = 1;
  sr.onstart = () => { R.active = true; R.lastErr = ''; paintLive(); };
  sr.onresult = e => {
    const fin = []; let it = '';
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i], t = str(r[0] && r[0].transcript);
      if (!t) continue;
      if (r.isFinal) { const p = fin[fin.length - 1]; if (p && t.startsWith(p)) fin[fin.length - 1] = t; else fin.push(t); } // 안드로이드 누적 결과 보정
      else it = t;
    }
    R.sess = fin; R.interim = it; paintLive();
  };
  sr.onerror = e => {
    if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) { R.blocked = e.error; endBlocked(); }
    else if (e.error !== 'no-speech' && e.error !== 'aborted') { R.lastErr = e.error; paintLive(); }
  };
  sr.onend = () => {
    R.active = false; commit();
    if (R.blocked) return;
    if (R.on) { if (document.visibilityState === 'visible') setTimeout(spawn, 250); paintLive(); }
    else if (R.stopping) finishRec();
  };
  R.sr = sr;
  try { sr.start(); } catch (e) { setTimeout(spawn, 1000); }
}
function commit() {
  const add = R.sess.join(' ') || R.interim;
  if (add) R.final += (R.final ? '\n' : '') + add;
  R.sess = []; R.interim = '';
  if (S.draft) { S.draft.transcript = R.final; S.draft.durationSec = Math.round(R.elapsed()); saveDraft(); }
}
function stopRec() {
  R.acc = R.elapsed(); R.since = 0; R.on = false; R.stopping = true; clearInterval(R.timer);
  if (R.active && R.sr) { try { R.sr.stop(); } catch (e) {} setTimeout(() => { if (R.stopping) finishRec(); }, 2000); }
  else finishRec();
}
function finishRec() {
  if (!R.stopping) return;
  R.stopping = false; commit(); wake(false);
  if ((R.final || '').trim()) { S.micBlocked = false; ls('micBlocked', null); }
  S.view = 'edit'; render();
}
function markBlocked() { S.micBlocked = true; ls('micBlocked', '1'); }
function endBlocked() {
  if (!R.on && !R.stopping) { render(); return; }
  R.acc = R.elapsed(); R.since = 0; R.on = false; R.stopping = false; clearInterval(R.timer);

}
function wake(on) {

  else { try { R.wake && R.wake.release().catch(() => {}); } catch (e) {} R.wake = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && R.on) { wake(true); if (!R.active) spawn(); paintLive(); }
});
function paintLive() {
  const el = $('#live'); if (!el) return;
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  const sess = R.sess.join(' ');
  const fin = R.final + (sess ? (R.final ? '\n' : '') + sess : '');
  el.innerHTML = fin || R.interim ? esc(fin) + (R.interim ? '<span class="int">' + (fin ? ' ' : '') + esc(R.interim) + '</span>' : '')
    : '<span class="ph">말소리가 들리면 여기에 글자가 나타납니다.</span>';

  else if (R.active) { st.className = 'status'; st.innerHTML = '<i class="dot"></i>듣는 중'; }
  else { st.className = 'status'; st.textContent = document.visibilityState === 'visible' ? '다시 연결하는 중' : '화면이 꺼져 멈춤'; }
}

  const set = new Set();
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (Math.abs(i - j) <= 1) set.add(i + ',' + j);
  for (let t = 0; t < n; t++) { const a = Math.floor(rnd() * n), b = Math.floor(rnd() * n); if (Math.abs(a - b) >= 2) { set.add(a + ',' + b); set.add(b + ',' + a); } }
  const order = [...set].map(k => k.split(',').map(Number)).sort((p, q) => Math.abs(p[0] - p[1]) - Math.abs(q[0] - q[1]) || Math.min(...p) - Math.min(...q) || p[0] - q[0]);
  const filled = new Set(order.slice(0, Math.round(order.length * pct / 100)).map(c => c.join(',')));
  let cells = '';
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const k = i + ',' + j; cells += `<i class="${filled.has(k) ? 'f' : set.has(k) ? 'p' : ''}"></i>`; }
  return `<span class="cmap" style="--n:${n}" role="img" aria-label="${esc(label || pct + '퍼센트')}">${cells}</span>`;
}

function dueCards(subj, lid) {

function cardPct(l) { const c = l.cards || []; return c.length ? Math.round(c.filter(x => (x.box || 0) >= 3).length / c.length * 100) : 0; }

/* ---------- 화면: 복습 ---------- */
function vReview() {
  const rv = S.rv;
  if (rv && rv.active) {
    const it = rv.list[rv.i], l = lec(it.lid), c = l && l.cards && l.cards[it.idx];
    if (!c) { rv.i++; if (rv.i >= rv.list.length) { rv.active = false; rv.done = true; } return vReview(); }
    main.innerHTML = `${head('복습', `<span class="num">${rv.i + 1} / ${rv.list.length}</span>`)}
    <section class="flash">
      <span class="label">${l.mode === 'academy' ? 'ACA' : 'SCH'} · ${esc(l.subject)} · ${esc(l.title)}</span>
      <div class="fq">${esc(c.q)}</div>
      ${rv.show ? `<div class="fa">${esc(c.a)}</div>` : ''}
    </section>
    ${rv.show ? `<div class="btns two"><button class="btn big" data-act="grade" data-v="0">모름</button><button class="btn primary big" data-act="grade" data-v="1">앎</button></div>`
      : `<button class="btn primary big" data-act="flip">정답 보기</button>`}
    <button class="link" data-act="endReview">그만하기</button>`;
    return;
  }
  const all = dueCards(), bySubj = {};
  for (const x of all) { const s = lec(x.lid).subject; bySubj[s] = (bySubj[s] || 0) + 1; }
  if (S.rvSubj && !bySubj[S.rvSubj]) S.rvSubj = '';
  const n = S.rvSubj ? bySubj[S.rvSubj] : all.length;
  const anyCards = S.lectures.some(l => (l.cards || []).length);
  main.innerHTML = `${head('복습', `<span class="num big-n ${n ? 'acc' : ''}">${p2(n)}</span><span class="meta">장</span>`)}
  ${note()}
  ${rv && rv.done ? `<section class="sec"><div class="sec-h"><h2>복습을 마쳤습니다</h2></div><div class="score"><div><span class="label">앎</span><span class="num big-n">${p2(rv.ok)}</span></div><div><span class="label">모름</span><span class="num big-n">${p2(rv.no)}</span></div></div></section>` : ''}
  ${Object.keys(bySubj).length > 1 ? `<div class="chips"><button class="chip" data-act="rvSubj" data-v="" aria-pressed="${!S.rvSubj}">모든 과목<span class="num">${all.length}</span></button>${Object.entries(bySubj).map(([s, k]) => `<button class="chip" data-act="rvSubj" data-v="${esc(s)}" aria-pressed="${S.rvSubj === s}">${esc(s)}<span class="num">${k}</span></button>`).join('')}</div>` : ''}
  ${n ? `<button class="btn primary big" data-act="startReview">복습 시작</button>` : `<p class="meta">${anyCards ? '오늘 볼 카드가 없습니다.' : '정리한 수업의 암기 카드가 여기에 쌓입니다.'}</p>`}
  <p class="meta">앎을 누르면 1, 2, 4, 8, 16일 간격으로 다시 나옵니다. 모름은 이번 복습 끝에 한 번 더, 그리고 내일 다시 나옵니다.</p>`;
}
function startReview(lid) {
  const list = dueCards(lid ? null : S.rvSubj || null, lid || null);
  if (!list.length) { toast('복습할 카드가 없습니다'); return; }
  S.rv = { active: true, list, i: 0, show: false, ok: 0, no: 0, again: new Set() };
  go('review');
}
function gradeCard(ok) {
  const rv = S.rv, it = rv.list[rv.i], l = lec(it.lid);
  if (l && l.cards && l.cards[it.idx]) {
    const cards = l.cards.map(c => Object.assign({}, c)), c = cards[it.idx];
    if (ok) { c.box = Math.min((c.box || 0) + 1, 5); c.due = addDays(today(), IV[c.box]); }
    else { c.box = 1; c.due = addDays(today(), 1); }
    Store.update(l.id, { cards }).catch(() => toast('복습 기록을 저장하지 못했습니다'));
  }
  const key = it.lid + ':' + it.idx;
  if (ok) rv.ok++; else { rv.no++; if (!rv.again.has(key)) { rv.again.add(key); rv.list.push(it); } }
  rv.i++; rv.show = false;
  if (rv.i >= rv.list.length) { rv.active = false; rv.done = true; }
  render();
}

/* ---------- 화면: 과목 ---------- */
function vSubjects() {
  main.innerHTML = `${head('과목', '')}
  ${['school', 'academy'].map(m => sec(MODE[m].name, S.subjects[m].length, `
    <div>${S.subjects[m].map(s => `<div class="srow"><span>${esc(s)}</span><button class="link" data-act="rmSubj" data-v="${m}|${esc(s)}">삭제</button></div>`).join('')}</div>
    <div class="addrow"><input id="add-${m}" data-add="${m}" placeholder="${MODE[m].name} 과목 추가" maxlength="20"><button class="btn" data-act="addSubj" data-v="${m}">추가</button></div>`)).join('')}
  <p class="meta">과목을 지워도 저장한 수업은 그대로 남습니다.</p>`;
}
function addSubj(m) {
  const inp = $('#add-' + m), v = str(inp && inp.value);
  if (!v) return;
  if (S.subjects[m].includes(v)) { toast('이미 있는 과목입니다'); return; }
  S.subjects = Object.assign({}, S.subjects, { [m]: [...S.subjects[m], v] });
  Store.saveSubjects().catch(() => toast('과목을 저장하지 못했습니다'));
  render(); const n = $('#add-' + m); if (n) n.focus();
}

/* ---------- 라우팅 ---------- */
const HASHV = ['new', 'list', 'review', 'subjects'];
let skipHash = false;
function setHash(h) { if (location.hash !== '#' + h) { skipHash = true; location.hash = h; } }
function fromHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('l-')) { const id = h.slice(2); if (S.cur !== id) { S.cur = id; S.tab = 'sum'; } S.view = 'lecture'; }
  else S.view = HASHV.includes(h) ? h : 'new';
}
addEventListener('hashchange', () => {
  if (skipHash) { skipHash = false; return; }
  if (R.on || R.stopping) return;
  fromHash(); render();
});
function go(v, id) {
  if (R.on || R.stopping) return;
  S.err = '';
  if (v === 'lecture') { if (S.cur !== id) S.tab = 'sum'; S.cur = id; setHash('l-' + id); }
  else if (HASHV.includes(v)) setHash(v);
  S.view = v; render(); window.scrollTo(0, 0);
}
function render() {
  const tab = { new: 'new', rec: 'new', edit: 'new', list: 'list', lecture: 'list', review: 'review', subjects: 'subjects' }[S.view];
  document.querySelectorAll('.tabbar button').forEach(b => {
    if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    b.disabled = R.on || R.stopping;
  });
  ({ new: vNew, rec: vRec, edit: vEdit, list: vList, lecture: vLecture, review: vReview, subjects: vSubjects }[S.view] || vNew)();
}
function refresh() {
  if (S.view === 'rec' || S.view === 'edit') return;
  if (S.view === 'review' && S.rv && S.rv.active) return;
  render();
}

/* ---------- 이벤트 ---------- */
function arm(b, fn, label) {
  if (b.dataset.armed) { fn(); return; }
  const old = b.textContent; b.dataset.armed = '1'; b.textContent = label; b.classList.add('danger');
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; b.classList.remove('danger'); } }, 4000);
}
const ACT = {
  go: v => go(v),
  mode: v => { S.mode = v; ls('mode', v); S.subject = ls('subject.' + v) || ''; render(); },
  subj: v => { S.subject = v; ls('subject.' + S.mode, v); render(); },
  rec: () => { newDraft(); startRec(); },
  type: () => { newDraft(); S.view = 'edit'; render(); },
  resume: () => { S.err = ''; S.view = 'edit'; render(); },
  discard: (v, b) => arm(b, () => { S.draft = null; lsj('draft', null); S.err = ''; S.busy = ''; go('new'); }, '버리기 확인'),
  stop: () => stopRec(),
  toEdit: () => { R.blocked = ''; S.view = 'edit'; render(); },
  more: () => startRec(),
  summarize: () => doSummarize(),
  saveRaw: async () => {
    if (S.busy) return;
    if (!str(S.draft.transcript)) { S.err = '전사문이 비어 있습니다.'; paintBusy(); return; }
    try { await saveDraftAsLecture(null, []); } catch (e) { S.busy = ''; S.err = errText(e); paintBusy(); }
  },
  open: v => go('lecture', v),
  tab: v => { S.tab = v; render(); },
  resum: () => doSummarize(S.cur),
  del: (v, b) => arm(b, async () => { const id = S.cur; go('list'); try { await Store.remove(id); refresh(); toast('삭제했습니다'); } catch (e) { toast('삭제하지 못했습니다'); } }, '삭제 확인'),
  copyRaw: () => { const t = S.tx[S.cur]; if (t == null) { toast('원문을 불러오는 중입니다'); return; } copyText(t); },
  copyPrompt: v => {
    let mode, subject, t;
    if (v) { const l = lec(v); t = S.tx[v]; if (t == null) { toast('원문을 불러오는 중입니다. 잠시 뒤 다시 누르세요'); return; } mode = l.mode; subject = l.subject; }
    else { ({ mode, subject } = S.draft); t = str(S.draft.transcript); }
    if (!str(t)) { toast('전사문이 비어 있습니다'); return; }
    copyText(buildPrompt(mode, subject, t));
  },
  applyManual: async v => {
    const ta = $('#f-manual-' + (v || 'd'));
    let raw; try { raw = parseLoose(ta && ta.value); } catch (e) { toast('JSON을 찾지 못했습니다. Claude의 답 전체를 붙여넣으세요'); return; }
    const mode = v ? lec(v).mode : S.draft.mode;
    const { summary, cards } = norm(mode, raw);
    if (!summary.overview && !cards.length) { toast('정리 내용이 비어 있습니다'); return; }
    try {
      if (v) { await Store.update(v, { summary, cards: freshCards(cards, lec(v).cards), summarizedAt: Date.now() }); S.tab = 'sum'; render(); }
      else await saveDraftAsLecture(summary, freshCards(cards));
    } catch (e) { S.busy = ''; S.err = errText(e); paintBusy(); }
  },
  reviewLec: () => startReview(S.cur),
  startReview: () => startReview(),
  rvSubj: v => { S.rvSubj = v; render(); },
  flip: () => { S.rv.show = true; render(); },
  grade: v => gradeCard(v === '1'),
  endReview: () => { S.rv = null; render(); },
  listMode: v => { S.listMode = v; render(); },
  listSubj: v => { S.listSubj = v; render(); },
  addSubj: v => addSubj(v),
  rmSubj: v => {
    const i = v.indexOf('|'), m = v.slice(0, i), name = v.slice(i + 1);
    S.subjects = Object.assign({}, S.subjects, { [m]: S.subjects[m].filter(s => s !== name) });
    Store.saveSubjects().catch(() => toast('과목을 저장하지 못했습니다')); render();
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset.v, b, e);
});
document.addEventListener('input', e => {
  if (e.target.dataset.inbox) { const v = e.target.value; e.target.value = ''; intake(v); return; }
  if (e.target.id === 'f-tx' && S.draft && parseHeader(e.target.value)) {
    applyHeader(S.draft, e.target.value); saveDraft(); render(); toast('녹음 앱의 머리줄로 모드·과목·날짜를 채웠습니다'); return;
  }
  const k = e.target.dataset.in;
  if (!k || k === 'file' || S.view !== 'edit' || !S.draft) return;
  S.draft[k] = e.target.value;
  if (k === 'transcript') { const c = $('#txCount'); if (c) c.textContent = e.target.value.length.toLocaleString(); }
  saveDraftSoon();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.add && !e.isComposing) { e.preventDefault(); addSubj(e.target.dataset.add); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.in === 'file' && t.files && t.files[0]) {
    const file = t.files[0], r = new FileReader();
    r.onload = () => {
      let text = String(r.result || '');
      if (/\.(srt|vtt)$/i.test(file.name)) {
        text = text.split(/\r?\n/).filter(x => !/^WEBVTT/.test(x) && !/^\d+$/.test(x.trim()) && !/-->/.test(x) && !/^NOTE\b/.test(x)).map(x => x.trim()).filter(Boolean).join(' ');
      }
      if (!str(S.draft.transcript) && parseHeader(text)) applyHeader(S.draft, text);
      else S.draft.transcript = (str(S.draft.transcript) ? S.draft.transcript.trim() + '\n' : '') + text.trim();
      saveDraft(); render(); toast(file.name + ' 불러옴');
    };
    r.onerror = () => toast('파일을 읽지 못했습니다');
    r.readAsText(file);
  } else if (t.dataset.hw != null) {
    const l = lec(S.cur); if (!l) return;
    const i = Number(t.dataset.hw), done = new Set(l.hwDone || []);
    if (t.checked) done.add(i); else done.delete(i);
    Store.update(l.id, { hwDone: [...done].sort((a, b) => a - b) }).catch(() => toast('저장하지 못했습니다'));
    const sp = t.nextElementSibling; if (sp) sp.classList.toggle('done', t.checked);
  }
});

/* ---------- 시작 ---------- */
fromHash();
render();
Store.ready = Store.init();
</script>
