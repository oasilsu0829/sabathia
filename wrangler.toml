name = "jarvis"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "jarvis-db"
database_id = "REPLACE_WITH_ID"   # npx wrangler d1 create jarvis-db 결과로 교체

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "mailto:you@example.com"
# VAPID_PUBLIC, VAPID_PRIVATE_JWK, APP_TOKEN 은 secret 으로 등록 (README 참고)
