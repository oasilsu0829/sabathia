name = "sabathia"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "jarvis-db"
database_id = "985e94ca-450f-49d2-a67b-f60269f6861b"

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "https://github.com/oasilsu0829/sabathia"
# VAPID_PUBLIC, VAPID_PRIVATE_JWK 는 secret 으로 등록 (README 참고)
# API_TOKEN (secret, 선택): 있으면 /api/events 에 Bearer 토큰이 필요하다. OpenClaw 스킬이 이 값을 쓴다
